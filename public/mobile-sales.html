<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Mobil Müşteri Arama</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f1f5f9;color:#0f172a;padding-bottom:90px}.top{position:sticky;top:0;z-index:5;background:#0f172a;color:white;padding:14px 14px 12px;box-shadow:0 3px 12px #0002}.top h1{font-size:20px;margin:0}.sub{font-size:12px;opacity:.8;margin-top:3px}.controls{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}.controls input,.controls select{width:100%;border:0;border-radius:11px;padding:12px;font-size:16px}.btn{border:0;border-radius:12px;padding:12px 14px;font-weight:800;font-size:15px;cursor:pointer}.refresh{background:#e2e8f0;color:#0f172a}.wrap{padding:12px}.summary{font-size:13px;color:#475569;margin:2px 2px 10px}.card{background:white;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px #0f172a12;border:1px solid #e2e8f0}.head{display:flex;justify-content:space-between;gap:10px}.company{font-size:18px;font-weight:900;line-height:1.2}.pill{font-size:11px;font-weight:900;padding:5px 8px;border-radius:999px;background:#dbeafe;color:#1e40af;white-space:nowrap;height:max-content}.meta{margin-top:7px;color:#475569;font-size:13px}.area{margin-top:8px;font-size:13px;line-height:1.35;background:#f8fafc;padding:9px;border-radius:10px}.areaedit{margin-top:8px;display:flex;align-items:center;gap:7px}.areaedit span{font-size:12px;font-weight:900;color:#64748b;white-space:nowrap}.areaedit input{width:100%;min-width:0;border:1px solid #cbd5e1;background:#fff;border-radius:8px;padding:7px 9px;font-size:13px;font-weight:700;color:#0f172a}.areaedit input:focus{outline:2px solid #93c5fd;border-color:#2563eb}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.call{background:#16a34a;color:white}.note{background:#2563eb;color:white}.later{background:#f59e0b;color:#3b2500}.good{background:#dcfce7;color:#166534}.bad{background:#fee2e2;color:#991b1b}.more{grid-column:1/-1;background:#e2e8f0}.empty{padding:40px 15px;text-align:center;color:#64748b}.login{position:fixed;inset:0;z-index:20;background:#0f172af2;display:none;align-items:center;justify-content:center;padding:18px}.login.show{display:flex}.loginbox{background:white;width:min(420px,100%);border-radius:18px;padding:20px}.loginbox h2{margin:0 0 14px}.loginbox select,.loginbox input{width:100%;font-size:17px;padding:13px;border:1px solid #cbd5e1;border-radius:11px;margin-bottom:10px}.primary{background:#2563eb;color:white;width:100%}.err{color:#b91c1c;font-size:13px;margin-top:8px}.modal{position:fixed;inset:0;z-index:15;background:#0f172aa8;display:none;align-items:flex-end}.modal.show{display:flex}.sheet{background:white;width:100%;border-radius:22px 22px 0 0;padding:18px 15px calc(18px + env(safe-area-inset-bottom));max-height:85vh;overflow:auto}.sheet h3{margin:0 0 4px}.sheet textarea,.sheet input,.sheet select{width:100%;font-size:16px;padding:12px;border:1px solid #cbd5e1;border-radius:11px;margin-top:10px}.sheetactions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.cancel{background:#e2e8f0}.save{background:#2563eb;color:white}.toast{position:fixed;left:12px;right:12px;bottom:14px;z-index:30;background:#0f172a;color:white;border-radius:12px;padding:12px 14px;text-align:center;font-weight:800;display:none}.toast.err{background:#b91c1c;color:white}.filters{display:flex;gap:7px;overflow:auto;padding-top:9px}.filter{border:1px solid #475569;background:#1e293b;color:#e2e8f0;padding:7px 10px;border-radius:999px;white-space:nowrap;font-size:12px;font-weight:800}.filter.on{background:white;color:#0f172a}
</style>
</head>
<body>
<div class="top"><h1>📞 Müşteri Arama</h1><div class="sub">Telefonda sadece gerekli olanlar</div><div class="controls"><input id="search" placeholder="Firma / il / iş alanı ara"><button class="btn refresh" onclick="load()">↻</button></div><div class="filters"><button class="filter on" data-filter="Bekleyen" onclick="setFilter('Bekleyen',this)">Aranacak</button><button class="filter" data-filter="Aktif" onclick="setFilter('Aktif',this)">Aktif</button><button class="filter" data-filter="Tümü" onclick="setFilter('Tümü',this)">Tümü</button></div></div>
<div class="wrap"><div id="summary" class="summary"></div><div id="list"></div></div>
<div id="login" class="login"><div class="loginbox"><h2>CRM Girişi</h2><select id="user"><option>Ali</option><option>Çağatay</option><option>Recep</option></select><input id="pw" type="password" inputmode="numeric" placeholder="Şifre"><button class="btn primary" onclick="login()">Giriş Yap</button><div id="loginErr" class="err"></div></div></div>
<div id="noteModal" class="modal" onclick="if(event.target===this)closeNote()"><div class="sheet"><h3 id="noteTitle">Görüşme Notu</h3><div id="noteArea" class="sub" style="color:#64748b"></div><textarea id="noteText" rows="5" placeholder="Ne konuşuldu?"></textarea><label style="display:block;margin-top:10px;font-weight:800">Sonraki arama tarihi</label><input id="followDate" type="date"><select id="result"><option value="Beklemede">Beklemede</option><option value="Tekrar Görüşülecek">Tekrar Görüşülecek</option><option value="Olumlu">Olumlu</option><option value="Olumsuz">Olumsuz</option></select><div class="sheetactions"><button class="btn cancel" onclick="closeNote()">Vazgeç</button><button class="btn save" onclick="saveNote()">Kaydet</button></div></div></div>
<div id="toast" class="toast"></div>
<script>
let customers=[],meetings=[],filter='Bekleyen',current=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function localDate(){const d=new Date(),x=new Date(d.getTime()-d.getTimezoneOffset()*60000);return x.toISOString().slice(0,10)}
function plusDays(n){const d=new Date();d.setDate(d.getDate()+n);return localDate.call(null,d)}
async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{'content-type':'application/json',...(opt.headers||{})}});let d={};try{d=await r.json()}catch{}if(r.status===401){$('login').classList.add('show');throw new Error('Giriş gerekli')}if(!r.ok)throw new Error(d.error||'İşlem başarısız');return d}
function toast(text,bad=false){const t=$('toast');t.textContent=text;t.className='toast'+(bad?' err':'');t.style.display='block';clearTimeout(window._tt);window._tt=setTimeout(()=>t.style.display='none',2500)}
async function session(){try{await api('/api/session');$('login').classList.remove('show');await load()}catch(e){if(e.message!=='Giriş gerekli')$('login').classList.add('show')}}
async function login(){try{const r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({user:$('user').value,password:$('pw').value})});if(!r.ok)throw new Error('Şifre hatalı');$('pw').value='';$('loginErr').textContent='';$('login').classList.remove('show');await load()}catch(e){$('loginErr').textContent=e.message}}
function setFilter(v,b){filter=v;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('on',x===b));load()}
async function load(){try{const [cs,ms]=await Promise.all([api('/api/customers?status='+(filter==='Tümü'?'Tümü':'Aktif')),api('/api/meetings?status='+encodeURIComponent(filter))]);customers=cs;meetings=ms;render()}catch(e){if(e.message!=='Giriş gerekli')toast(e.message,true)}}
function latestMeetingByCustomer(){const m=new Map();for(const x of meetings){const id=Number(x.customer_id);if(!m.has(id))m.set(id,x)}return m}
function phoneList(c){let p=[];try{p=JSON.parse(c.phones_json||'[]')}catch{}if(!p.length&&c.phone)p=[c.phone];return p.filter(Boolean)}
function emailList(c){let e=[];try{e=JSON.parse(c.emails_json||'[]')}catch{}if(!e.length&&c.email)e=[c.email];return e.filter(Boolean)}
function categoryList(c){return String(c.categories||c.sector||'').split(',').map(x=>x.trim()).filter(Boolean)}
function render(){const q=$('search').value.trim().toLocaleLowerCase('tr-TR'),latest=latestMeetingByCustomer();let rows=customers.filter(c=>{if(filter==='Bekleyen'&&!latest.has(Number(c.id)))return false;const hay=[c.company,c.city,c.region,c.business_area,c.contact_name,c.phone].join(' ').toLocaleLowerCase('tr-TR');return !q||hay.includes(q)});if(filter==='Bekleyen')rows=rows.filter(c=>{const m=latest.get(Number(c.id));return !m||String(m.result||'Beklemede')==='Beklemede'});$('summary').textContent=rows.length+' firma';$('list').innerHTML=rows.length?rows.map(c=>{const phones=phoneList(c),phone=phones[0]||'',m=latest.get(Number(c.id)),note=m?.note||c.special_notes||'';return `<div class="card"><div class="head"><div><div class="company">${esc(c.company)}</div><div class="meta">📍 ${esc(c.city||'')}${c.region?' • '+esc(c.region):''}</div></div><span class="pill">${esc(c.priority||'NORMAL')}</span></div><div class="areaedit"><span>İŞ ALANI</span><input value="${esc(c.business_area||'')}" placeholder="Sen yaz..." onchange="saveArea(${c.id},this.value)" onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}"></div>${note?`<div class="area">📝 ${esc(String(note).slice(0,180))}${String(note).length>180?'…':''}</div>`:''}<div class="actions">${phone?`<a class="btn call" style="text-decoration:none;text-align:center" href="tel:${esc(phone)}">☎ ARA</a>`:`<button class="btn call" disabled>Telefon yok</button>`}<button class="btn note" onclick="openNote(${c.id})">📝 NOT EKLE</button><button class="btn later" onclick="quickLater(${c.id})">⏰ SONRA ARA</button><button class="btn good" onclick="quickResult(${c.id},'Olumlu')">✓ OLUMLU</button><button class="btn bad" onclick="quickResult(${c.id},'Olumsuz')">✕ OLUMSUZ</button><button class="btn more" onclick="openNote(${c.id})">Görüşme Detayı</button></div></div>`}).join(''):'<div class="empty">Bu bölümde firma yok.</div>'}
$('search').addEventListener('input',render);
async function saveArea(id,value){const c=customers.find(x=>Number(x.id)===Number(id));if(!c)return;const next=String(value||'').trim();try{await api('/api/customers/'+id,{method:'PUT',body:JSON.stringify({company:c.company||'',contact_name:c.contact_name||'',phones:phoneList(c),emails:emailList(c),region:c.region||'',city:c.city||'',business_area:next,website:c.website||'',priority:c.priority||'NORMAL',stage:c.stage||'Yeni Lead',follow_date:c.follow_date||'',categories:categoryList(c),special_notes:c.special_notes||'',machine_info:c.machine_info||'',invoice_title:c.invoice_title||'',tax_office:c.tax_office||'',tax_number:c.tax_number||'',invoice_address:c.invoice_address||'',note_image_data:c.note_image_data||''})});c.business_area=next;toast('İş alanı kaydedildi')}catch(e){toast(e.message,true)}}
function openNote(id){current=customers.find(x=>Number(x.id)===Number(id));if(!current)return;$('noteTitle').textContent=current.company;$('noteArea').textContent=(current.city||'')+(current.business_area?' • '+current.business_area:'');$('noteText').value='';$('followDate').value='';$('result').value='Tekrar Görüşülecek';$('noteModal').classList.add('show');setTimeout(()=>$('noteText').focus(),100)}
function closeNote(){$('noteModal').classList.remove('show');current=null}
async function saveMeeting(customerId,note,result,follow){const payload={customer_id:Number(customerId),meeting_date:localDate(),note:note||'',next_follow_date:follow||'',remind_at:'',remind_note:'',result:result||'Beklemede',result_note:'',participants:[]};await api('/api/meetings',{method:'POST',body:JSON.stringify(payload)})}
async function saveNote(){if(!current)return;try{await saveMeeting(current.id,$('noteText').value.trim(),$('result').value,$('followDate').value);closeNote();toast('Görüşme kaydedildi');await load()}catch(e){toast(e.message,true)}}
async function quickLater(id){const c=customers.find(x=>Number(x.id)===Number(id));if(!c)return;try{const d=new Date();d.setDate(d.getDate()+1);const follow=new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);await saveMeeting(id,'Tekrar aranacak.','Tekrar Görüşülecek',follow);toast('Yarına alındı');await load()}catch(e){toast(e.message,true)}}
async function quickResult(id,result){const c=customers.find(x=>Number(x.id)===Number(id));if(!c)return;if(!confirm(c.company+' → '+result+' olarak işaretlensin mi?'))return;try{await saveMeeting(id,result==='Olumlu'?'Olumlu görüşme.':'Olumsuz görüşme.',result,'');toast(result+' kaydedildi');await load()}catch(e){toast(e.message,true)}}
session();
</script>
</body></html>
