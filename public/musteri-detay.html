<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Müşteri Detayı</title>
<style>
:root{--bg:#f4f7fb;--panel:#fff;--line:#dce5ef;--text:#0f172a;--muted:#64748b;--blue:#1769f6;--green:#13ad63;--amber:#d97706;--red:#dc2626;--nav:#0b1730}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}button,a{font:inherit}.top{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 6px 24px rgba(15,23,42,.06)}.topin{max-width:1580px;margin:auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px}.titlebox{min-width:0}.title{font-size:25px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{font-size:12px;color:var(--muted);margin-top:4px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;color:#334155;text-decoration:none;border-radius:9px;padding:9px 13px;font-size:12px;font-weight:900;cursor:pointer}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.wrap{max-width:1580px;margin:auto;padding:20px}.summary{display:grid;grid-template-columns:repeat(5,minmax(130px,1fr));gap:12px;margin-bottom:16px}.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}.stat .k{font-size:10px;color:var(--muted);font-weight:900;text-transform:uppercase;letter-spacing:.03em}.stat .v{font-size:15px;font-weight:900;margin-top:7px;word-break:break-word}.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px;align-items:start}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:0 2px 10px rgba(15,23,42,.035);min-width:0}.card h2{font-size:15px;margin:0 0 13px}.span4{grid-column:span 4}.span6{grid-column:span 6}.span8{grid-column:span 8}.span12{grid-column:1/-1}.info{display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px 12px;align-items:start}.info .k{font-size:11px;color:var(--muted);font-weight:800}.info .v{font-size:12px;font-weight:700;word-break:break-word}.pill{display:inline-flex;padding:5px 8px;border-radius:999px;background:#eef5ff;color:#195bcc;font-size:10px;font-weight:900}.list{display:grid;gap:9px}.item{border:1px solid #e5ebf2;background:#f8fafc;border-radius:9px;padding:11px 12px;font-size:11px;line-height:1.5}.item .meta{color:var(--muted);font-size:10px;margin-bottom:5px}.empty{color:var(--muted);font-size:11px;padding:7px 0}.notes{white-space:pre-wrap;font-size:12px;line-height:1.65}.analysis{background:#eef5ff;border:1px solid #cddfff;border-radius:10px;padding:13px;font-size:12px;line-height:1.65}.loading{min-height:55vh;display:grid;place-items:center;color:var(--muted);font-weight:800}.error{max-width:760px;margin:60px auto;background:#fff;border:1px solid #fecaca;color:#991b1b;border-radius:12px;padding:20px;text-align:center}.maildir{font-weight:900}.muted{color:var(--muted)}
@media(max-width:1100px){.summary{grid-template-columns:repeat(3,1fr)}.span4,.span6,.span8{grid-column:1/-1}}
@media(max-width:680px){.topin{padding:12px}.title{font-size:19px}.wrap{padding:12px}.summary{grid-template-columns:1fr 1fr}.info{grid-template-columns:1fr}.actions .btn{padding:8px 9px}.stat{padding:11px}}
</style>
</head>
<body>
<header class="top"><div class="topin"><div class="titlebox"><div id="companyTitle" class="title">Müşteri Detayı</div><div id="companySub" class="sub">Firma bilgileri yükleniyor...</div></div><div class="actions"><a class="btn" href="/musteri-portfoyu.html">← Portföye Dön</a><a id="editBtn" class="btn primary" href="/?page=customers">✎ Düzenle</a></div></div></header>
<main id="app"><div class="loading">Müşteri bilgileri yükleniyor...</div></main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const val=(v,f='—')=>v===null||v===undefined||String(v).trim()===''?f:String(v);
const fmtDate=v=>{if(!v)return'—';const s=String(v);return s.length>=10?s.slice(0,10):s};
const money=(n,c)=>Number(n||0).toLocaleString('tr-TR',{maximumFractionDigits:2})+' '+val(c,'TRY');
const parseArray=v=>{try{const x=JSON.parse(v||'[]');return Array.isArray(x)?x:[]}catch{return[]}};
function field(label,value){return `<div class="k">${esc(label)}</div><div class="v">${esc(val(value))}</div>`}
function resultLabel(c){if(c.stage==='Kazanıldı')return'Olumlu / Kazanıldı';if(c.stage==='Kaybedildi'||c.record_status==='Pasif')return'Olumsuz / Kaybedildi';if(c.stage==='Beklemede')return'Beklemede';return val(c.stage,'Sonuçlanmamış')}
function priorityLabel(c){const p=String(c.priority||'NORMAL');return p==='KRİTİK'?'Yüksek':p==='YÜKSEK'?'Orta':'Düşük'}
function lastMeeting(meetings){return (meetings||[]).slice().sort((a,b)=>String(b.meeting_date||b.created_at||'').localeCompare(String(a.meeting_date||a.created_at||'')))[0]||null}
function render(data){const c=data.customer||{},meetings=data.meetings||[],offers=data.offers||[],mails=data.mails||[];const lm=lastMeeting(meetings);const phones=[c.phone,...parseArray(c.phones_json)].filter(Boolean);const emails=[c.email,...parseArray(c.emails_json)].filter(Boolean);const cats=val(c.categories||c.sector);
 document.title=val(c.company,'Müşteri')+' - Müşteri Detayı';document.getElementById('companyTitle').textContent=val(c.company,'Müşteri Detayı');document.getElementById('companySub').textContent=[val(c.region,''),cats!=='—'?cats:''].filter(Boolean).join(' • ')||'Müşteri dosyası';document.getElementById('editBtn').href='/?page=customers&editCustomer='+encodeURIComponent(c.id||'');
 const meetingHtml=meetings.length?meetings.slice().reverse().map(m=>`<div class="item"><div class="meta">${esc(fmtDate(m.meeting_date||m.created_at))} · ${esc(val(m.result,'Beklemede'))}${m.next_follow_date?' · Sonraki: '+esc(fmtDate(m.next_follow_date)):''}</div><b>${esc(val(m.remind_note||'Görüşme'))}</b><div>${esc(val(m.note,'Not yok'))}</div></div>`).join(''):'<div class="empty">Görüşme kaydı yok.</div>';
 const offerHtml=offers.length?offers.map(o=>`<div class="item"><div class="meta">${esc(fmtDate(o.offer_date||o.created_at))} · ${esc(val(o.status))}</div><b>${esc(val(o.offer_no,'Teklif'))}</b> — ${esc(val(o.subject,''))}<div style="margin-top:5px"><b>${esc(money(o.amount,o.currency))}</b>${o.follow_date?' · Takip: '+esc(fmtDate(o.follow_date)):''}</div>${o.note?'<div style="margin-top:5px">'+esc(o.note)+'</div>':''}</div>`).join(''):'<div class="empty">Teklif kaydı yok.</div>';
 const mailHtml=mails.length?mails.map(m=>`<div class="item"><div class="meta">${esc(fmtDate(m.mail_date||m.created_at))} · <span class="maildir">${esc(val(m.direction,'Mail'))}</span> · ${esc(val(m.email,''))}</div><b>${esc(val(m.subject,'Konu yok'))}</b>${m.summary?'<div style="margin-top:5px">'+esc(m.summary)+'</div>':''}</div>`).join(''):'<div class="empty">Mail kaydı yok.</div>';
 const notes=val(c.special_notes,'Not bulunmuyor.');const invoiceTitle=c.invoice_title||c.company;const analysis=[];analysis.push(`<b>${esc(val(c.company))}</b> için ${meetings.length} görüşme, ${offers.length} teklif ve ${mails.length} mail kaydı bulunuyor.`);analysis.push(`Potansiyel: <b>${esc(priorityLabel(c))}</b>. Durum: <b>${esc(resultLabel(c))}</b>.`);if(c.follow_date)analysis.push(`Sonraki takip tarihi: <b>${esc(fmtDate(c.follow_date))}</b>.`);if(lm&&lm.note)analysis.push(`Son görüşme notu: ${esc(String(lm.note).slice(0,300))}`);
 document.getElementById('app').innerHTML=`<div class="wrap">
  <section class="summary">
   <div class="stat"><div class="k">Son Görüşme</div><div class="v">${esc(fmtDate(lm?.meeting_date||lm?.created_at))}</div></div>
   <div class="stat"><div class="k">Sonuç</div><div class="v">${esc(resultLabel(c))}</div></div>
   <div class="stat"><div class="k">Sonraki İşlem</div><div class="v">${esc(fmtDate(c.follow_date))}</div></div>
   <div class="stat"><div class="k">Potansiyel</div><div class="v">${esc(priorityLabel(c))}</div></div>
   <div class="stat"><div class="k">Aşama</div><div class="v">${esc(val(c.stage))}</div></div>
  </section>
  <section class="grid">
   <div class="card span4"><h2>İletişim Bilgileri</h2><div class="info">${field('Görüşülen Kişi',c.contact_name)}${field('Telefon',phones.join(' / '))}${field('E-posta',emails.join(' / '))}${field('İl / Bölge',c.region)}</div></div>
   <div class="card span4"><h2>Firma Bilgileri</h2><div class="info">${field('Firma',c.company)}${field('İş Alanı',cats)}${field('Makine / Teknik Bilgi',c.machine_info)}${field('Kayıt Durumu',c.record_status||'Aktif')}</div></div>
   <div class="card span4"><h2>Fatura Bilgileri</h2><div class="info">${field('Fatura Ünvanı',invoiceTitle)}${field('Vergi Dairesi',c.tax_office)}${field('Vergi No',c.tax_number)}${field('Fatura Adresi',c.invoice_address)}</div></div>
   <div class="card span6"><h2>Notlar</h2><div class="notes">${esc(notes)}</div></div>
   <div class="card span6"><h2>Müşteri Analizi</h2><div class="analysis">${analysis.join('<br>')}</div></div>
   <div class="card span6"><h2>Görüşmeler</h2><div class="list">${meetingHtml}</div></div>
   <div class="card span6"><h2>Teklifler</h2><div class="list">${offerHtml}</div></div>
   <div class="card span12"><h2>Mail Geçmişi</h2><div class="list">${mailHtml}</div></div>
  </section>
 </div>`;
}
(async()=>{const id=new URLSearchParams(location.search).get('id');if(!id){document.getElementById('app').innerHTML='<div class="error">Müşteri seçilmedi.<br><br><a class="btn" href="/musteri-portfoyu.html">Portföye Dön</a></div>';return}try{const r=await fetch('/api/customers/'+encodeURIComponent(id)+'/history',{credentials:'same-origin'});if(r.status===401){location.href='/';return}const d=await r.json();if(!r.ok)throw new Error(d.error||'Müşteri bilgileri alınamadı');render(d)}catch(e){document.getElementById('app').innerHTML='<div class="error">'+esc(e.message||'Müşteri bilgileri yüklenemedi')+'<br><br><a class="btn" href="/musteri-portfoyu.html">Portföye Dön</a></div>'}})();
</script>
</body>
</html>
