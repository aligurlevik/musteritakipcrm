<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOTLAR</title><style>
*{box-sizing:border-box}body{margin:0;font:15px Segoe UI,Arial;background:#f7f8fa;color:#17283c}main{width:100%;max-width:none;margin:0;padding:16px 20px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}h2{margin:0}p{color:#64748b;font-size:13px}.paper{background:#fffef5;border:1px solid #e0ddcb;border-radius:14px;box-shadow:0 5px 20px #17283c08;padding:18px;margin-top:16px}input,textarea,button{font:inherit}input,textarea{border:1px solid #ccd5df;border-radius:8px;padding:10px;background:#fff;width:100%}#title{font-weight:700;font-size:18px;text-transform:uppercase}textarea{margin-top:8px;min-height:100px;resize:vertical;line-height:30px;background:repeating-linear-gradient(#fffef5 0,#fffef5 29px,#d4deeb 30px);border-color:#e0ddcb}.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}button{border:1px solid #cad5e1;background:#fff;border-radius:8px;padding:9px 13px;cursor:pointer;color:#29425b}button.primary{background:#2563eb;color:#fff;border-color:#2563eb}button:disabled{opacity:.6;cursor:wait}#alarm{display:none;gap:8px;margin-top:10px;align-items:center}#alarm input{max-width:210px}#status{font-size:13px;color:#166534;min-height:22px;margin-top:8px}.row{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:start;border-bottom:1px solid #cbd5e1;padding:13px 4px}.row:last-child{border-bottom:0}.row input[type=checkbox]{width:21px;height:21px;accent-color:#16a34a;cursor:pointer}.row strong{display:block}.row .detail{white-space:pre-wrap;color:#475569;margin-top:4px;line-height:24px}.meta{font-size:12px;color:#a45b08;margin-top:5px}.actions{display:flex;gap:6px}.list-head{display:flex;align-items:center;justify-content:space-between;margin:20px 0 5px}.empty{padding:26px;text-align:center;color:#64748b}#audioPreview{max-width:100%;display:none}#alarmPopup{display:none;position:fixed;inset:20px 10% auto;background:#fff1a8;border:3px solid #e5a600;padding:20px;border-radius:12px;z-index:10;box-shadow:0 10px 30px #0003}@media(max-width:650px){main{padding:10px}.row{grid-template-columns:24px 1fr}.actions{grid-column:2}header{align-items:start}}

header p{display:none}header h2{font-size:18px}main{padding:8px 12px}#title{display:block;background:#fff6b8;border-color:#e6cf65;font-size:16px;padding:7px 9px;margin-bottom:5px}.paper{padding:8px;margin-top:8px;border-radius:8px}textarea{min-height:42px;height:42px;margin:0;padding:7px 9px;line-height:24px;background:#fff6b8;border-color:#e6cf65;font-size:16px}.tools{margin-top:5px;gap:5px}button{padding:4px 8px;font-size:12px}.list-head{margin:8px 0 5px}#status{min-height:0;margin:3px 0 0}#list{padding:0 8px;min-height:560px;background:repeating-linear-gradient(#fffef5 0,#fffef5 27px,#ccd7e3 28px)}.row{min-height:28px;height:28px;padding:3px 0;grid-template-columns:20px minmax(0,1fr) auto;gap:6px;border:0;align-items:center}.row input[type=checkbox]{width:16px;height:16px;margin:0}.row .detail{margin:0;line-height:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}.row strong{display:none}.meta{display:inline;font-size:11px;margin-left:6px}.actions{flex-wrap:nowrap;gap:4px}.actions button{padding:2px 6px;font-size:11px}.note-body{display:flex;align-items:center;gap:6px;min-width:0}.note-body .detail{flex:1;min-width:0}.thumb{width:24px;height:20px;object-fit:cover;cursor:pointer}#imagePreview{display:none;max-width:130px;max-height:70px;margin:4px 0}#audioPreview{height:30px}#cancelEdit{display:none}#alarm{margin-top:5px}#alarm input{padding:4px}
.note-title{text-transform:uppercase;border:0;background:transparent;padding:0;text-align:left;font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1;color:#1d4ed8}.row.done .note-title{text-transform:uppercase;color:#15803d;text-decoration:line-through}.done-badge{font-size:11px;color:#15803d;white-space:nowrap}.row.expanded{height:auto;min-height:28px;background:#fffde8}.note-details{grid-column:2/-1;white-space:pre-wrap;overflow-wrap:anywhere;padding:6px 8px 10px;background:#fff;font-size:14px;line-height:23px;border:1px solid #e2e8f0;border-radius:6px}.note-details img{display:block;max-width:100%;max-height:320px;margin-top:8px}.phone-hint{font-size:11px;color:#64748b;margin-left:8px}@media(max-width:650px){.row{height:auto;grid-template-columns:20px minmax(0,1fr);padding:5px 0}.actions{grid-column:2;flex-wrap:wrap}.note-body{flex-wrap:wrap}.note-title{text-transform:uppercase;flex-basis:60%}.meta{margin:0}.note-details{grid-column:2}header h2{font-size:16px}main{padding:8px}}
#alarmPopup{inset:0;border-radius:0;z-index:2147483646;overflow:auto;padding:clamp(24px,6vw,90px);background:#fff1a8}#alarmPopup strong{font-size:clamp(24px,4vw,48px)}#alarmText{font-size:clamp(22px,3vw,40px);line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;color:#17283c}#dismiss{font-size:22px;padding:16px 30px}

#list{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,3fr);gap:0;padding:0;background:none;overflow:hidden}
.note-column{min-width:0;min-height:560px;padding:0 8px 12px;background:#fff6b8}
.note-column h3{margin:0 -8px;padding:10px 12px;font-size:15px;border-bottom:1px solid #d8c97d;color:#594b00;position:sticky;top:0;background:#fff1a0}
.note-column h3 span{font-size:12px;font-weight:400}.column-rows{min-height:504px;background:repeating-linear-gradient(transparent 0,transparent 27px,#b4bda766 28px)}
.done-column{background:#e1f2ff;border-left:2px solid #aacde6}.done-column h3{background:#cce8ff;border-color:#aacde6;color:#174b70}
.note-column .empty{overflow-wrap:anywhere}.done-column .row{height:auto;min-height:28px;grid-template-columns:20px minmax(0,1fr)}
.done-column .actions{grid-column:2;flex-wrap:wrap}.done-column .note-body{flex-wrap:wrap}.done-column .note-title{white-space:normal;overflow-wrap:anywhere;flex-basis:100%}.done-column .note-details{grid-column:2}
.done-column .row.expanded{background:#d2eaff}
@media(max-width:650px){#list{grid-template-columns:minmax(0,7fr) minmax(0,3fr)}.note-column{padding:0 4px 8px}.note-column h3{margin:0 -4px;padding:8px 4px;font-size:11px;overflow-wrap:anywhere}.note-column h3 span{font-size:10px}.note-column .row{grid-template-columns:16px minmax(0,1fr);gap:3px}.note-column .note-title{font-size:12px;white-space:normal;overflow-wrap:anywhere}.note-column .actions{gap:3px;grid-column:1/-1;flex-wrap:wrap}.note-column .actions button{font-size:10px;padding:3px}.note-column .empty{padding:16px 4px;font-size:11px}.note-column .done-badge{white-space:normal;font-size:10px}.note-column .meta{overflow-wrap:anywhere;font-size:10px}}
</style></head><body><main><header><div><h2>Karalama defterim</h2><p>Hızlı not alın. Açık notlar ertesi güne devreder.</p></div><button id="refresh">↻ Yenile</button></header><section class="paper"><input id="title" placeholder="Başlık / Firma / Kişi" aria-label="Not başlığı" maxlength="120"><textarea id="note" aria-label="Not açıklaması" placeholder="Açıklama / Görüşme notu…"></textarea><div class="tools"><button id="record">🎤 Ses Kaydı</button><button id="speech">🎙 Konuşarak Yaz</button><button id="alarmToggle">🔔 Hatırlatma</button><button id="imageAdd">📷 Resim Ekle</button><input id="imageFile" type="file" accept="image/png,image/jpeg,image/webp" hidden><button id="cancelEdit">Vazgeç</button><button id="save" class="primary">Ekle · Ctrl + Enter</button></div><div id="alarm"><input id="alarmDate" type="date" aria-label="Hatırlatma tarihi"><input id="alarmTime" type="time" aria-label="Hatırlatma saati"></div><img id="imagePreview" alt="Nota eklenecek resim"><audio id="audioPreview" controls></audio><div id="status" role="status"></div></section><div class="list-head"><strong id="listTitle">Açık notlar</strong></div><section id="list" class="paper" style="margin-top:0" aria-label="Not satırları"></section></main><div id="alarmPopup"><strong>🔔 Not hatırlatması</strong><p id="alarmText"></p><button id="dismiss">Tamam</button></div><script>
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let imageData='',editingId=null;
let items=[],showDone=false,recorder=null,stream=null,chunks=[],voice='',saving=false,recognition=null,pendingId=null;const fired=new Set(),expanded=new Set();
const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Istanbul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
function message(s){$('status').textContent=s}
async function api(path,options={}){const r=await fetch(path,{...options,headers:{'content-type':'application/json'}});let d;try{d=await r.json()}catch{throw Error('Sunucu yanıtı alınamadı.')}if(!r.ok)throw Error(d.error||'İşlem kaydedilemedi.');return d}
async function load(){try{const rows=await api('/api/scratch-notes');items=rows.map(x=>({...x,entry_status:x.done?'Yapıldı':'Yapılacak'}));render();checkAlarms()}catch(e){message(e.message)}}
function noteRow(x){const done=x.entry_status==='Yapıldı',open=expanded.has(x.id);return '<article class="row '+(done?'done ':'')+(open?'expanded':'')+'"><input type="checkbox" aria-label="Not tamamlandı" data-done="'+x.id+'" '+(done?'checked':'')+'><div class="note-body"><button class="note-title" data-expand="'+x.id+'" aria-expanded="'+open+'">'+esc(x.title||String(x.note||'').split('\n')[0]||'Sesli not')+'</button>'+(done?'<span class="done-badge">✓ Tamamlandı</span>':'')+(x.remind_at?'<span class="meta">🔔 '+esc(x.remind_at.replace('T',' '))+'</span>':'')+(Number(x.has_voice)?'<button data-play="'+x.id+'">▶ Ses</button>':'')+(x.image_data?'<button data-expand="'+x.id+'" aria-label="Not resmini göster">📷</button>':'')+'</div><div class="actions"><button data-edit="'+x.id+'">Düzenle</button><button data-alarm="'+x.id+'">⏰ Zaman</button><button data-image="'+x.id+'">Resim Ekle</button><button data-delete="'+x.id+'">Sil</button></div>'+(open?'<div class="note-details">'+esc(x.note||'Açıklama yok.')+(x.image_data?'<img src="'+esc(x.image_data)+'" alt="Not resmi">':'')+'</div>':'')+'</article>'}
function render(){
 $('listTitle').textContent='Notlar · '+today().split('-').reverse().join('.');
 const rows=[...items].sort((a,b)=>b.id-a.id),todo=rows.filter(x=>x.entry_status!=='Yapıldı'),done=rows.filter(x=>x.entry_status==='Yapıldı');
 const column=(name,label,rows,empty)=>'<section class="note-column '+name+'" aria-label="'+label+'"><h3>'+label+' <span>('+rows.length+')</span></h3><div class="column-rows">'+(rows.length?rows.map(noteRow).join(''):'<div class="empty">'+empty+'</div>')+'</div></section>';
 $('list').innerHTML=column('todo-column','YAPILACAKLAR',todo,'Başlık ve açıklamanızı yukarıdan ekleyin.')+column('done-column','YAPILANLAR',done,'Henüz tamamlanan not yok.');
}
$('list').addEventListener('change',async e=>{const id=e.target.dataset.done;if(!id)return;const done=e.target.checked;if(!confirm(done?'Not tamamlandı olarak işaretlensin mi?':'Tamamlandı işareti kaldırılsın mı?')){render();return}e.target.disabled=true;try{await api('/api/scratch-notes/'+id,{method:'PUT',body:JSON.stringify({done})});await load()}catch(error){message(error.message);render()}});
$('list').addEventListener('click',async e=>{const expand=e.target.dataset.expand;if(expand){const id=Number(expand);expanded.has(id)?expanded.delete(id):expanded.add(id);render();return}const id=e.target.dataset.delete,play=e.target.dataset.play;const edit=e.target.dataset.edit||e.target.dataset.alarm||e.target.dataset.image;if(edit){if(!editNote(Number(edit)))return;if(e.target.dataset.alarm){$('alarm').style.display='flex';$('alarmDate').value||=today();$('alarmTime').focus()}if(e.target.dataset.image)$('imageFile').click();return}if(e.target.dataset.openImage){const item=items.find(x=>x.id===Number(e.target.dataset.openImage));const popup=window.open('','_blank');if(popup){const img=popup.document.createElement('img');img.src=item.image_data;img.style.maxWidth='100%';popup.document.body.appendChild(img)}return}try{if(id&&confirm('Bu not ve varsa ses kaydı kalıcı silinsin mi?')){await api('/api/scratch-notes/'+id,{method:'DELETE'});await load()}if(play){const r=await fetch('/api/scratch-notes/'+play+'/voice');if(!r.ok)throw Error('Ses kaydı alınamadı.');const blob=await r.blob(),url=URL.createObjectURL(blob),audio=new Audio(url);audio.onended=()=>URL.revokeObjectURL(url);await audio.play()}}catch(error){message(error.message)}});
$('refresh').onclick=load;
$('alarmToggle').onclick=async()=>{const open=$('alarm').style.display!=='flex';$('alarm').style.display=open?'flex':'none';if(open){$('alarmDate').value||=today();if('Notification'in window&&Notification.permission==='default')await Notification.requestPermission()}};
$('record').onclick=async()=>{if(recorder?.state==='recording'){recorder.stop();return}try{if(recognition)recognition.stop();stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{const blob=new Blob(chunks,{type:recorder.mimeType.split(';')[0]});stream.getTracks().forEach(t=>t.stop());const reader=new FileReader();reader.onload=()=>{voice=reader.result;$('audioPreview').src=voice;$('audioPreview').style.display='block';$('record').textContent='🎤 Yeniden Kaydet';message('Ses kaydı hazır.')};reader.readAsDataURL(blob)};recorder.start(250);$('record').textContent='■ Kaydı Durdur';message('Ses kaydediliyor…')}catch{message('Mikrofon izni verin; ses kaydı bu tarayıcıda desteklenmiyor olabilir.')}};
$('speech').onclick=()=>{if(recognition){recognition.stop();return}if(recorder?.state==='recording')return message('Önce ses kaydını durdurun.');const Speech=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Speech)return message('Konuşarak yazmak için Chrome veya Edge kullanın.');recognition=new Speech();recognition.lang='tr-TR';recognition.continuous=true;recognition.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)$('note').value+=($('note').value?' ':'')+e.results[i][0].transcript};recognition.onend=()=>{recognition=null;$('speech').textContent='🎙 Konuşarak Yaz'};recognition.onerror=()=>message('Mikrofon iznini ve bağlantıyı kontrol edin.');recognition.start();$('speech').textContent='■ Yazmayı Durdur'};
async function save(){if(saving)return;if(recorder?.state==='recording')return message('Önce ses kaydını durdurun.');if(recognition)recognition.stop();const title=$('title').value.trim().toLocaleUpperCase('tr-TR'),note=$('note').value.trim();if(!title&&!note&&!voice&&!imageData)return $('note').focus();let remind='';if($('alarm').style.display==='flex'){if(!$('alarmDate').value||!$('alarmTime').value)return message('Hatırlatma tarihini ve saatini seçin.');remind=$('alarmDate').value+'T'+$('alarmTime').value}saving=true;$('save').disabled=true;try{if(!pendingId){const r=await api('/api/scratch-notes'+(editingId?'/'+editingId:''),{method:editingId?'PUT':'POST',body:JSON.stringify({title:title||note.split('\n')[0].slice(0,120)||'Sesli not',note:note||((voice&&!title)?'Sesli not':''),remind_at:remind,image_data:imageData})});pendingId=r.id||editingId}if(voice)await api('/api/scratch-notes/'+pendingId+'/voice',{method:'POST',body:JSON.stringify({audio_data:voice})});pendingId=null;if(editingId)fired.delete(editingId);editingId=null;imageData='';$('imagePreview').style.display='none';$('cancelEdit').style.display='none';$('save').textContent='Ekle · Ctrl + Enter';voice='';$('title').value='';$('note').value='';$('audioPreview').removeAttribute('src');$('audioPreview').style.display='none';$('alarm').style.display='none';$('alarmTime').value='';$('record').textContent='🎤 Ses Kaydı';showDone=false;message('✓ Not kaydedildi.');await load();$('title').focus()}catch(e){message(e.message+' Notunuz ekranda duruyor; Kaydet ile tekrar deneyin.')}finally{saving=false;$('save').disabled=false}}

function editNote(id){const x=items.find(x=>x.id===id);if(!x)return;if(($('note').value||voice||imageData)&&!confirm('Yazmakta olduğunuz nottan vazgeçip düzenlemeye geçilsin mi?'))return;editingId=id;pendingId=null;voice='';$('audioPreview').style.display='none';$('title').value=x.title||'';$('note').value=x.note||'';imageData=x.image_data||'';$('imagePreview').src=imageData;$('imagePreview').style.display=imageData?'block':'none';$('alarm').style.display=x.remind_at?'flex':'none';$('alarmDate').value=String(x.remind_at||'').slice(0,10);$('alarmTime').value=String(x.remind_at||'').slice(11,16);$('cancelEdit').style.display='inline-block';$('save').textContent='Değişikliği Kaydet';$('note').focus();window.scrollTo?.({top:0,behavior:'smooth'});return true}
$('cancelEdit').onclick=()=>{editingId=null;pendingId=null;imageData='';voice='';$('note').value='';$('title').value='';$('imagePreview').style.display='none';$('audioPreview').style.display='none';$('alarm').style.display='none';$('cancelEdit').style.display='none';$('save').textContent='Ekle · Ctrl + Enter';$('note').focus()};
$('imageAdd').onclick=()=>$('imageFile').click();
$('imageFile').onchange=()=>{const file=$('imageFile').files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const scale=Math.min(1,1400/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);imageData=canvas.toDataURL('image/jpeg',.82);$('imagePreview').src=imageData;$('imagePreview').style.display='block';message('Resim eklendi; Ekle düğmesiyle kaydedin.')};img.src=reader.result};reader.readAsDataURL(file);$('imageFile').value=''};

$('save').onclick=save;document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();save()}});
function checkAlarms(){if($('alarmPopup').style.display==='block')return;for(const x of items){if(x.entry_status==='Yapıldı'||!x.remind_at||fired.has(x.id)||x.reminder_status==='Çaldı')continue;const t=new Date(x.remind_at+( /Z$|[+-]\d\d:\d\d$/.test(x.remind_at)?'':'+03:00')).getTime();if(t<=Date.now()&&Date.now()-t<86400000){fired.add(x.id);const text=[String(x.title||'').toLocaleUpperCase('tr-TR'),x.note].filter(Boolean).join('\n\n');$('alarmText').textContent=text;if(window.parent&&window.parent!==window){window.parent.postMessage({type:'CRM_SCRATCH_ALARM',text},location.origin)}else{$('alarmPopup').style.display='block'}if('Notification'in window&&Notification.permission==='granted')new Notification('Not hatırlatması',{body:text,silent:true});if(!window.parent||window.parent===window)break}}}
$('dismiss').onclick=()=>{$('alarmPopup').style.display='none'};setInterval(checkAlarms,10000);setInterval(()=>{if(!saving&&!document.hidden)load()},20000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});load();$('title').focus();
</script></body></html>
