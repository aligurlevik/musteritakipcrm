<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOTLAR</title><style>
*{box-sizing:border-box}body{margin:0;font:15px Segoe UI,Arial;background:#f7f8fa;color:#17283c}main{width:100%;max-width:none;margin:0;padding:16px 20px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}h2{margin:0}p{color:#64748b;font-size:13px}.paper{background:#fffef5;border:1px solid #e0ddcb;border-radius:14px;box-shadow:0 5px 20px #17283c08;padding:18px;margin-top:16px}input,textarea,button{font:inherit}input,textarea{border:1px solid #ccd5df;border-radius:8px;padding:10px;background:#fff;width:100%}#title{font-weight:700;font-size:18px}textarea{margin-top:8px;min-height:100px;resize:vertical;line-height:30px;background:repeating-linear-gradient(#fffef5 0,#fffef5 29px,#d4deeb 30px);border-color:#e0ddcb}.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}button{border:1px solid #cad5e1;background:#fff;border-radius:8px;padding:9px 13px;cursor:pointer;color:#29425b}button.primary{background:#2563eb;color:#fff;border-color:#2563eb}button:disabled{opacity:.6;cursor:wait}#alarm{display:none;gap:8px;margin-top:10px;align-items:center}#alarm input{max-width:210px}#status{font-size:13px;color:#166534;min-height:22px;margin-top:8px}.row{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:start;border-bottom:1px solid #cbd5e1;padding:13px 4px}.row:last-child{border-bottom:0}.row input[type=checkbox]{width:21px;height:21px;accent-color:#16a34a;cursor:pointer}.row strong{display:block}.row .detail{white-space:pre-wrap;color:#475569;margin-top:4px;line-height:24px}.meta{font-size:12px;color:#a45b08;margin-top:5px}.actions{display:flex;gap:6px}.list-head{display:flex;align-items:center;justify-content:space-between;margin:20px 0 5px}.empty{padding:26px;text-align:center;color:#64748b}#audioPreview{max-width:100%;display:none}#alarmPopup{display:none;position:fixed;inset:20px 10% auto;background:#fff1a8;border:3px solid #e5a600;padding:20px;border-radius:12px;z-index:10;box-shadow:0 10px 30px #0003}@media(max-width:650px){main{padding:10px}.row{grid-template-columns:24px 1fr}.actions{grid-column:2}header{align-items:start}}
</style></head><body><main><header><div><h2>Günlük not defterim</h2><p>Yazın, hatırlatma kurun. Bitmeyen notlar ertesi güne devreder.</p></div><button id="refresh">↻ Yenile</button></header><section class="paper"><input id="title" placeholder="Başlık / Firma / Kişi" aria-label="Not başlığı" maxlength="120"><textarea id="note" aria-label="Not açıklaması" placeholder="Telefonla konuşurken hızlıca not alın…"></textarea><div class="tools"><button id="record">🎤 Ses Kaydı</button><button id="speech">🎙 Konuşarak Yaz</button><button id="alarmToggle">🔔 Hatırlatma</button><button id="save" class="primary">Kaydet · Ctrl + Enter</button></div><div id="alarm"><input id="alarmDate" type="date" aria-label="Hatırlatma tarihi"><input id="alarmTime" type="time" aria-label="Hatırlatma saati"></div><audio id="audioPreview" controls></audio><div id="status" role="status"></div></section><div class="list-head"><strong id="listTitle">Açık notlar</strong><button id="completed">Tamamlananlar / Geri Al</button></div><section id="list" class="paper" style="margin-top:0" aria-label="Not satırları"></section></main><div id="alarmPopup"><strong>🔔 Not hatırlatması</strong><p id="alarmText"></p><button id="dismiss">Tamam</button></div><script>
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let items=[],showDone=false,recorder=null,stream=null,chunks=[],voice='',saving=false,recognition=null,pendingId=null;const fired=new Set();
const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Istanbul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
function message(s){$('status').textContent=s}
async function api(path,options={}){const r=await fetch(path,{...options,headers:{'content-type':'application/json'}});let d;try{d=await r.json()}catch{throw Error('Sunucu yanıtı alınamadı.')}if(!r.ok)throw Error(d.error||'İşlem kaydedilemedi.');return d}
async function load(){try{const rows=await api('/api/notes-v3?notebook=1&scope=all');for(const x of rows){if(x.entry_status!=='Yapıldı'&&!Number(x.is_locked)&&x.entry_date<today()){await api('/api/notes-v3/'+x.id,{method:'PUT',body:JSON.stringify({entry_date:today()})});x.entry_date=today()}}items=rows;render();checkAlarms()}catch(e){message(e.message)}}
function render(){$('listTitle').textContent=showDone?'Tamamlanan notlar':'Açık notlar · '+today().split('-').reverse().join('.');$('completed').textContent=showDone?'← Açık Notlara Dön':'Tamamlananlar / Geri Al';const rows=items.filter(x=>(x.entry_status==='Yapıldı')===showDone).sort((a,b)=>b.id-a.id);$('list').innerHTML=rows.length?rows.map(x=>{const locked=Number(x.is_locked);return '<article class="row"><input type="checkbox" aria-label="Not tamamlandı" data-done="'+x.id+'" '+(showDone?'checked':'')+' '+(locked?'disabled':'')+'><div><strong>'+esc(x.title||String(x.note||'').split('\n')[0]||'Sesli not')+'</strong>'+(locked?'<div class="detail">🔒 Kilitli not — telefon ajandanızdan açabilirsiniz.</div>':'<div class="detail">'+esc(x.note||'')+'</div>')+(x.remind_at?'<div class="meta">🔔 '+esc(x.remind_at.replace('T',' '))+'</div>':'')+(Number(x.has_voice)?'<button data-play="'+x.id+'">▶ Ses kaydını dinle</button>':'')+'</div><div class="actions">'+(!locked?'<button data-delete="'+x.id+'">Sil</button>':'')+'</div></article>'}).join(''):'<div class="empty">'+(showDone?'Tamamlanan not yok.':'Notunuz yok. Yukarıdan hızlıca ekleyebilirsiniz.')+'</div>'}
$('list').addEventListener('change',async e=>{const id=e.target.dataset.done;if(!id)return;const done=e.target.checked;if(!confirm(done?'Not tamamlandı. Listeden kaldırılsın mı?':'Not açık listeye geri alınsın mı?')){render();return}e.target.disabled=true;try{await api('/api/notes-v3/'+id+'/'+(done?'done':'undo'),{method:'POST',body:'{}'});await load()}catch(error){message(error.message);render()}});
$('list').addEventListener('click',async e=>{const id=e.target.dataset.delete,play=e.target.dataset.play;try{if(id&&confirm('Bu not ve varsa ses kaydı kalıcı silinsin mi?')){await api('/api/notes-v3/'+id,{method:'DELETE'});await load()}if(play){const r=await fetch('/api/mobile-voice/'+play);if(!r.ok)throw Error('Ses kaydı alınamadı.');const blob=await r.blob(),url=URL.createObjectURL(blob),audio=new Audio(url);audio.onended=()=>URL.revokeObjectURL(url);await audio.play()}}catch(error){message(error.message)}});
$('completed').onclick=()=>{showDone=!showDone;render()};$('refresh').onclick=load;
$('alarmToggle').onclick=async()=>{const open=$('alarm').style.display!=='flex';$('alarm').style.display=open?'flex':'none';if(open){$('alarmDate').value||=today();if('Notification'in window&&Notification.permission==='default')await Notification.requestPermission()}};
$('record').onclick=async()=>{if(recorder?.state==='recording'){recorder.stop();return}try{if(recognition)recognition.stop();stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{const blob=new Blob(chunks,{type:recorder.mimeType.split(';')[0]});stream.getTracks().forEach(t=>t.stop());const reader=new FileReader();reader.onload=()=>{voice=reader.result;$('audioPreview').src=voice;$('audioPreview').style.display='block';$('record').textContent='🎤 Yeniden Kaydet';message('Ses kaydı hazır.')};reader.readAsDataURL(blob)};recorder.start(250);$('record').textContent='■ Kaydı Durdur';message('Ses kaydediliyor…')}catch{message('Mikrofon izni verin; ses kaydı bu tarayıcıda desteklenmiyor olabilir.')}};
$('speech').onclick=()=>{if(recognition){recognition.stop();return}if(recorder?.state==='recording')return message('Önce ses kaydını durdurun.');const Speech=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Speech)return message('Konuşarak yazmak için Chrome veya Edge kullanın.');recognition=new Speech();recognition.lang='tr-TR';recognition.continuous=true;recognition.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)$('note').value+=($('note').value?' ':'')+e.results[i][0].transcript};recognition.onend=()=>{recognition=null;$('speech').textContent='🎙 Konuşarak Yaz'};recognition.onerror=()=>message('Mikrofon iznini ve bağlantıyı kontrol edin.');recognition.start();$('speech').textContent='■ Yazmayı Durdur'};
async function save(){if(saving)return;if(recorder?.state==='recording')return message('Önce ses kaydını durdurun.');if(recognition)recognition.stop();const title=$('title').value.trim(),note=$('note').value.trim();if(!title&&!note&&!voice)return $('title').focus();let remind='';if($('alarm').style.display==='flex'){if(!$('alarmDate').value||!$('alarmTime').value)return message('Hatırlatma tarihini ve saatini seçin.');remind=$('alarmDate').value+'T'+$('alarmTime').value}saving=true;$('save').disabled=true;try{if(!pendingId){const r=await api('/api/notes-v3',{method:'POST',body:JSON.stringify({notebook_no:1,title:title||note.split('\n')[0].slice(0,120)||'Sesli not',note:note||title||'Sesli not',entry_date:today(),remind_at:remind})});pendingId=r.id}if(voice)await api('/api/mobile-voice/'+pendingId,{method:'POST',body:JSON.stringify({audio_data:voice})});pendingId=null;voice='';$('title').value='';$('note').value='';$('audioPreview').removeAttribute('src');$('audioPreview').style.display='none';$('alarm').style.display='none';$('alarmTime').value='';$('record').textContent='🎤 Ses Kaydı';showDone=false;message('✓ Not kaydedildi.');await load();$('title').focus()}catch(e){message(e.message+' Notunuz ekranda duruyor; Kaydet ile tekrar deneyin.')}finally{saving=false;$('save').disabled=false}}
$('save').onclick=save;document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();save()}});
function checkAlarms(){for(const x of items){if(x.entry_status==='Yapıldı'||!x.remind_at||fired.has(x.id)||x.reminder_status==='Çaldı')continue;const t=new Date(x.remind_at+( /Z$|[+-]\d\d:\d\d$/.test(x.remind_at)?'':'+03:00')).getTime();if(t<=Date.now()&&Date.now()-t<86400000){fired.add(x.id);$('alarmText').textContent=x.title||x.note;$('alarmPopup').style.display='block';if('Notification'in window&&Notification.permission==='granted')new Notification('Not hatırlatması',{body:x.title||x.note})}}}
$('dismiss').onclick=()=>{$('alarmPopup').style.display='none'};setInterval(checkAlarms,10000);setInterval(()=>{if(!saving)load()},60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});load();$('title').focus();
</script></body></html>
