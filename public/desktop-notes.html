<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOTLAR • Hızlı Not Defteri</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#17283c;font-family:Segoe UI,Arial,sans-serif}.intro{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:18px 22px;background:#fff;border-bottom:1px solid #dce4ed}.intro h1{margin:0;font-size:23px;letter-spacing:1px}.intro p{margin:5px 0 0;color:#64748b;font-size:13px}.badge{padding:8px 12px;background:#e8f5ef;color:#14764d;border-radius:20px;font-size:12px;font-weight:700}.workspace{display:grid;grid-template-columns:minmax(360px,.95fr) minmax(380px,1.05fr);gap:18px;padding:18px;height:calc(100vh - 87px);min-height:560px}.panel{display:flex;flex-direction:column;min-height:0;background:#fff;border:1px solid #dbe4ee;border-radius:16px;overflow:hidden;box-shadow:0 4px 16px #1e293b06}.heading{padding:14px 18px;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;gap:10px}.heading strong{font-size:15px}.heading small{color:#64748b;font-size:12px}.heading button{border:1px solid #cbd5e1;background:white;border-radius:8px;padding:7px 10px;cursor:pointer;color:#334155}iframe{display:block;border:0;width:100%;flex:1;min-height:0;background:#fff}#saved{display:none;color:#15803d;font-size:12px;font-weight:700}@media(max-width:850px){.workspace{grid-template-columns:1fr;height:auto}.panel{height:760px}.intro{padding:14px}.badge{display:none}}
</style></head><body>
<header class="intro"><div><h1>NOTLAR</h1><p>Telefon görüşmesinde aklınızda kalmasın, notunuzda kalsın.</p></div><span class="badge">Telefon ajandanızla ortak</span></header>
<main class="workspace"><section class="panel"><div class="heading"><strong>✎ Hızlı not al</strong><small>Kaydet: Ctrl + Enter</small><span id="saved" role="status">✓ Not kaydedildi</span></div><iframe id="composer" title="Yeni not: yazı, ses ve hatırlatma" allow="microphone" src="/yeni-not.html?desktop=1"></iframe></section><section class="panel"><div class="heading"><strong>Not defterim</strong><button id="refresh" type="button">↻ Yenile</button></div><iframe id="notebook" title="Ortak ajanda notları ve hatırlatmalar" allow="microphone" src="/notlar-v2.html?desktop=1"></iframe></section></main>
<script>
const composer=document.getElementById('composer'),notebook=document.getElementById('notebook');
function refreshNotes(){notebook.contentWindow.location.reload()}
document.getElementById('refresh').onclick=refreshNotes;
function polish(frame){const doc=frame.contentDocument;if(!doc||doc.getElementById('desktopNotesStyle'))return;const style=doc.createElement('style');style.id='desktopNotesStyle';style.textContent='.app{max-width:none!important;min-height:100vh;background:#fff!important}.top{background:#f8fafc!important;box-shadow:none!important;border-bottom:1px solid #e2e8f0}.title{font-size:18px!important}.notesBrandLogo{width:30px!important;height:30px!important;flex-basis:30px!important}.form{padding:15px 18px!important}.fontbar,.colorbar{display:none!important}.field textarea{min-height:210px!important;font-size:17px!important;background:#fffef8!important}.saveBar{background:#fff!important}.saveBtn{background:#2563eb!important}.newbtn{background:#2563eb!important}.list{padding:12px!important}.back,.cancelBtn{display:none!important}';doc.head.appendChild(style)}
composer.addEventListener('load',()=>{try{const url=new URL(composer.contentWindow.location.href);if(url.pathname==='/notlar-v2.html'){if(url.searchParams.get('saved')==='1'){document.getElementById('saved').style.display='inline';setTimeout(()=>document.getElementById('saved').style.display='none',4000)}refreshNotes();composer.src='/yeni-not.html?desktop=1';return}polish(composer);setTimeout(()=>composer.contentDocument.getElementById('noteTitle')?.focus(),180);composer.contentDocument.addEventListener('keydown',event=>{if((event.ctrlKey||event.metaKey)&&event.key==='Enter'){event.preventDefault();composer.contentDocument.getElementById('saveBtn')?.click()}})}catch(error){console.error('Not ekranı hazırlanamadı',error)}});
notebook.addEventListener('load',()=>{try{polish(notebook)}catch(error){console.error('Not defteri hazırlanamadı',error)}});
</script></body></html>
