<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Yeni Not</title>
<style>
:root{--yellow:#ffd338;--bg:#f3f4f6;--green:#11865f;--red:#b42318}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:#111}button,input,textarea{font:inherit}.app{max-width:760px;min-height:100vh;margin:0 auto;background:#fff}.top{position:sticky;top:0;z-index:30;background:var(--yellow);padding:10px 12px;box-shadow:0 2px 7px #0002}.toprow{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px}.title{text-align:center;font-size:22px;font-weight:950}.back{border:0;border-radius:9px;background:#fff;color:#111;padding:9px 12px;font-weight:950}.form{padding:10px 12px 95px}.fontbar{display:flex;align-items:center;justify-content:center;gap:8px;margin:6px 0 8px}.fontbar button{border:1px solid #cfd3d8;background:#fff;border-radius:9px;padding:7px 13px;font-weight:950;color:#111}.fontsize{min-width:58px;text-align:center;font-weight:950}.colorbar{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin:0 0 9px}.colorItem{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid #b7c2cd;border-radius:10px;background:#f7fbff;padding:7px 9px;font-size:12px;font-weight:950;color:#173f63}.colorItem input[type=color]{width:42px;height:34px;border:0;background:transparent;padding:0;cursor:pointer}.resetColor{border:0;border-radius:10px;background:#e8edf2;color:#31465a;padding:8px 10px;font-weight:950}.field{margin-top:6px}.field textarea{width:100%;border:1px solid #aeb9c5;border-radius:10px;padding:8px 12px;background:#fff;color:#000;outline:0;min-height:150px;height:150px;resize:none;overflow:hidden;font-size:18px;font-weight:600;line-height:32px;background-color:#fffdf1;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 30px,#8295aa 31px,#8295aa 32px);background-attachment:local}.field textarea:focus{border-color:#596b7c;box-shadow:0 0 0 2px #1111}.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.tool{border:1px solid #d1d5db;border-radius:10px;background:#f7f7f7;color:#222;padding:11px 8px;font-weight:900}.tool.on{background:#fff2ad;border-color:#e5bd19;color:#5d4900}.alarmBox{display:none;margin-top:7px;padding:8px;border:1px solid #d5dbe1;border-radius:10px;background:#f8fafc}.alarmBox.show{display:block}.alarmGrid{display:grid;grid-template-columns:minmax(0,1fr) 76px 76px;gap:6px}.alarmGrid input{width:100%;height:42px;border:1px solid #b8c4ce;border-radius:8px;padding:6px 8px;background:#fff;color:#111;font-weight:850;outline:0;text-align:center}.alarmGrid input[type=date]{text-align:left}.alarmGrid input:focus{border-color:#62798e;box-shadow:0 0 0 2px #1769c21a}.alarmGrid input::placeholder{color:#65798a;opacity:1}.voiceStatus{display:none;margin-top:7px;padding:8px 9px;border-radius:9px;background:#eef6ff;border:1px solid #c9def6;color:#31577d;font-size:12px;font-weight:850}.voiceStatus.show{display:block}.micBtn.recording{background:#fee2e2;color:#a51d1d}.saveBar{position:sticky;bottom:0;z-index:40;width:100%;padding:9px 12px max(9px,env(safe-area-inset-bottom));background:#fffffff7;border-top:1px solid #ddd}.saveBtn{width:100%;border:0;border-radius:11px;background:var(--green);color:#fff;padding:13px;font-size:16px;font-weight:950}.saveBtn:disabled{opacity:.6}.cancelBtn{width:100%;border:0;background:transparent;color:#555;padding:7px;font-weight:850}.login{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:18px;background:#f3f4f6}.login.show{display:flex}.loginbox{width:min(390px,100%);background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 12px 36px #0002}.loginhead{background:var(--yellow);padding:17px;font-size:23px;font-weight:950}.loginbody{padding:16px}.loginbody input{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:9px}.loginbody button{width:100%;border:0;border-radius:9px;background:#111;color:#fff;padding:11px;margin-top:9px;font-weight:900}.err{font-size:12px;color:var(--red);margin-top:7px}.msg{position:fixed;left:50%;bottom:82px;z-index:120;transform:translateX(-50%);display:none;background:#111;color:#fff;padding:9px 12px;border-radius:9px;font-weight:850;max-width:90vw;text-align:center}@media(max-width:520px){.colorbar{grid-template-columns:1fr 1fr}.resetColor{grid-column:1/-1}.alarmGrid{grid-template-columns:minmax(0,1fr) 68px 68px}.title{font-size:20px}.back{padding:8px 10px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="toprow"><button class="back" onclick="goBack()">← Geri</button><div class="title">Yeni Not</div><div style="width:68px"></div></div></header>
<main class="form">
  <div class="fontbar"><button onclick="changeFont(-2)">A−</button><div id="fontSizeLabel" class="fontsize">18 px</div><button onclick="changeFont(2)">A＋</button></div>
  <div class="colorbar"><label class="colorItem">Yazı Rengi <input id="textColor" type="color" value="#101828" oninput="applyColors()"></label><label class="colorItem">Zemin Rengi <input id="bgColor" type="color" value="#fffdf1" oninput="applyColors()"></label><button class="resetColor" onclick="resetColors()">Varsayılan</button></div>
  <div class="field"><textarea id="note" placeholder="Notunuzu buraya yazın..." oninput="autoGrow(this)"></textarea></div>
  <div class="tools"><button id="alarmBtn" class="tool" onclick="toggleAlarm()">🔔 Alarm Ekle</button><button id="micBtn" class="tool" onclick="toggleRecord()">🎤 Ses Kaydı</button></div>
  <div id="alarmBox" class="alarmBox"><div class="alarmGrid"><input id="alarmDate" type="date" aria-label="Alarm tarihi"><input id="alarmHour" type="number" inputmode="numeric" min="0" max="23" placeholder="Saat" aria-label="Saat"><input id="alarmMinute" type="number" inputmode="numeric" min="0" max="59" placeholder="Dakika" aria-label="Dakika"></div></div>
  <div id="voiceStatus" class="voiceStatus"></div>
</main>
<div class="saveBar"><button id="saveBtn" class="saveBtn" onclick="saveNote()">Kaydet</button><button class="cancelBtn" onclick="goBack()">Vazgeç ve Notlarıma Dön</button></div>
</div>
<div id="login" class="login"><div class="loginbox"><div class="loginhead">📝 Notlarım</div><div class="loginbody"><input id="pw" type="password" placeholder="Şifre" onkeydown="if(event.key==='Enter')login()"><button onclick="login()">Giriş Yap</button><div id="loginErr" class="err"></div></div></div></div>
<div id="msg" class="msg"></div>
<script>
(function(){
const savedSize=Math.max(14,Math.min(28,Number(localStorage.getItem('crm_note_font_size')||18)));
const state={alarm:false,saving:false,recorder:null,stream:null,chunks:[],voiceData:'',recordStart:0,timer:null,fontSize:savedSize};
const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0');
function today(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function flash(t){const m=$('msg');m.textContent=t;m.style.display='block';clearTimeout(window.__msgTimer);window.__msgTimer=setTimeout(()=>m.style.display='none',1900)}
async function api(path,opts){const r=await fetch(path,Object.assign({headers:{'content-type':'application/json'}},opts||{}));let d={};try{d=await r.json()}catch(_){}if(r.status===401){$('login').classList.add('show');throw new Error('Yetkisiz')}if(!r.ok)throw new Error(d.error||'İşlem başarısız');return d}
window.goBack=function(){location.href='/notlar-v2.html'};
window.autoGrow=function(el){el.style.height='150px';el.style.height=Math.max(150,el.scrollHeight+4)+'px'};
function applyFont(){const n=$('note'),line=Math.max(30,Math.round(state.fontSize*1.65));n.style.fontSize=state.fontSize+'px';n.style.lineHeight=line+'px';n.style.backgroundImage='repeating-linear-gradient(to bottom,transparent 0,transparent '+(line-2)+'px,#8295aa '+(line-1)+'px,#8295aa '+line+'px)';$('fontSizeLabel').textContent=state.fontSize+' px';localStorage.setItem('crm_note_font_size',String(state.fontSize));window.autoGrow(n)}
window.changeFont=function(delta){state.fontSize=Math.max(14,Math.min(28,state.fontSize+delta));applyFont()};
window.applyColors=function(){const n=$('note');n.style.color=$('textColor').value;n.style.backgroundColor=$('bgColor').value};
window.resetColors=function(){$('textColor').value='#101828';$('bgColor').value='#fffdf1';window.applyColors()};
window.toggleAlarm=async function(){state.alarm=!state.alarm;$('alarmBtn').classList.toggle('on',state.alarm);$('alarmBtn').textContent=state.alarm?'✓ Alarm Açık':'🔔 Alarm Ekle';$('alarmBox').classList.toggle('show',state.alarm);if(state.alarm){if(!$('alarmDate').value)$('alarmDate').value=today();if('Notification'in window&&Notification.permission==='default'){try{await Notification.requestPermission()}catch(_){}}}};
function mimeOption(){if(!window.MediaRecorder)return null;for(const m of ['audio/mp4','audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus']){try{if(MediaRecorder.isTypeSupported(m))return m}catch(_){}}return ''}
function stopStream(){try{state.stream?.getTracks().forEach(t=>t.stop())}catch(_){}state.stream=null;clearInterval(state.timer);state.timer=null}
function dataUrl(blob){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result||''));r.onerror=reject;r.readAsDataURL(blob)})}
window.toggleRecord=async function(){if(state.recorder){try{state.recorder.stop()}catch(_){}return}if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)return flash('Bu cihazda ses kaydı desteklenmiyor.');try{state.stream=await navigator.mediaDevices.getUserMedia({audio:true});const mime=mimeOption();state.chunks=[];const rec=mime?new MediaRecorder(state.stream,{mimeType:mime}):new MediaRecorder(state.stream);state.recorder=rec;state.recordStart=Date.now();rec.ondataavailable=e=>{if(e.data&&e.data.size)state.chunks.push(e.data)};rec.onstop=async()=>{const blob=new Blob(state.chunks,{type:rec.mimeType||mime||'audio/webm'});stopStream();state.recorder=null;try{state.voiceData=await dataUrl(blob);$('voiceStatus').textContent='🎤 Ses kaydı hazır';$('voiceStatus').classList.add('show');$('micBtn').textContent='🎤 Yeniden Kaydet';$('micBtn').classList.remove('recording')}catch(_){flash('Ses kaydı hazırlanamadı.')}};rec.start(250);$('micBtn').textContent='■ Durdur';$('micBtn').classList.add('recording');$('voiceStatus').classList.add('show');state.timer=setInterval(()=>{const s=Math.floor((Date.now()-state.recordStart)/1000);$('voiceStatus').textContent='🔴 Kayıt '+pad(Math.floor(s/60))+':'+pad(s%60);if(s>=60&&state.recorder){try{state.recorder.stop()}catch(_){}}},500)}catch(_){stopStream();state.recorder=null;flash('Mikrofon izni verilmedi.')}};
window.saveNote=async function(){if(state.saving)return;if(state.recorder)return flash('Önce ses kaydını durdurun.');const text=$('note').value.trim();if(!text&&!state.voiceData)return flash('Not yazın veya ses kaydedin.');let remind='';if(state.alarm){const d=$('alarmDate').value,h=Number($('alarmHour').value),m=Number($('alarmMinute').value);if(!d||$('alarmHour').value===''||$('alarmMinute').value==='')return flash('Alarm için tarih, saat ve dakika yazın.');if(!Number.isInteger(h)||h<0||h>23)return flash('Saat 0 ile 23 arasında olmalı.');if(!Number.isInteger(m)||m<0||m>59)return flash('Dakika 0 ile 59 arasında olmalı.');remind=d+'T'+pad(h)+':'+pad(m)}state.saving=true;$('saveBtn').disabled=true;try{const r=await api('/api/notes-v3',{method:'POST',body:JSON.stringify({note:text||'🎤 Sesli not',remind_at:remind,is_important:0,text_color:$('textColor').value,bg_color:$('bgColor').value})});if(state.voiceData){try{await api('/api/mobile-voice/'+r.id,{method:'POST',body:JSON.stringify({audio_data:state.voiceData})})}catch(_){}}location.href='/notlar-v2.html?saved=1'}catch(e){if(e.message!=='Yetkisiz')flash(e.message);state.saving=false;$('saveBtn').disabled=false}};
window.login=async function(){const err=$('loginErr');err.textContent='';try{const r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({user:'Ali',password:$('pw').value})});let d={};try{d=await r.json()}catch(_){}if(!r.ok){err.textContent=d.error||'Şifre hatalı.';return}$('pw').value='';$('login').classList.remove('show')}catch(_){err.textContent='Bağlantı kurulamadı.'}};
async function boot(){applyFont();window.applyColors();try{const r=await fetch('/api/session');if(r.status===401)$('login').classList.add('show')}catch(_){}setTimeout(()=>$('note').focus(),80)}boot();
})();
</script>
</body>
</html>
