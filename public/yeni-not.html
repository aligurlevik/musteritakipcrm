<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Yeni Not</title>
<style>
:root{--yellow:#ffd338;--ink:#111;--muted:#6b7280;--bg:#f3f4f6;--green:#11865f;--red:#b42318}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,textarea,select{font:inherit}.app{max-width:780px;min-height:100vh;margin:0 auto;background:#fff}.top{position:sticky;top:0;z-index:30;background:var(--yellow);padding:11px 12px;box-shadow:0 2px 7px #0002}.toprow{display:flex;align-items:center;justify-content:space-between;gap:9px}.title{font-size:23px;font-weight:950;color:#111}.back{border:0;border-radius:9px;background:#fff9;color:#3d3300;padding:8px 10px;font-weight:900}.form{padding:13px 12px 110px}.hint{background:#fff8cf;border:1px solid #ead27a;border-radius:10px;padding:9px 10px;font-size:13px;font-weight:750;color:#594900;margin-bottom:12px}.field{margin-top:11px}.field label{display:block;font-size:12px;font-weight:950;color:#444;margin:0 0 5px 2px}.field input,.field select,.field textarea{width:100%;border:1px solid #cfd3d8;border-radius:10px;padding:11px;background:#fff;color:#000;outline:0}.field input:focus,.field select:focus,.field textarea:focus{border-color:#111;box-shadow:0 0 0 2px #1111}.field textarea{min-height:250px;resize:vertical;line-height:1.45;font-size:16px;font-weight:600;color:#000}.typeGrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}.typeBtn{border:1px solid #d1d5db;background:#f7f7f7;color:#333;border-radius:10px;padding:10px 6px;font-weight:900}.typeBtn.on{background:#111;color:#fff;border-color:#111}.toggles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.toggle{border:1px solid #d1d5db;border-radius:10px;background:#f7f7f7;padding:11px 9px;font-weight:900;color:#333}.toggle.on{background:#fff2ad;border-color:#e5bd19;color:#5d4900}.alarmBox{display:none;margin-top:9px;background:#fff9dc;border:1px solid #ebd783;border-radius:10px;padding:10px}.alarmBox.show{display:block}.alarmGrid{display:grid;grid-template-columns:1fr 120px;gap:8px}.alarmGrid input{width:100%;border:1px solid #d5c476;border-radius:9px;padding:10px;background:#fff;color:#000}.micArea{margin-top:10px}.micBtn{border:0;border-radius:10px;background:#eaf3ff;color:#174a8b;padding:10px 12px;font-weight:900}.micBtn.recording{background:#fee2e2;color:#a51d1d;animation:pulse 1s infinite}.voiceStatus{display:none;margin-top:7px;padding:8px 9px;border-radius:9px;background:#eef6ff;border:1px solid #c9def6;color:#31577d;font-size:12px;font-weight:850}.voiceStatus.show{display:block}.saveBar{position:fixed;left:50%;bottom:0;z-index:40;transform:translateX(-50%);width:min(780px,100%);padding:10px 12px max(10px,env(safe-area-inset-bottom));background:#fffffff2;border-top:1px solid #ddd}.saveBtn{width:100%;border:0;border-radius:11px;background:var(--green);color:#fff;padding:13px;font-size:16px;font-weight:950}.saveBtn:disabled{opacity:.6}.login{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:18px;background:#f3f4f6}.login.show{display:flex}.loginbox{width:min(390px,100%);background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 12px 36px #0002}.loginhead{background:var(--yellow);padding:17px;font-size:23px;font-weight:950}.loginbody{padding:16px}.loginbody input{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:9px}.loginbody button{width:100%;border:0;border-radius:9px;background:#111;color:#fff;padding:11px;margin-top:9px;font-weight:900}.err{font-size:12px;color:var(--red);margin-top:7px}.msg{position:fixed;left:50%;bottom:76px;z-index:120;transform:translateX(-50%);display:none;background:#111;color:#fff;padding:9px 12px;border-radius:9px;font-weight:850;max-width:90vw;text-align:center}@keyframes pulse{50%{opacity:.58}}@media(max-width:520px){.typeGrid{grid-template-columns:1fr}.toggles{grid-template-columns:1fr 1fr}.field textarea{min-height:230px}.alarmGrid{grid-template-columns:1fr 105px}}
</style>
</head>
<body>
<div class="app">
  <header class="top"><div class="toprow"><div class="title">＋ Yeni Not</div><button class="back" onclick="location.href='/notlar-v2.html'">← Notlarım</button></div></header>
  <main class="form">
    <div class="hint">Örneğin <b>Başlık: Kızım</b>, tür olarak <b>Özel Not</b> seçip ilk anınızı yazabilirsiniz. Toplantı sırasında da “Toplantı” türünü kullanabilirsiniz.</div>
    <div class="field"><label>BAŞLIK</label><input id="title" maxlength="160" placeholder="Örn. Kızım, Firma Toplantısı, Yapılacaklar"></div>
    <div class="field"><label>NOT TÜRÜ</label><div class="typeGrid"><button id="type-general" class="typeBtn on" onclick="setType('Genel Not')">Genel Not</button><button id="type-meeting" class="typeBtn" onclick="setType('Toplantı')">Toplantı</button><button id="type-private" class="typeBtn" onclick="setType('Özel Not')">Özel Not</button></div></div>
    <div class="field"><label>NOT</label><textarea id="note" placeholder="Notunuzu buraya yazın..."></textarea></div>
    <div class="toggles"><button id="importantBtn" class="toggle" onclick="toggleImportant()">☆ Önemli</button><button id="alarmBtn" class="toggle" onclick="toggleAlarm()">🔔 Alarm</button></div>
    <div id="alarmBox" class="alarmBox"><div class="field" style="margin-top:0"><label>ALARM TARİHİ VE SAATİ</label><div class="alarmGrid"><input id="alarmDate" type="date"><input id="alarmTime" type="time"></div></div><div style="font-size:11.5px;font-weight:800;color:#665500;margin-top:7px">Alarm geldiğinde Notlarım ekranının üstünde büyük uyarı çıkar ve not sesli okunur.</div></div>
    <div class="micArea"><button id="micBtn" class="micBtn" onclick="toggleRecord()">🎤 Diktafon</button><div id="voiceStatus" class="voiceStatus"></div></div>
  </main>
</div>
<div class="saveBar"><button id="saveBtn" class="saveBtn" onclick="saveNote()">Kaydet ve Notlarıma Dön</button></div>
<div id="login" class="login"><div class="loginbox"><div class="loginhead">📝 Notlarım</div><div class="loginbody"><input id="pw" type="password" placeholder="Şifre" onkeydown="if(event.key==='Enter')login()"><button onclick="login()">Giriş Yap</button><div id="loginErr" class="err"></div></div></div></div>
<div id="msg" class="msg"></div>
<script>
(function(){
const state={type:'Genel Not',important:false,alarm:false,saving:false,recorder:null,stream:null,chunks:[],voiceData:'',recordStart:0,timer:null};
const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0');
function today(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function flash(t){const m=$('msg');m.textContent=t;m.style.display='block';clearTimeout(window.__msgTimer);window.__msgTimer=setTimeout(()=>m.style.display='none',1900)}
async function api(path,opts){const r=await fetch(path,Object.assign({headers:{'content-type':'application/json'}},opts||{}));let d={};try{d=await r.json()}catch(_){}if(r.status===401){$('login').classList.add('show');throw new Error('Yetkisiz')}if(!r.ok)throw new Error(d.error||'İşlem başarısız');return d}
window.setType=function(type){state.type=type;[['general','Genel Not'],['meeting','Toplantı'],['private','Özel Not']].forEach(([id,val])=>$('type-'+id).classList.toggle('on',val===type))};
window.toggleImportant=function(){state.important=!state.important;$('importantBtn').classList.toggle('on',state.important);$('importantBtn').textContent=state.important?'★ Önemli':'☆ Önemli'};
window.toggleAlarm=async function(){state.alarm=!state.alarm;$('alarmBtn').classList.toggle('on',state.alarm);$('alarmBox').classList.toggle('show',state.alarm);if(state.alarm){if(!$('alarmDate').value)$('alarmDate').value=today();if('Notification'in window&&Notification.permission==='default'){try{await Notification.requestPermission()}catch(_){}}}};
function mimeOption(){if(!window.MediaRecorder)return null;for(const m of ['audio/mp4','audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus']){try{if(MediaRecorder.isTypeSupported(m))return m}catch(_){}}return ''}
function stopStream(){try{state.stream?.getTracks().forEach(t=>t.stop())}catch(_){}state.stream=null;clearInterval(state.timer);state.timer=null}
function dataUrl(blob){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result||''));r.onerror=reject;r.readAsDataURL(blob)})}
window.toggleRecord=async function(){if(state.recorder){try{state.recorder.stop()}catch(_){}return}if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)return flash('Bu cihazda diktafon desteklenmiyor.');try{state.stream=await navigator.mediaDevices.getUserMedia({audio:true});const mime=mimeOption();state.chunks=[];const rec=mime?new MediaRecorder(state.stream,{mimeType:mime}):new MediaRecorder(state.stream);state.recorder=rec;state.recordStart=Date.now();rec.ondataavailable=e=>{if(e.data&&e.data.size)state.chunks.push(e.data)};rec.onerror=()=>{stopStream();state.recorder=null;flash('Ses kaydında hata oluştu.')};rec.onstop=async()=>{const blob=new Blob(state.chunks,{type:rec.mimeType||mime||'audio/webm'});stopStream();state.recorder=null;try{state.voiceData=await dataUrl(blob);$('voiceStatus').textContent='🎤 Ses kaydı hazır — notla birlikte kaydedilecek';$('voiceStatus').classList.add('show');$('micBtn').textContent='🎤 Yeniden Kaydet';$('micBtn').classList.remove('recording')}catch(_){flash('Ses kaydı hazırlanamadı.')}};rec.start(250);$('micBtn').textContent='■ Durdur';$('micBtn').classList.add('recording');$('voiceStatus').classList.add('show');state.timer=setInterval(()=>{const s=Math.floor((Date.now()-state.recordStart)/1000);$('voiceStatus').textContent='🔴 Kayıt '+pad(Math.floor(s/60))+':'+pad(s%60);if(s>=60&&state.recorder){try{state.recorder.stop()}catch(_){}}},500)}catch(_){stopStream();state.recorder=null;flash('Mikrofon izni verilmedi.')}};
window.saveNote=async function(){if(state.saving)return;if(state.recorder)return flash('Önce ses kaydını durdurun.');const title=$('title').value.trim(),text=$('note').value.trim();if(!text&&!state.voiceData)return flash('Not yazın veya ses kaydedin.');let remind='';if(state.alarm){const d=$('alarmDate').value,t=$('alarmTime').value;if(!d||!t)return flash('Alarm için tarih ve saat seçin.');remind=d+'T'+t}state.saving=true;$('saveBtn').disabled=true;try{const r=await api('/api/notes-v3',{method:'POST',body:JSON.stringify({title,note_type:state.type,note:text||'🎤 Sesli not',remind_at:remind,is_important:state.important})});if(state.voiceData){try{await api('/api/mobile-voice/'+r.id,{method:'POST',body:JSON.stringify({audio_data:state.voiceData})})}catch(e){flash('Not kaydedildi; ses kaydı yüklenemedi.')}}location.href='/notlar-v2.html?saved=1'}catch(e){if(e.message!=='Yetkisiz')flash(e.message);state.saving=false;$('saveBtn').disabled=false}};
window.login=async function(){const err=$('loginErr');err.textContent='';try{const r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({user:'Ali',password:$('pw').value})});let d={};try{d=await r.json()}catch(_){}if(!r.ok){err.textContent=d.error||'Şifre hatalı.';return}$('pw').value='';$('login').classList.remove('show')}catch(_){err.textContent='Bağlantı kurulamadı.'}};
async function boot(){try{const r=await fetch('/api/session');if(r.status===401)$('login').classList.add('show')}catch(_){}setTimeout(()=>$('title').focus(),80)}boot();
})();
</script>
</body>
</html>
