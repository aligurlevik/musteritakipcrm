<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Notlarım</title>
<style>
:root{--yellow:#ffd338;--green:#079669;--red:#d92d20;--blue:#1769c2;--purple:#7c3aed;--orange:#e56a00;--ink:#101828;--noteFont:18px;--noteLine:32px}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Segoe UI,Arial,sans-serif;background:#eaf1f8;color:var(--ink)}button,input,textarea{font:inherit}.app{max-width:820px;min-height:100vh;margin:0 auto;background:#f7fbff}.top{position:sticky;top:0;z-index:40;background:var(--yellow);padding:11px 12px;box-shadow:0 2px 8px #0002}.toprow{display:flex;align-items:center;justify-content:space-between;gap:10px}.title{font-size:24px;font-weight:950;color:#111}.newbtn{border:0;border-radius:10px;padding:9px 13px;font-weight:950;background:#111;color:#fff}.tabs{position:sticky;top:61px;z-index:30;display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:9px;background:#fff;border-bottom:2px solid #bfd1e2}.tab{border:2px solid #b8c9db;border-radius:9px;padding:9px 7px;background:#edf5fc;color:#21476b;font-weight:950}.tab.on{background:var(--blue);color:#fff;border-color:var(--blue)}.list{display:grid;gap:8px;padding:9px 9px 80px}.card{position:relative;background:#fffdf1;border:2px solid #5c8fbe;border-radius:11px;padding:8px 9px;box-shadow:0 2px 7px #1e5d9415}.card.done{background:#e7f1fb;border-color:#7da5c8}.card.locked{border-color:#dc9b00;box-shadow:0 0 0 2px #ffd33866}.row{display:grid;grid-template-columns:30px minmax(0,1fr) 38px;gap:8px;align-items:start}.check{width:24px;height:24px;margin-top:5px;accent-color:var(--green);cursor:pointer}.body{min-width:0;cursor:pointer;padding:2px 5px 5px;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--noteLine) - 2px),#5d86ad calc(var(--noteLine) - 1px),#5d86ad var(--noteLine));border-radius:4px}.card.done .body{background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--noteLine) - 2px),#7898b5 calc(var(--noteLine) - 1px),#7898b5 var(--noteLine))}.noteText{font-size:var(--noteFont);font-weight:700;color:#101828;line-height:var(--noteLine);white-space:pre-wrap;word-break:break-word;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;min-height:var(--noteLine);max-height:calc(var(--noteLine) * 3)}.card.done .noteText{color:#44647f;font-weight:700}.moreHint{display:inline-block;margin-top:5px;padding:3px 7px;border-radius:7px;background:#dceeff;color:#0f5899;font-size:11.5px;font-weight:950}.meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:5px}.alarm{font-size:12px;font-weight:950;color:#8c3d00;background:#ffdf9b;border:1px solid #f3a12b;border-radius:8px;padding:3px 7px}.voice{border:1px solid #2c78c4;background:#dceeff;color:#0d4d8d;border-radius:8px;padding:4px 7px;font-size:12px;font-weight:950}.lockBadge{font-size:12px;font-weight:950;background:#ffe172;color:#654d00;border-radius:8px;padding:3px 7px}.menu{position:relative;margin:0}.menu summary{list-style:none;width:36px;height:34px;display:grid;place-items:center;border:1px solid #9eb8d0;border-radius:9px;background:#e7f2fc;color:#123f68;font-size:24px;font-weight:950;cursor:pointer}.menu summary::-webkit-details-marker{display:none}.menuBox{position:absolute;right:0;top:39px;z-index:80;width:190px;background:#fff;border:2px solid #77a3ca;border-radius:11px;padding:6px;box-shadow:0 12px 28px #163d6355}.menuBox button{width:100%;border:0;border-radius:8px;padding:10px;text-align:left;margin:2px 0;font-weight:950}.mArchive{background:#e9ddff;color:#54209a}.mMail{background:#dceeff;color:#0f5899}.mLock{background:#fff0b3;color:#715300}.mReminder{background:#dff7e9;color:#087046}.mDelete{background:#ffd9d4;color:#a61b11}.empty{text-align:center;color:#34516b;padding:27vh 18px 0;font-weight:800}.empty .ico{font-size:42px}.login{position:fixed;inset:0;z-index:160;display:none;align-items:center;justify-content:center;padding:18px;background:#eaf1f8}.login.show{display:flex}.loginbox{width:min(390px,100%);background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 12px 36px #0002}.loginhead{background:var(--yellow);padding:17px;font-size:23px;font-weight:950}.loginbody{padding:16px}.loginbody input{width:100%;padding:11px;border:2px solid #9db7cf;border-radius:9px}.loginbody button{width:100%;border:0;border-radius:9px;background:#111;color:#fff;padding:11px;margin-top:9px;font-weight:950}.err{font-size:12px;color:var(--red);margin-top:7px}.editor{position:fixed;inset:0;z-index:120;background:#0b213777;display:none;align-items:flex-end;justify-content:center}.editor.show{display:flex}.sheet{width:min(820px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:18px 18px 0 0;padding:14px}.sheet h3{margin:0 0 10px;font-size:20px;color:#123f68}.field{margin-top:10px}.field label{display:block;font-size:12px;font-weight:950;color:#21476b;margin:0 0 4px 2px}.field input,.field textarea{width:100%;border:2px solid #8db0cf;border-radius:9px;padding:9px 10px;background:#fff;color:#101828}.field textarea{min-height:260px;resize:vertical;line-height:var(--noteLine);font-size:var(--noteFont);font-weight:700;background-color:#fffdf1;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--noteLine) - 2px),#5d86ad calc(var(--noteLine) - 1px),#5d86ad var(--noteLine))}.alarmGrid{display:grid;grid-template-columns:1fr 110px;gap:7px}.editActions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}.editActions button{border:0;border-radius:9px;padding:10px;font-weight:950}.save{background:var(--green);color:#fff}.close{background:#dceeff;color:#174d7c}.alarmPopup{position:fixed;left:10px;right:10px;top:10px;z-index:220;display:none;background:#fff0a8;border:4px solid #e6a900;border-radius:15px;padding:16px;box-shadow:0 18px 42px #0005}.alarmPopup.show{display:block;animation:visualAlarm .65s infinite alternate}.alarmPopup h2{margin:0 0 7px;font-size:22px;color:#7b4d00}.alarmPopupText{font-size:17px;font-weight:800;color:#111;white-space:pre-wrap;max-height:40vh;overflow:auto}.alarmPopup button{width:100%;border:0;border-radius:9px;background:#111;color:#fff;padding:11px;margin-top:11px;font-weight:950}.msg{position:fixed;left:50%;bottom:18px;z-index:250;transform:translateX(-50%);display:none;background:#102f4d;color:#fff;padding:10px 13px;border-radius:9px;font-weight:900;max-width:90vw;text-align:center}@keyframes visualAlarm{from{transform:scale(1);background:#fff0a8;border-color:#e6a900}to{transform:scale(1.018);background:#ffd338;border-color:#d92d20}}@media(max-width:560px){.tabs{top:61px}.menuBox{width:178px}.sheet{padding-bottom:max(16px,env(safe-area-inset-bottom))}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="toprow"><div class="title">📝 Notlarım</div><button class="newbtn" onclick="location.href='/yeni-not.html'">＋ Yeni Not</button></div></header>
<section class="tabs"><button id="tab-all" class="tab on" onclick="setScope('all')">Notlar</button><button id="tab-archive" class="tab" onclick="setScope('archive')">Arşiv</button></section>
<main id="list" class="list"></main>
</div>
<div id="editor" class="editor" onclick="if(event.target===this)closeEditor()"><div class="sheet">
<h3>Notu Düzenle</h3>
<div class="field"><label>NOT</label><textarea id="editNote"></textarea></div>
<div class="field"><label>HATIRLATICI</label><div class="alarmGrid"><input id="editAlarmDate" type="date"><input id="editAlarmTime" type="time"></div></div>
<div class="editActions"><button class="save" onclick="saveEdit()">Kaydet</button><button class="close" onclick="closeEditor()">Kapat</button></div>
</div></div>
<div id="alarmPopup" class="alarmPopup"><h2>🔔 HATIRLATMA</h2><div id="alarmPopupText" class="alarmPopupText"></div><button onclick="dismissAlarm()">✓ Tamam</button></div>
<div id="login" class="login"><div class="loginbox"><div class="loginhead">📝 Notlarım</div><div class="loginbody"><input id="pw" type="password" placeholder="Şifre" onkeydown="if(event.key==='Enter')login()"><button onclick="login()">Giriş Yap</button><div id="loginErr" class="err"></div></div></div></div>
<div id="msg" class="msg"></div>
<script>
(function(){
const savedSize=Math.max(14,Math.min(28,Number(localStorage.getItem('crm_note_font_size')||18))),savedLine=Math.max(30,Math.round(savedSize*1.65));
document.documentElement.style.setProperty('--noteFont',savedSize+'px');document.documentElement.style.setProperty('--noteLine',savedLine+'px');
const state={scope:'all',items:[],editing:null,alarmItems:[],fired:new Set(),player:null,playerId:null,timers:false};
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function flash(t){const m=$('msg');m.textContent=t;m.style.display='block';clearTimeout(window.__msgTimer);window.__msgTimer=setTimeout(()=>m.style.display='none',1900)}
async function api(path,opts){const r=await fetch(path,Object.assign({headers:{'content-type':'application/json'}},opts||{}));let d={};try{d=await r.json()}catch(_){}if(r.status===401){$('login').classList.add('show');throw new Error('Yetkisiz')}if(!r.ok)throw new Error(d.error||'İşlem başarısız');return d}
function alarmLabel(v){if(!v)return'';const d=new Date(v);if(Number.isNaN(d.getTime()))return'';return d.toLocaleDateString('tr-TR',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})}
window.setScope=function(scope){state.scope=scope;$('tab-all').classList.toggle('on',scope==='all');$('tab-archive').classList.toggle('on',scope==='archive');load()};
window.render=function(){const arr=[...state.items].sort((a,b)=>{const ad=a.entry_status==='Yapıldı'?1:0,bd=b.entry_status==='Yapıldı'?1:0;return ad-bd||Number(b.id)-Number(a.id)});$('list').innerHTML=arr.length?arr.map(x=>{const done=x.entry_status==='Yapıldı',locked=Number(x.is_locked||0)===1,arch=Number(x.is_archived||0)===1,note=String(x.note||''),longNote=note.length>180||note.split('\n').length>3;return '<article class="card '+(done?'done ':'')+(locked?'locked':'')+'"><div class="row"><input class="check" type="checkbox" '+(done?'checked':'')+' onchange="event.stopPropagation();setDone('+x.id+',this.checked)"><div class="body" onclick="openEditor('+x.id+')"><div class="noteText">'+esc(note)+'</div>'+(longNote?'<span class="moreHint">Devamını aç</span>':'')+'<div class="meta">'+(x.remind_at?'<span class="alarm">🔔 '+esc(alarmLabel(x.remind_at))+'</span>':'')+(Number(x.has_voice||0)?'<button class="voice" onclick="event.stopPropagation();playVoice('+x.id+',this)">▶ Ses</button>':'')+(locked?'<span class="lockBadge">🔒 Kilitli</span>':'')+'</div></div><details class="menu" onclick="event.stopPropagation()"><summary>⋮</summary><div class="menuBox"><button class="mDelete" onclick="deleteNote('+x.id+')">🗑 Sil</button><button class="mArchive" onclick="archiveNote('+x.id+','+arch+')">'+(arch?'↩ Arşivden Çıkar':'📦 Arşiv')+'</button><button class="mMail" onclick="mailNote('+x.id+')">✉ Mail At</button><button class="mLock" onclick="toggleLock('+x.id+','+locked+')">'+(locked?'🔓 Kilidi Aç':'🔒 Kilitle')+'</button><button class="mReminder" onclick="addReminder('+x.id+')">🔔 Hatırlatıcı Ekle</button></div></details></div></article>'}).join(''):'<div class="empty"><div class="ico">📝</div><b>Burada not yok.</b></div>'};
async function load(){try{state.items=await api('/api/notes-v3?scope='+state.scope);render()}catch(e){if(e.message!=='Yetkisiz')flash(e.message)}}
async function loadAlarms(){try{state.alarmItems=await api('/api/notes-v3?scope=all')}catch(_){} }
window.openEditor=function(id,reminderOnly){const x=state.items.find(n=>Number(n.id)===Number(id));if(!x)return;if(Number(x.is_locked||0)){flash('Bu not kilitli. Önce kilidi açın.');return}state.editing=x;$('editNote').value=x.note||'';let d='',t='';if(x.remind_at){const p=String(x.remind_at).split('T');d=p[0]||'';t=(p[1]||'').slice(0,5)}$('editAlarmDate').value=d;$('editAlarmTime').value=t;$('editor').classList.add('show');if(reminderOnly)setTimeout(()=>$('editAlarmDate').focus(),100)};
window.closeEditor=function(){state.editing=null;$('editor').classList.remove('show')};
window.saveEdit=async function(){if(!state.editing)return;const note=$('editNote').value.trim();if(!note)return flash('Not boş olamaz.');const d=$('editAlarmDate').value,t=$('editAlarmTime').value,rem=d&&t?d+'T'+t:'';try{await api('/api/notes-v3/'+state.editing.id,{method:'PUT',body:JSON.stringify({note,remind_at:rem})});closeEditor();await load();await loadAlarms();flash('Not kaydedildi.')}catch(e){flash(e.message)}};
window.deleteNote=async function(id){try{await api('/api/notes-v3/'+id,{method:'DELETE'});await load();await loadAlarms();flash('Not silindi.')}catch(e){flash(e.message)}};
window.archiveNote=async function(id,arch){try{await api('/api/notes-v3/'+id+'/'+(arch?'unarchive':'archive'),{method:'POST',body:'{}'});await load();flash(arch?'Arşivden çıkarıldı.':'Arşive gönderildi.')}catch(e){flash(e.message)}};
window.toggleLock=async function(id,locked){try{await api('/api/notes-v3/'+id+'/'+(locked?'unlock':'lock'),{method:'POST',body:'{}'});await load();flash(locked?'Kilit açıldı.':'Not kilitlendi.')}catch(e){flash(e.message)}};
window.mailNote=function(id){const x=state.items.find(n=>Number(n.id)===Number(id));if(!x)return;location.href='mailto:?subject='+encodeURIComponent('Not')+'&body='+encodeURIComponent(String(x.note||''))};
window.addReminder=function(id){openEditor(id,true)};
window.setDone=async function(id,done){try{await api('/api/notes-v3/'+id+'/'+(done?'done':'undo'),{method:'POST',body:'{}'});await load();await loadAlarms()}catch(e){flash(e.message)}};
window.playVoice=function(id,btn){if(state.player&&state.playerId===id){state.player.pause();state.player.currentTime=0;state.player=null;state.playerId=null;btn.textContent='▶ Ses';return}if(state.player)state.player.pause();const a=new Audio('/api/mobile-voice/'+id+'?v='+Date.now());state.player=a;state.playerId=id;btn.textContent='■ Durdur';a.onended=()=>{btn.textContent='▶ Ses';state.player=null;state.playerId=null};a.onerror=()=>{btn.textContent='▶ Ses';state.player=null;state.playerId=null;flash('Ses kaydı açılamadı.')};a.play().catch(()=>flash('Sesi başlatmak için tekrar basın.'))};
async function fireAlarm(x){const key=x.id+'|'+x.remind_at;if(state.fired.has(key))return;state.fired.add(key);try{window.focus()}catch(_){}$('alarmPopupText').textContent=x.note||'';$('alarmPopup').classList.add('show');if('Notification'in window&&Notification.permission==='granted'){try{new Notification('Hatırlatma',{body:String(x.note||'').slice(0,180),silent:true})}catch(_){}}try{await api('/api/notes-v3/'+x.id+'/alarm-fired',{method:'POST',body:'{}'})}catch(_){} }
function checkAlarms(){const now=Date.now();state.alarmItems.forEach(x=>{if(!x.remind_at||x.reminder_status==='Çaldı'||x.entry_status==='Yapıldı'||Number(x.is_archived||0))return;const t=new Date(x.remind_at).getTime();if(Number.isFinite(t)&&now>=t&&now-t<90000)fireAlarm(x)})}
window.dismissAlarm=function(){$('alarmPopup').classList.remove('show')};
function startTimers(){if(state.timers)return;state.timers=true;setInterval(checkAlarms,10000);setInterval(loadAlarms,60000)}
window.login=async function(){const err=$('loginErr');err.textContent='';try{const r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({user:'Ali',password:$('pw').value})});let d={};try{d=await r.json()}catch(_){}if(!r.ok){err.textContent=d.error||'Şifre hatalı.';return}$('pw').value='';$('login').classList.remove('show');await load();await loadAlarms();startTimers()}catch(_){err.textContent='Bağlantı kurulamadı.'}};
async function boot(){try{const r=await fetch('/api/session');if(r.status===401){$('login').classList.add('show');return}}catch(_){}await load();await loadAlarms();startTimers();if(new URL(location.href).searchParams.get('saved')==='1')flash('Not kaydedildi.')}boot();
})();
</script>
</body>
</html>
