<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Notlarım</title>
<style>
:root{--yellow:#ffd338;--bg:#f3f4f6;--green:#11865f;--red:#b42318;--line:#e5e7eb;--noteFont:18px;--noteLine:32px}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:#111}button,input,textarea{font:inherit}.app{max-width:820px;min-height:100vh;margin:0 auto;background:#fafafa}.top{position:sticky;top:0;z-index:40;background:var(--yellow);padding:11px 12px;box-shadow:0 2px 8px #0002}.toprow{display:flex;align-items:center;justify-content:space-between;gap:10px}.title{font-size:24px;font-weight:950}.newbtn{border:0;border-radius:9px;padding:9px 12px;font-weight:950;background:#111;color:#fff}.tabs{position:sticky;top:61px;z-index:30;display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:9px;background:#fff;border-bottom:1px solid var(--line)}.tab{border:1px solid #ddd;border-radius:9px;padding:9px 7px;background:#f7f7f7;color:#333;font-weight:900}.tab.on{background:#111;color:#fff;border-color:#111}.list{display:grid;gap:7px;padding:9px 9px 80px}.card{background:#fffef8;border:1px solid #c7d0da;border-radius:10px;padding:8px 9px;box-shadow:0 1px 3px #0000000b}.card.done{background:#f1f2f3;border-color:#d6d8db}.row{display:grid;grid-template-columns:29px minmax(0,1fr) auto;gap:8px;align-items:start}.check{width:23px;height:23px;margin-top:5px;accent-color:var(--green);cursor:pointer}.body{min-width:0;cursor:pointer;padding:2px 4px 5px;background-color:#fffef8;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--noteLine) - 2px),#8396aa calc(var(--noteLine) - 1px),#8396aa var(--noteLine));background-attachment:local;border-radius:4px}.card.done .body{background-color:#f1f2f3;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--noteLine) - 2px),#b4bbc2 calc(var(--noteLine) - 1px),#b4bbc2 var(--noteLine))}.noteText{font-size:var(--noteFont);font-weight:650;color:#111;line-height:var(--noteLine);white-space:pre-wrap;word-break:break-word;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:5;overflow:hidden;min-height:var(--noteLine)}.card.done .noteText{color:#8a8f96;text-decoration:none;font-weight:600}.meta{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:4px;min-height:22px}.alarm{font-size:11.5px;font-weight:900;color:#6b5700;background:#fff5c8;border-radius:7px;padding:2px 6px}.card.done .alarm{color:#8a8f96;background:#e1e3e5}.voice{border:0;background:#eef6ff;color:#174a8b;border-radius:8px;padding:4px 7px;font-size:11.5px;font-weight:900}.card.done .voice{opacity:.65}.quickDelete{border:0;border-radius:8px;background:#fee2e2;color:#991b1b;padding:7px 9px;font-size:12px;font-weight:950;cursor:pointer;margin-top:1px}.empty{text-align:center;color:#777;padding:27vh 18px 0}.empty .ico{font-size:42px}.login{position:fixed;inset:0;z-index:160;display:none;align-items:center;justify-content:center;padding:18px;background:#f3f4f6}.login.show{display:flex}.loginbox{width:min(390px,100%);background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 12px 36px #0002}.loginhead{background:var(--yellow);padding:17px;font-size:23px;font-weight:950}.loginbody{padding:16px}.loginbody input{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:9px}.loginbody button{width:100%;border:0;border-radius:9px;background:#111;color:#fff;padding:11px;margin-top:9px;font-weight:900}.err{font-size:12px;color:var(--red);margin-top:7px}.editor{position:fixed;inset:0;z-index:120;background:#0007;display:none;align-items:flex-end;justify-content:center}.editor.show{display:flex}.sheet{width:min(820px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:18px 18px 0 0;padding:14px}.sheet h3{margin:0 0 10px;font-size:20px}.field{margin-top:10px}.field label{display:block;font-size:12px;font-weight:900;color:#555;margin:0 0 4px 2px}.field input,.field textarea{width:100%;border:1px solid #aeb9c5;border-radius:9px;padding:8px 10px;background:#fff;color:#111}.field textarea{min-height:260px;resize:vertical;line-height:var(--noteLine);font-size:var(--noteFont);background-color:#fffef8;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--noteLine) - 2px),#8396aa calc(var(--noteLine) - 1px),#8396aa var(--noteLine));background-attachment:local}.alarmGrid{display:grid;grid-template-columns:1fr 110px;gap:7px}.editActions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:12px}.editActions button{border:0;border-radius:9px;padding:10px;font-weight:900}.save{background:var(--green);color:#fff}.delete{background:#fee2e2;color:#991b1b}.close{background:#e5e7eb;color:#222}.alarmPopup{position:fixed;left:10px;right:10px;top:10px;z-index:220;display:none;background:#fff8c8;border:3px solid #e3b800;border-radius:15px;padding:16px;box-shadow:0 18px 42px #0005}.alarmPopup.show{display:block}.alarmPopup h2{margin:0 0 7px;font-size:22px}.alarmPopupText{font-size:16px;font-weight:750;color:#111;white-space:pre-wrap;max-height:40vh;overflow:auto}.alarmPopup button{width:100%;border:0;border-radius:9px;background:#111;color:#fff;padding:11px;margin-top:11px;font-weight:900}.msg{position:fixed;left:50%;bottom:18px;z-index:250;transform:translateX(-50%);display:none;background:#111;color:#fff;padding:9px 12px;border-radius:9px;font-weight:850;max-width:90vw;text-align:center}@media(max-width:560px){.tabs{top:61px}.editActions{grid-template-columns:1fr 1fr}.editActions .delete{grid-column:1/-1}.sheet{padding-bottom:max(16px,env(safe-area-inset-bottom))}.quickDelete{padding:6px 7px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="toprow"><div class="title">📝 Notlarım</div><button class="newbtn" onclick="location.href='/yeni-not.html'">＋ Yeni Not</button></div></header>
<section class="tabs"><button id="tab-all" class="tab on" onclick="setScope('all')">Notlar</button><button id="tab-archive" class="tab" onclick="setScope('archive')">Arşiv</button></section>
<main id="list" class="list"></main>
</div>
<div id="editor" class="editor" onclick="if(event.target===this)closeEditor()"><div class="sheet">
<h3>Notu Düzenle</h3>
<div class="field"><label>NOT</label><textarea id="editNote"></textarea></div>
<div class="field"><label>ALARM</label><div class="alarmGrid"><input id="editAlarmDate" type="date"><input id="editAlarmTime" type="time"></div></div>
<div class="editActions"><button class="save" onclick="saveEdit()">Kaydet</button><button class="close" onclick="closeEditor()">Kapat</button><button class="delete" onclick="deleteCurrent()">Sil</button></div>
</div></div>
<div id="alarmPopup" class="alarmPopup"><h2>🔔 HATIRLATMA</h2><div id="alarmPopupText" class="alarmPopupText"></div><button onclick="dismissAlarm()">✓ Tamam</button></div>
<div id="login" class="login"><div class="loginbox"><div class="loginhead">📝 Notlarım</div><div class="loginbody"><input id="pw" type="password" placeholder="Şifre" onkeydown="if(event.key==='Enter')login()"><button onclick="login()">Giriş Yap</button><div id="loginErr" class="err"></div></div></div></div>
<div id="msg" class="msg"></div>
<script>
(function(){
const savedSize=Math.max(14,Math.min(28,Number(localStorage.getItem('crm_note_font_size')||18))),savedLine=Math.max(30,Math.round(savedSize*1.65));
document.documentElement.style.setProperty('--noteFont',savedSize+'px');document.documentElement.style.setProperty('--noteLine',savedLine+'px');
const state={scope:'all',items:[],editing:null,alarmItems:[],fired:new Set(),audioCtx:null,player:null,playerId:null};
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function flash(t){const m=$('msg');m.textContent=t;m.style.display='block';clearTimeout(window.__msgTimer);window.__msgTimer=setTimeout(()=>m.style.display='none',1900)}
async function api(path,opts){const r=await fetch(path,Object.assign({headers:{'content-type':'application/json'}},opts||{}));let d={};try{d=await r.json()}catch(_){}if(r.status===401){$('login').classList.add('show');throw new Error('Yetkisiz')}if(!r.ok)throw new Error(d.error||'İşlem başarısız');return d}
function alarmLabel(v){if(!v)return'';const d=new Date(v);if(Number.isNaN(d.getTime()))return'';return d.toLocaleDateString('tr-TR',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})}
window.setScope=function(scope){state.scope=scope;$('tab-all').classList.toggle('on',scope==='all');$('tab-archive').classList.toggle('on',scope==='archive');load()};
window.render=function(){const arr=[...state.items].sort((a,b)=>{const ad=a.entry_status==='Yapıldı'?1:0,bd=b.entry_status==='Yapıldı'?1:0;return ad-bd||Number(b.id)-Number(a.id)});$('list').innerHTML=arr.length?arr.map(x=>{const done=x.entry_status==='Yapıldı';return '<article class="card '+(done?'done':'')+'"><div class="row"><input class="check" type="checkbox" '+(done?'checked':'')+' onchange="event.stopPropagation();setDone('+x.id+',this.checked)"><div class="body" onclick="openEditor('+x.id+')"><div class="noteText">'+esc(x.note||'')+'</div>'+((x.remind_at||Number(x.has_voice||0))?'<div class="meta">'+(x.remind_at?'<span class="alarm">🔔 '+esc(alarmLabel(x.remind_at))+'</span>':'')+(Number(x.has_voice||0)?'<button class="voice" onclick="event.stopPropagation();playVoice('+x.id+',this)">▶ Ses</button>':'')+'</div>':'')+'</div><button class="quickDelete" onclick="event.stopPropagation();deleteNote('+x.id+')">Sil</button></div></article>'}).join(''):'<div class="empty"><div class="ico">📝</div><b>Burada not yok.</b></div>'};
async function load(){try{state.items=await api('/api/notes-v3?scope='+state.scope);render()}catch(e){if(e.message!=='Yetkisiz')flash(e.message)}}
async function loadAlarms(){try{state.alarmItems=await api('/api/notes-v3?scope=active')}catch(_){} }
window.openEditor=function(id){const x=state.items.find(n=>Number(n.id)===Number(id));if(!x)return;state.editing=x;$('editNote').value=x.note||'';let date='',time='';if(x.remind_at){const p=String(x.remind_at).split('T');date=p[0]||'';time=(p[1]||'').slice(0,5)}$('editAlarmDate').value=date;$('editAlarmTime').value=time;$('editor').classList.add('show')};
window.closeEditor=function(){state.editing=null;$('editor').classList.remove('show')};
window.saveEdit=async function(){if(!state.editing)return;const note=$('editNote').value.trim();if(!note)return flash('Not boş olamaz.');const d=$('editAlarmDate').value,t=$('editAlarmTime').value,remind=d&&t?d+'T'+t:'';try{await api('/api/notes-v3/'+state.editing.id,{method:'PUT',body:JSON.stringify({title:'',note,remind_at:remind})});closeEditor();await load();await loadAlarms();flash('Not kaydedildi.')}catch(e){if(e.message!=='Yetkisiz')flash(e.message)}};
window.deleteNote=async function(id){if(!confirm('Bu not tamamen silinsin mi?'))return;try{await api('/api/notes-v3/'+id,{method:'DELETE'});await load();await loadAlarms();flash('Not silindi.')}catch(e){if(e.message!=='Yetkisiz')flash(e.message)}};
window.deleteCurrent=async function(){if(!state.editing)return;const id=state.editing.id;if(!confirm('Bu not tamamen silinsin mi?'))return;try{await api('/api/notes-v3/'+id,{method:'DELETE'});closeEditor();await load();await loadAlarms();flash('Not silindi.')}catch(e){if(e.message!=='Yetkisiz')flash(e.message)}};
window.setDone=async function(id,done){try{await api('/api/notes-v3/'+id+'/'+(done?'done':'undo'),{method:'POST',body:'{}'});await load();await loadAlarms()}catch(e){if(e.message!=='Yetkisiz')flash(e.message)}};
window.playVoice=function(id,btn){if(state.player&&state.playerId===id){state.player.pause();state.player.currentTime=0;state.player=null;state.playerId=null;btn.textContent='▶ Ses';return}if(state.player)state.player.pause();const a=new Audio('/api/mobile-voice/'+id+'?v='+Date.now());state.player=a;state.playerId=id;btn.textContent='■ Durdur';a.onended=()=>{btn.textContent='▶ Ses';state.player=null;state.playerId=null};a.onerror=()=>{btn.textContent='▶ Ses';state.player=null;state.playerId=null;flash('Ses kaydı açılamadı.')};a.play().catch(()=>flash('Sesi başlatmak için tekrar basın.'))};
function prepareAudio(){try{if(!state.audioCtx)state.audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(state.audioCtx.state==='suspended')state.audioCtx.resume()}catch(_){} }
function ring(){prepareAudio();try{const c=state.audioCtx;if(!c)return;[0,.28,.56,.84].forEach((d,i)=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=i%2?920:690;g.gain.setValueAtTime(.001,c.currentTime+d);g.gain.exponentialRampToValueAtTime(.32,c.currentTime+d+.02);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d+.23);o.connect(g);g.connect(c.destination);o.start(c.currentTime+d);o.stop(c.currentTime+d+.25)})}catch(_){}try{navigator.vibrate?.([350,150,350,150,500])}catch(_){} }
function speak(x){try{if(!('speechSynthesis'in window))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance('Hatırlatma. '+String(x.note||'').slice(0,420));u.lang='tr-TR';u.rate=.92;u.volume=1;window.speechSynthesis.speak(u)}catch(_){} }
async function fireAlarm(x){const key=x.id+'|'+x.remind_at;if(state.fired.has(key))return;state.fired.add(key);try{window.focus()}catch(_){}$('alarmPopupText').textContent=x.note||'';$('alarmPopup').classList.add('show');ring();speak(x);if('Notification'in window&&Notification.permission==='granted'){try{new Notification('Hatırlatma',{body:String(x.note||'').slice(0,180)})}catch(_){}}try{await api('/api/notes-v3/'+x.id+'/alarm-fired',{method:'POST',body:'{}'})}catch(_){} }
function checkAlarms(){const now=Date.now();state.alarmItems.forEach(x=>{if(!x.remind_at||x.reminder_status==='Çaldı'||x.entry_status==='Yapıldı')return;const t=new Date(x.remind_at).getTime();if(Number.isFinite(t)&&now>=t&&now-t<90000)fireAlarm(x)})}
window.dismissAlarm=function(){$('alarmPopup').classList.remove('show');try{window.speechSynthesis?.cancel()}catch(_){} };
function startTimers(){if(window.__noteTimersStarted)return;window.__noteTimersStarted=true;setInterval(checkAlarms,10000);setInterval(loadAlarms,60000)}
window.login=async function(){const err=$('loginErr');err.textContent='';try{const r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({user:'Ali',password:$('pw').value})});let d={};try{d=await r.json()}catch(_){}if(!r.ok){err.textContent=d.error||'Şifre hatalı.';return}$('pw').value='';$('login').classList.remove('show');await load();await loadAlarms();startTimers()}catch(_){err.textContent='Bağlantı kurulamadı.'}};
async function boot(){document.addEventListener('pointerdown',prepareAudio,{once:true});try{const r=await fetch('/api/session');if(r.status===401){$('login').classList.add('show');return}}catch(_){}await load();await loadAlarms();startTimers();if(new URL(location.href).searchParams.get('saved')==='1')flash('Not kaydedildi.')}
boot();
})();
</script>
</body>
</html>
