<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Notlarım</title>
<style>
:root{--y:#ffd338;--ink:#262626;--bg:#f3f4f6;--green:#14956f;--red:#d83b3b}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,textarea{font:inherit}.app{max-width:720px;min-height:100vh;margin:0 auto;background:#f7f7f8}.top{position:sticky;top:0;z-index:20;background:var(--y);padding:9px 11px;box-shadow:0 2px 7px #0002}.toprow{display:flex;align-items:center;justify-content:space-between;gap:8px}.title{font-size:23px;font-weight:900}.date{font-size:11px;font-weight:800;color:#6b5700;margin-top:2px}.topactions{display:flex;gap:6px}.topbtn,.logout{border:0;background:#ffffff88;border-radius:8px;padding:7px 9px;font-weight:900;color:#584900}.list{display:grid;gap:3px;padding:6px 7px 70px}.card{border:1px solid #eadb91;border-left:4px solid #e7b90b;border-radius:8px;background:#fff8c9;padding:5px 6px;box-shadow:0 1px 3px #0000000d;min-height:42px}.card:nth-child(4n+2){background:#eaf6ea;border-color:#c6e2c9;border-left-color:#43a047}.card:nth-child(4n+3){background:#e9f4ff;border-color:#c7dff3;border-left-color:#2684d8}.card:nth-child(4n+4){background:#fdebf1;border-color:#efced9;border-left-color:#d94b7b}.card.important{border-left-color:#f59e0b;box-shadow:0 1px 5px #f59e0b33}.card.done{opacity:.62}.card.done .text{text-decoration:line-through}.row{display:grid;grid-template-columns:25px minmax(0,1fr) 30px;gap:5px;align-items:start}.check{width:22px;height:22px;margin:0;accent-color:var(--green);cursor:pointer}.notehit{min-width:0;cursor:pointer}.text{font-size:14px;line-height:1.18;font-weight:680;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;word-break:break-word}.meta{margin-top:2px;display:flex;gap:3px;flex-wrap:wrap;font-size:10px;font-weight:800;color:#6d5c1c}.badge{padding:1px 4px;border-radius:999px;background:#ffffffa8;border:1px solid #0000000b;line-height:1.3}.created{color:#64748b}.donebadge{color:#087753}.star{width:29px;height:27px;border:0;border-radius:7px;background:#ffffff90;font-size:19px;line-height:1;color:#b8a36a;padding:0}.star.on{color:#e3a400;background:#fff4bf}.inlineEditor,.newbox{margin-top:6px;padding:7px;border-radius:8px;background:#fffef8;border:1px solid #d8cfaa}.inlineEditor textarea,.newbox textarea{width:100%;min-height:74px;max-height:190px;resize:vertical;border:0;outline:0;border-radius:6px;padding:7px 8px;font-size:15px;line-height:1.3;background-color:#fffef8;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 26px,#d8e6f5 27px,transparent 28px)}.editbar{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-top:6px}.smallbtn{border:0;border-radius:7px;padding:7px 9px;font-weight:900;background:#ececec;color:#333}.savebtn{background:var(--green);color:#fff}.alarmbtn{background:#fff1b8;color:#6f5700}.deletebtn{background:#fee2e2;color:#a51d1d}.cancelbtn{background:#e5e7eb}.alarmFields{display:none;grid-template-columns:1fr 105px;gap:6px;width:100%;margin-top:6px}.alarmFields.show{display:grid}.alarmFields input{width:100%;min-width:0;border:1px solid #d9ca82;border-radius:7px;padding:8px;background:#fff}.newbox{display:none;margin:7px 7px 4px}.newbox.show{display:block}.newhead{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:900;margin-bottom:4px}.importantToggle{border:0;border-radius:7px;padding:5px 7px;background:#f3f4f6;font-weight:900}.importantToggle.on{background:#fff1b8;color:#a06f00}.empty{text-align:center;color:#888;padding-top:28vh}.empty .i{font-size:42px}.alarmPopup{position:fixed;left:12px;right:12px;top:20%;z-index:120;background:#fff8c7;border:2px solid #e7b90b;border-radius:13px;padding:14px;box-shadow:0 10px 32px #0004;display:none}.alarmPopup.show{display:block}.alarmPopup h3{margin:0 0 7px}.alarmPopup button{width:100%;border:0;border-radius:8px;background:var(--y);padding:10px;font-weight:900;margin-top:9px}.login{position:fixed;inset:0;background:#f3f4f6;display:none;align-items:center;justify-content:center;padding:18px;z-index:100}.login.show{display:flex}.loginbox{width:min(380px,100%);background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 8px 28px #0002}.loginhead{background:var(--y);padding:17px;font-size:22px;font-weight:900}.loginbody{padding:16px}.loginbody input{width:100%;padding:11px;border:1px solid #d4d4d4;border-radius:9px}.loginbody button{width:100%;border:0;border-radius:9px;background:var(--y);padding:11px;margin-top:9px;font-weight:900}.err{color:#b91c1c;font-size:12px;margin-top:7px}.msg{position:fixed;left:50%;bottom:15px;transform:translateX(-50%);background:#1f2937;color:#fff;border-radius:9px;padding:9px 12px;font-weight:800;display:none;z-index:130;max-width:88vw;text-align:center}@media(max-width:430px){.text{font-size:13.5px}.meta{font-size:10px}.list{gap:2px}.card{padding:5px}.alarmFields{grid-template-columns:1fr 100px}}
</style>
</head>
<body>
<div class="app">
  <header class="top"><div class="toprow"><div><div class="title">📝 Notlarım</div><div id="todayLabel" class="date"></div></div><div class="topactions"><button class="topbtn" onclick="toggleNewBox()">＋ Not</button><button class="logout" onclick="logoutMobile()">Çıkış</button></div></div></header>
  <section id="newBox" class="newbox">
    <div class="newhead"><span>Yeni Not</span><button id="newImportant" class="importantToggle" onclick="toggleNewImportant()">☆ Önemli</button></div>
    <textarea id="newText" placeholder="Notunuzu buraya yazın..."></textarea>
    <div class="editbar"><button class="smallbtn alarmbtn" onclick="toggleAlarm('newAlarmFields')">🔔 Alarm</button><button class="smallbtn savebtn" onclick="saveNew()">Kaydet</button><button class="smallbtn cancelbtn" onclick="closeNewBox()">Kapat</button></div>
    <div id="newAlarmFields" class="alarmFields"><input id="newAlarmDate" type="date"><input id="newAlarmTime" type="time" step="60"></div>
  </section>
  <main><div id="list" class="list"></div></main>
</div>
<div id="login" class="login"><div class="loginbox"><div class="loginhead">📝 Notlarım</div><div class="loginbody"><input id="pw" type="password" placeholder="Şifre" onkeydown="if(event.key==='Enter')loginMobile()"><button onclick="loginMobile()">Giriş Yap</button><div id="loginerr" class="err"></div></div></div></div>
<div id="alarmPopup" class="alarmPopup"><h3>🔔 Hatırlatma</h3><div id="alarmPopupText"></div><button onclick="dismissAlarm()">Tamam</button></div>
<div id="msg" class="msg"></div>
<script>
(function(){
const state={items:[],editingId:null,newImportant:false,important:new Set(),fired:new Set(),audioCtx:null};
const $=id=>document.getElementById(id);const pad=n=>String(n).padStart(2,'0');const dateKey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());const monthKey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1);const today=()=>dateKey(new Date());
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function flash(t){const m=$('msg');m.textContent=t;m.style.display='block';clearTimeout(window.__m);window.__m=setTimeout(()=>m.style.display='none',1800)}
async function api(path,opts){const r=await fetch(path,Object.assign({headers:{'content-type':'application/json'}},opts||{}));let d={};try{d=await r.json()}catch(_){ }if(!r.ok)throw new Error(d.error||'İşlem başarısız');return d}
function loadImportant(){try{state.important=new Set(JSON.parse(localStorage.getItem('crm_note_important_v1')||'[]').map(String))}catch(_){state.important=new Set()}}
function saveImportant(){localStorage.setItem('crm_note_important_v1',JSON.stringify([...state.important]))}
function isImportant(id){return state.important.has(String(id))}
function item(id){return state.items.find(x=>Number(x.id)===Number(id))}
function fd(v){if(!v)return'';const p=String(v).slice(0,10).split('-').map(Number);return new Date(p[0],p[1]-1,p[2],12).toLocaleDateString('tr-TR',{day:'numeric',month:'short'})}
function fa(v){if(!v)return'';const d=new Date(v);return d.toLocaleDateString('tr-TR',{day:'numeric',month:'short'})+' '+d.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})}
function fc(v){if(!v)return'';let s=String(v).trim().replace(' ','T');if(!/[zZ]|[+-]\d\d:?\d\d$/.test(s))s+='Z';const d=new Date(s);if(Number.isNaN(d.getTime()))return'';return d.toLocaleDateString('tr-TR',{day:'2-digit',month:'2-digit',year:'numeric'})+' '+d.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})}
function editorHtml(x){const rem=x.remind_at?new Date(x.remind_at):null;const ad=rem&&!Number.isNaN(rem.getTime())?dateKey(rem):today();const at=rem&&!Number.isNaN(rem.getTime())?pad(rem.getHours())+':'+pad(rem.getMinutes()):'';return '<div class="inlineEditor"><textarea id="editText-'+x.id+'">'+esc(x.note)+'</textarea><div class="editbar"><button class="smallbtn alarmbtn" onclick="toggleAlarm(\'alarm-'+x.id+'\')">🔔 Alarm</button><button class="smallbtn savebtn" onclick="saveEdit('+x.id+')">Kaydet</button><button class="smallbtn deletebtn" onclick="deleteNote('+x.id+')">Sil</button><button class="smallbtn cancelbtn" onclick="cancelEdit()">Kapat</button></div><div id="alarm-'+x.id+'" class="alarmFields '+(x.remind_at?'show':'')+'"><input id="alarmDate-'+x.id+'" type="date" value="'+ad+'"><input id="alarmTime-'+x.id+'" type="time" step="60" value="'+at+'"></div></div>'}
function render(){const arr=[...state.items].sort((a,b)=>Number(isImportant(b.id))-Number(isImportant(a.id))||Number(a.entry_status==='Yapıldı')-Number(b.entry_status==='Yapıldı')||String(b.entry_date).localeCompare(String(a.entry_date))||Number(b.id)-Number(a.id));$('list').innerHTML=arr.length?arr.map(x=>{const done=x.entry_status==='Yapıldı',imp=isImportant(x.id);return '<article class="card '+(done?'done ':'')+(imp?'important':'')+'"><div class="row"><input class="check" type="checkbox" '+(done?'checked':'')+' onchange="setDone('+x.id+',this.checked)"><div class="notehit" onclick="startEdit('+x.id+')"><div class="text">'+esc(x.note)+'</div><div class="meta"><span class="badge">📅 '+esc(fd(x.entry_date))+'</span><span class="badge created">Giriş: '+esc(fc(x.created_at))+'</span>'+(x.remind_at?'<span class="badge">🔔 '+esc(fa(x.remind_at))+'</span>':'')+(done?'<span class="badge donebadge">✓ Yapıldı</span>':'')+'</div></div><button class="star '+(imp?'on':'')+'" onclick="toggleImportant('+x.id+')">'+(imp?'★':'☆')+'</button></div>'+(state.editingId===Number(x.id)?editorHtml(x):'')+'</article>'}).join(''):'<div class="empty"><div class="i">📝</div><b>Henüz not yok</b><div>Üstteki + Not ile not ekleyin.</div></div>'}
async function loadCurrent(){state.items=await api('/api/agenda?month='+monthKey(new Date()));render()}
window.toggleImportant=function(id){const k=String(id);if(state.important.has(k))state.important.delete(k);else state.important.add(k);saveImportant();render()};
window.startEdit=function(id){state.editingId=state.editingId===Number(id)?null:Number(id);render();setTimeout(()=>{const e=$('editText-'+id);if(e)e.focus()},30)};
window.cancelEdit=function(){state.editingId=null;render()};
window.toggleAlarm=function(id){const el=$(id);if(el)el.classList.toggle('show')};
window.toggleNewBox=function(){const b=$('newBox');b.classList.toggle('show');if(b.classList.contains('show')){if(!$('newAlarmDate').value)$('newAlarmDate').value=today();setTimeout(()=>$('newText').focus(),30)}};
window.closeNewBox=function(){$('newBox').classList.remove('show')};
window.toggleNewImportant=function(){state.newImportant=!state.newImportant;$('newImportant').classList.toggle('on',state.newImportant);$('newImportant').textContent=state.newImportant?'★ Önemli':'☆ Önemli'};
window.saveNew=async function(){try{const note=$('newText').value.trim();if(!note)return flash('Not yazmalısınız.');const af=$('newAlarmFields'),date=$('newAlarmDate').value||today(),time=$('newAlarmTime').value;const remind=af.classList.contains('show')&&time?date+'T'+time:'';const r=await api('/api/agenda',{method:'POST',body:JSON.stringify({entry_date:today(),note,remind_at:remind})});const id=Number(r.id);state.items.push({id,entry_date:today(),note,remind_at:remind,entry_status:'Yapılacak',completed_date:'',created_at:new Date().toISOString()});if(state.newImportant){state.important.add(String(id));saveImportant()}$('newText').value='';$('newAlarmTime').value='';af.classList.remove('show');state.newImportant=false;$('newImportant').classList.remove('on');$('newImportant').textContent='☆ Önemli';closeNewBox();render();flash('Not eklendi.')}catch(e){flash(e.message)}};
window.saveEdit=async function(id){try{const x=item(id);if(!x)return;const note=$('editText-'+id).value.trim();if(!note)return flash('Not boş olamaz.');const af=$('alarm-'+id),date=$('alarmDate-'+id).value||today(),time=$('alarmTime-'+id).value;const remind=af.classList.contains('show')&&time?date+'T'+time:'';await api('/api/agenda/'+id,{method:'PUT',body:JSON.stringify({entry_date:x.entry_date||today(),note,remind_at:remind})});x.note=note;x.remind_at=remind;state.editingId=null;render();flash('Not kaydedildi.')}catch(e){flash(e.message)}};
window.deleteNote=async function(id){try{await api('/api/agenda/'+id,{method:'DELETE'});state.items=state.items.filter(x=>Number(x.id)!==Number(id));state.important.delete(String(id));saveImportant();state.editingId=null;render();flash('Not silindi.')}catch(e){flash(e.message)}};
window.setDone=async function(id,done){const x=item(id);if(!x)return;const old=x.entry_status;x.entry_status=done?'Yapıldı':'Yapılacak';render();try{await api('/api/agenda/'+id+(done?'/task-done':'/task-undo'),{method:'POST',body:done?JSON.stringify({completed_date:today()}):'{}'})}catch(e){x.entry_status=old;render();flash(e.message)}};
function prepareAudio(){try{if(!state.audioCtx)state.audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(state.audioCtx.state==='suspended')state.audioCtx.resume()}catch(_){ }}
function ring(){prepareAudio();try{const ctx=state.audioCtx;if(!ctx)return;[0,.25,.5].forEach((delay,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=i%2?880:660;g.gain.setValueAtTime(.001,ctx.currentTime+delay);g.gain.exponentialRampToValueAtTime(.28,ctx.currentTime+delay+.02);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+delay+.2);o.connect(g);g.connect(ctx.destination);o.start(ctx.currentTime+delay);o.stop(ctx.currentTime+delay+.22)})}catch(_){ }try{navigator.vibrate&&navigator.vibrate([250,120,350])}catch(_){ }}
function checkAlarms(){const now=Date.now();state.items.forEach(x=>{if(!x.remind_at||x.entry_status==='Yapıldı')return;const t=new Date(x.remind_at).getTime(),k=x.id+'|'+x.remind_at;if(Number.isFinite(t)&&now>=t&&now-t<70000&&!state.fired.has(k)){state.fired.add(k);$('alarmPopupText').textContent=x.note;$('alarmPopup').classList.add('show');ring()}})}
window.dismissAlarm=function(){$('alarmPopup').classList.remove('show')};
window.loginMobile=async function(){const err=$('loginerr');err.textContent='';try{const r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({user:'Ali',password:$('pw').value})});let d={};try{d=await r.json()}catch(_){ }if(!r.ok){err.textContent=d.error||'Şifre hatalı.';return}$('pw').value='';$('login').classList.remove('show');await loadCurrent();setTimeout(backgroundRollover,80)}catch(_){err.textContent='Bağlantı kurulamadı.'}};
window.logoutMobile=async function(){try{await fetch('/api/logout')}catch(_){ }$('login').classList.add('show')};
async function backgroundRollover(){try{const r=await api('/api/agenda/rollover',{method:'POST',body:JSON.stringify({today:today()})});if(Number(r.moved||0)>0)await loadCurrent()}catch(_){ }}
async function boot(){loadImportant();$('todayLabel').textContent=new Date().toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});$('newAlarmDate').value=today();document.addEventListener('pointerdown',prepareAudio,{once:true});try{const month=monthKey(new Date());const [s,items]=await Promise.all([api('/api/session'),api('/api/agenda?month='+month)]);if(s.role!=='admin')throw new Error('Oturum');state.items=items;render();setTimeout(backgroundRollover,80)}catch(_){$('login').classList.add('show')}setInterval(checkAlarms,15000)}
boot();
})();
</script>
</body>
</html>
