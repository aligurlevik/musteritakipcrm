<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Notlarım</title>
<style>
:root{--y:#ffd338;--ink:#242424;--bg:#f3f4f6;--green:#14956f;--red:#c62828}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,textarea,select{font:inherit}.app{max-width:720px;min-height:100vh;margin:0 auto;background:#f7f7f8}.top{position:sticky;top:0;z-index:30;background:var(--y);padding:9px 11px;box-shadow:0 2px 7px #0002}.toprow{display:flex;align-items:center;justify-content:space-between;gap:8px}.title{font-size:23px;font-weight:900}.date{font-size:11px;font-weight:850;color:#6b5700;margin-top:2px}.topactions{display:flex;gap:6px}.topbtn,.logout{border:0;background:#ffffff88;border-radius:8px;padding:7px 9px;font-weight:900;color:#584900}.newbox,.inlineEditor{margin:6px 7px;padding:8px;border-radius:9px;background:#fffef8;border:1px solid #d8cfaa}.newbox{display:none}.newbox.show{display:block}.newhead{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:14px;font-weight:900;margin-bottom:5px}.dateRow{display:grid;grid-template-columns:82px minmax(0,1fr);gap:7px;align-items:center;margin:5px 0;padding:6px 7px;background:#fff8d8;border:1px solid #e7d78d;border-radius:8px}.dateRow label{font-size:11px;font-weight:900;color:#665100}.dateRow input{width:100%;min-width:0;border:1px solid #d6c679;border-radius:7px;padding:8px;background:#fff}.newbox textarea,.inlineEditor textarea{width:100%;min-height:72px;max-height:180px;resize:vertical;border:0;outline:0;border-radius:7px;padding:7px 8px;font-size:15px;line-height:1.3;background-color:#fffef8;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 26px,#d8e6f5 27px,transparent 28px)}.editbar{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-top:6px}.smallbtn{border:0;border-radius:7px;padding:7px 9px;font-weight:900;background:#ececec;color:#333}.smallbtn:disabled{opacity:.55;cursor:wait}.savebtn{background:var(--green);color:#fff}.alarmbtn{background:#fff1b8;color:#6f5700}.micbtn{background:#e8f1ff;color:#174a8b}.micbtn.recording{background:#fee2e2;color:#b91c1c;animation:pulse 1s infinite}.deletebtn{background:#fee2e2;color:#a51d1d}.cancelbtn{background:#e5e7eb}.importantToggle{border:0;border-radius:7px;padding:5px 7px;background:#f3f4f6;font-weight:900}.importantToggle.on{background:#fff1b8;color:#a06f00}.alarmFields{display:none;width:100%;margin-top:6px;padding:7px;background:#fff8d8;border:1px solid #e7d78d;border-radius:8px}.alarmFields.show{display:block}.alarmParts{display:grid;grid-template-columns:1fr 1fr;gap:7px}.alarmPart label{display:block;font-size:10px;font-weight:900;color:#6b5700;margin:0 0 3px 2px}.alarmPart select{width:100%;border:1px solid #d9ca82;border-radius:7px;padding:8px;background:#fff;font-weight:850}.voiceStatus{display:none;font-size:11px;font-weight:850;color:#31577d;background:#eef6ff;border:1px solid #c9def6;border-radius:7px;padding:6px 8px;margin-top:5px}.voiceStatus.show{display:block}.list{display:grid;gap:3px;padding:6px 7px 70px}.card{position:relative;border:1px solid #eadb91;border-left:4px solid #e7b90b;border-radius:8px;background:#fff8c9;padding:5px 6px;box-shadow:0 1px 3px #0000000d;min-height:43px}.card:nth-child(4n+2){background:#eaf6ea;border-color:#c6e2c9;border-left-color:#43a047}.card:nth-child(4n+3){background:#e9f4ff;border-color:#c7dff3;border-left-color:#2684d8}.card:nth-child(4n+4){background:#fdebf1;border-color:#efced9;border-left-color:#d94b7b}.card.important{border-left-color:#f59e0b;box-shadow:0 1px 5px #f59e0b33}.card.done{opacity:.68}.card.done .text{text-decoration:line-through}.card.pending{opacity:.72}.row{display:grid;grid-template-columns:27px minmax(0,1fr) 30px;gap:5px;align-items:start}.check{width:23px;height:23px;margin:0;accent-color:var(--green);cursor:pointer}.notehit{min-width:0;cursor:pointer}.text{font-size:14px;line-height:1.18;font-weight:700;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;word-break:break-word}.meta{margin-top:3px;display:flex;gap:3px;flex-wrap:wrap;font-size:11px;font-weight:850;color:#5f511d}.badge{padding:2px 5px;border-radius:999px;background:#ffffffb8;border:1px solid #00000010;line-height:1.3}.created{color:#263238;font-size:11.5px;font-weight:950;background:#fff;border-color:#94a3b8}.donebadge{color:#087753}.pendingbadge{color:#6b7280}.voiceplay{border:1px solid #88b6e8;border-radius:999px;background:#eef6ff;color:#174a8b;font-size:11px;font-weight:900;padding:2px 6px}.star{width:29px;height:27px;border:0;border-radius:7px;background:#ffffff90;font-size:19px;line-height:1;color:#b8a36a;padding:0}.star.on{color:#e3a400;background:#fff4bf}.quickDelete{position:absolute;right:6px;bottom:5px;border:0;border-radius:7px;background:#fee2e2;color:#a51d1d;font-size:11px;font-weight:900;padding:5px 7px;z-index:4}.card.done .meta{padding-right:42px}.empty{text-align:center;color:#888;padding-top:28vh}.empty .i{font-size:42px}.alarmPopup{position:fixed;left:12px;right:12px;top:20%;z-index:120;background:#fff8c7;border:2px solid #e7b90b;border-radius:13px;padding:14px;box-shadow:0 10px 32px #0004;display:none}.alarmPopup.show{display:block}.alarmPopup h3{margin:0 0 7px}.alarmPopup button{width:100%;border:0;border-radius:8px;background:var(--y);padding:10px;font-weight:900;margin-top:9px}.login{position:fixed;inset:0;background:#f3f4f6;display:none;align-items:center;justify-content:center;padding:18px;z-index:140}.login.show{display:flex}.loginbox{width:min(380px,100%);background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 8px 28px #0002}.loginhead{background:var(--y);padding:17px;font-size:22px;font-weight:900}.loginbody{padding:16px}.loginbody input{width:100%;padding:11px;border:1px solid #d4d4d4;border-radius:9px}.loginbody button{width:100%;border:0;border-radius:9px;background:var(--y);padding:11px;margin-top:9px;font-weight:900}.err{color:#b91c1c;font-size:12px;margin-top:7px}.msg{position:fixed;left:50%;bottom:15px;transform:translateX(-50%);background:#1f2937;color:#fff;border-radius:9px;padding:9px 12px;font-weight:800;display:none;z-index:160;max-width:88vw;text-align:center}@keyframes pulse{50%{opacity:.55}}@media(max-width:430px){.text{font-size:14px}.meta{font-size:10.8px}.created{font-size:11.3px}.list{gap:2px}.card{padding:5px}.dateRow{grid-template-columns:76px minmax(0,1fr)}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="toprow"><div><div class="title">📝 Notlarım</div><div id="todayLabel" class="date"></div></div><div class="topactions"><button class="topbtn" onclick="toggleNewBox()">＋ Not</button><button class="logout" onclick="logoutMobile()">Çıkış</button></div></div></header>
<section id="newBox" class="newbox">
<div class="newhead"><span>Yeni Not</span><button id="newImportant" class="importantToggle" onclick="toggleNewImportant()">☆ Önemli</button></div>
<div class="dateRow"><label>NOT TARİHİ</label><input id="newDate" type="date"></div>
<textarea id="newText" placeholder="Notunuzu yazın veya diktafonla ses kaydedin..."></textarea>
<div class="editbar"><button id="newMic" class="smallbtn micbtn" onclick="toggleRecord('new')">🎤 Diktafon</button><button class="smallbtn alarmbtn" onclick="toggleAlarm('newAlarmFields')">🔔 Alarm</button><button id="newSave" class="smallbtn savebtn" onclick="saveNew()">Kaydet</button><button class="smallbtn cancelbtn" onclick="closeNewBox()">Kapat</button></div>
<div id="voice-new" class="voiceStatus"></div>
<div id="newAlarmFields" class="alarmFields"><div class="alarmParts"><div class="alarmPart"><label>SAAT</label><select id="newHour"></select></div><div class="alarmPart"><label>DAKİKA</label><select id="newMinute"></select></div></div></div>
</section>
<main><div id="list" class="list"></div></main>
</div>
<div id="login" class="login"><div class="loginbox"><div class="loginhead">📝 Notlarım</div><div class="loginbody"><input id="pw" type="password" placeholder="Şifre" onkeydown="if(event.key==='Enter')loginMobile()"><button onclick="loginMobile()">Giriş Yap</button><div id="loginerr" class="err"></div></div></div></div>
<div id="alarmPopup" class="alarmPopup"><h3>🔔 Hatırlatma</h3><div id="alarmPopupText"></div><button onclick="dismissAlarm()">Tamam</button></div>
<div id="msg" class="msg"></div>
<script>
(function(){
const state={items:[],editingId:null,newImportant:false,important:new Set(),fired:new Set(),audioCtx:null,savingNew:false,tempSeq:-1,voiceDrafts:new Map(),recorder:null,recordKey:'',recordStream:null,recordTimer:null,recordStarted:0,player:null,playerId:null};
const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0');
const dateKey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),monthKey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1),today=()=>dateKey(new Date());
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function flash(t){const m=$('msg');m.textContent=t;m.style.display='block';clearTimeout(window.__m);window.__m=setTimeout(()=>m.style.display='none',1800)}
async function api(path,opts){const r=await fetch(path,Object.assign({headers:{'content-type':'application/json'}},opts||{}));let d={};try{d=await r.json()}catch(_){ }if(!r.ok)throw new Error(d.error||'İşlem başarısız');return d}
function fillSelect(id,max){const s=$(id);if(!s)return;s.innerHTML='<option value="">--</option>';for(let i=0;i<=max;i++)s.insertAdjacentHTML('beforeend','<option value="'+pad(i)+'">'+pad(i)+'</option>')}
function initTimeSelects(prefix,h='',m=''){fillSelect(prefix+'Hour',23);fillSelect(prefix+'Minute',59);$(prefix+'Hour').value=h||'';$(prefix+'Minute').value=m||''}
function alarmTime(prefix){const h=$(prefix+'Hour')?.value||'',m=$(prefix+'Minute')?.value||'';return h?h+':'+(m||'00'):''}
function loadImportant(){try{state.important=new Set(JSON.parse(localStorage.getItem('crm_note_important_v1')||'[]').map(String))}catch(_){state.important=new Set()}}
function saveImportant(){localStorage.setItem('crm_note_important_v1',JSON.stringify([...state.important]))}
function isImportant(id){return state.important.has(String(id))}
function item(id){return state.items.find(x=>Number(x.id)===Number(id))}
function fd(v){if(!v)return'';const p=String(v).slice(0,10).split('-').map(Number);return new Date(p[0],p[1]-1,p[2],12).toLocaleDateString('tr-TR',{day:'numeric',month:'short'})}
function fa(v){if(!v)return'';const d=new Date(v);return d.toLocaleDateString('tr-TR',{day:'numeric',month:'short'})+' '+d.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})}
function fc(v){if(!v)return'';let s=String(v).trim().replace(' ','T');if(!/[zZ]|[+-]\d\d:?\d\d$/.test(s))s+='Z';const d=new Date(s);if(Number.isNaN(d.getTime()))return'';return d.toLocaleDateString('tr-TR',{day:'2-digit',month:'2-digit',year:'numeric'})+' '+d.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})}
function cacheKey(){return 'crm_mobile_notes_'+monthKey(new Date())}
function saveCache(){try{localStorage.setItem(cacheKey(),JSON.stringify(state.items.filter(x=>!x.pending)))}catch(_){}}
function loadCache(){try{const a=JSON.parse(localStorage.getItem(cacheKey())||'[]');if(Array.isArray(a)){state.items=a;render()}}catch(_){}}
function voiceStatus(key,text){const el=$('voice-'+key);if(!el)return;el.textContent=text||'';el.classList.toggle('show',Boolean(text))}
function editorHtml(x){let h='',m='';if(x.remind_at){const d=new Date(x.remind_at);if(!Number.isNaN(d.getTime())){h=pad(d.getHours());m=pad(d.getMinutes())}}const key=String(x.id);return '<div class="inlineEditor"><div class="dateRow"><label>NOT TARİHİ</label><input id="editDate-'+x.id+'" type="date" value="'+esc(x.entry_date||today())+'"></div><textarea id="editText-'+x.id+'">'+esc(x.note)+'</textarea><div class="editbar"><button id="mic-'+key+'" class="smallbtn micbtn" onclick="toggleRecord(\''+key+'\')">🎤 Diktafon</button><button class="smallbtn alarmbtn" onclick="toggleAlarm(\'alarm-'+x.id+'\')">🔔 Alarm</button><button id="save-'+x.id+'" class="smallbtn savebtn" onclick="saveEdit('+x.id+')">Kaydet</button><button class="smallbtn deletebtn" onclick="deleteNote('+x.id+')">Sil</button><button class="smallbtn cancelbtn" onclick="cancelEdit()">Kapat</button></div><div id="voice-'+key+'" class="voiceStatus '+(state.voiceDrafts.has(key)?'show':'')+'">'+(state.voiceDrafts.has(key)?'🎤 Yeni ses kaydı hazır':'')+'</div><div id="alarm-'+x.id+'" class="alarmFields '+(x.remind_at?'show':'')+'"><div class="alarmParts"><div class="alarmPart"><label>SAAT</label><select id="edit'+x.id+'Hour"></select></div><div class="alarmPart"><label>DAKİKA</label><select id="edit'+x.id+'Minute"></select></div></div></div></div>'}
function render(){const arr=[...state.items].sort((a,b)=>Number(isImportant(b.id))-Number(isImportant(a.id))||Number(a.entry_status==='Yapıldı')-Number(b.entry_status==='Yapıldı')||String(b.entry_date).localeCompare(String(a.entry_date))||Number(b.id)-Number(a.id));$('list').innerHTML=arr.length?arr.map(x=>{const done=x.entry_status==='Yapıldı',imp=isImportant(x.id),pending=x.pending;return '<article class="card '+(done?'done ':'')+(imp?'important ':'')+(pending?'pending':'')+'"><div class="row"><input class="check" type="checkbox" '+(done?'checked ':'')+(pending?'disabled ':'')+'onchange="setDone('+x.id+',this.checked)"><div class="notehit" '+(pending?'':'onclick="startEdit('+x.id+')"')+'><div class="text">'+esc(x.note)+'</div><div class="meta"><span class="badge">📅 '+esc(fd(x.entry_date))+'</span><span class="badge created">Giriş: '+esc(fc(x.created_at))+'</span>'+(x.remind_at?'<span class="badge">🔔 '+esc(fa(x.remind_at))+'</span>':'')+(x.has_voice?'<button class="voiceplay" onclick="event.stopPropagation();playVoice('+x.id+',this)">▶ Ses</button>':'')+(done?'<span class="badge donebadge">✓ Yapıldı</span>':'')+(pending?'<span class="badge pendingbadge">Kaydediliyor…</span>':'')+'</div></div><button class="star '+(imp?'on':'')+'" '+(pending?'disabled ':'')+'onclick="toggleImportant('+x.id+')">'+(imp?'★':'☆')+'</button></div>'+(done&&!pending?'<button class="quickDelete" onclick="deleteNote('+x.id+')">Sil</button>':'')+(state.editingId===Number(x.id)?editorHtml(x):'')+'</article>'}).join(''):'<div class="empty"><div class="i">📝</div><b>Henüz not yok</b><div>Üstteki + Not ile not ekleyin.</div></div>';if(state.editingId!==null){const x=item(state.editingId);if(x){let h='',m='';if(x.remind_at){const d=new Date(x.remind_at);if(!Number.isNaN(d.getTime())){h=pad(d.getHours());m=pad(d.getMinutes())}}initTimeSelects('edit'+x.id,h,m)}}}
async function loadCurrent(){try{const items=await api('/api/agenda?month='+monthKey(new Date()));state.items=items;saveCache();render();setTimeout(backgroundRollover,700)}catch(e){if(/Yetkisiz|Oturum|Giriş/i.test(e.message))$('login').classList.add('show');else flash(e.message)}}
window.toggleImportant=function(id){const k=String(id);if(state.important.has(k))state.important.delete(k);else state.important.add(k);saveImportant();render()};
window.startEdit=function(id){state.editingId=state.editingId===Number(id)?null:Number(id);render();setTimeout(()=>$('editText-'+id)?.focus(),20)};
window.cancelEdit=function(){state.editingId=null;render()};
window.toggleAlarm=function(id){$(id)?.classList.toggle('show')};
window.toggleNewBox=function(){const b=$('newBox');b.classList.toggle('show');if(b.classList.contains('show')){if(!$('newDate').value)$('newDate').value=today();setTimeout(()=>$('newText').focus(),20)}};
window.closeNewBox=function(){if(state.recorder&&state.recordKey==='new')return flash('Önce ses kaydını durdurun.');$('newBox').classList.remove('show')};
window.toggleNewImportant=function(){state.newImportant=!state.newImportant;$('newImportant').classList.toggle('on',state.newImportant);$('newImportant').textContent=state.newImportant?'★ Önemli':'☆ Önemli'};
function mimeOption(){if(!window.MediaRecorder)return null;for(const m of ['audio/mp4','audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus']){try{if(MediaRecorder.isTypeSupported(m))return m}catch(_){}}return ''}
function blobDataUrl(blob){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result||''));r.onerror=reject;r.readAsDataURL(blob)})}
function stopMicStream(){try{state.recordStream?.getTracks().forEach(t=>t.stop())}catch(_){}state.recordStream=null;clearInterval(state.recordTimer);state.recordTimer=null}
window.toggleRecord=async function(key){
  if(state.recorder){if(state.recordKey===String(key)){try{state.recorder.stop()}catch(_){}}else flash('Önce açık ses kaydını durdurun.');return}
  if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)return flash('Bu telefonda diktafon desteklenmiyor.');
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});state.recordStream=stream;const chunks=[],mime=mimeOption();const rec=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream);state.recorder=rec;state.recordKey=String(key);state.recordStarted=Date.now();
    rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
    rec.onerror=()=>{flash('Ses kaydı sırasında hata oluştu.');stopMicStream();state.recorder=null;state.recordKey=''};
    rec.onstop=async()=>{const activeKey=state.recordKey;const blob=new Blob(chunks,{type:rec.mimeType||mime||'audio/webm'});stopMicStream();state.recorder=null;state.recordKey='';try{const dataUrl=await blobDataUrl(blob);state.voiceDrafts.set(activeKey,{audio_data:dataUrl,mime:blob.type});voiceStatus(activeKey,'🎤 Ses kaydı hazır — Kaydet’e basın');const btn=$(activeKey==='new'?'newMic':'mic-'+activeKey);if(btn){btn.textContent='🎤 Yeniden';btn.classList.remove('recording')}}catch(_){flash('Ses kaydı hazırlanamadı.')}};
    rec.start(250);const btn=$(String(key)==='new'?'newMic':'mic-'+key);if(btn){btn.textContent='■ Durdur';btn.classList.add('recording')}voiceStatus(String(key),'🔴 Kayıt başladı…');state.recordTimer=setInterval(()=>{const sec=Math.floor((Date.now()-state.recordStarted)/1000);voiceStatus(String(key),'🔴 Kayıt '+pad(Math.floor(sec/60))+':'+pad(sec%60));if(sec>=60&&state.recorder){try{state.recorder.stop()}catch(_){}}},500)
  }catch(_){stopMicStream();state.recorder=null;state.recordKey='';flash('Mikrofon izni verilmedi.')}
};
async function uploadVoice(id,key){const draft=state.voiceDrafts.get(String(key));if(!draft)return false;await api('/api/mobile-voice/'+id,{method:'POST',body:JSON.stringify({audio_data:draft.audio_data})});state.voiceDrafts.delete(String(key));return true}
window.saveNew=async function(){
  if(state.savingNew)return;if(state.recorder&&state.recordKey==='new')return flash('Önce ses kaydını durdurun.');
  const text=$('newText').value.trim(),voice=state.voiceDrafts.get('new');if(!text&&!voice)return flash('Not yazın veya ses kaydedin.');
  const entryDate=$('newDate').value||today(),af=$('newAlarmFields'),time=alarmTime('new'),remind=af.classList.contains('show')&&time?entryDate+'T'+time:'';const note=text||'🎤 Sesli not';const important=state.newImportant,tempId=state.tempSeq--,created=new Date().toISOString();
  state.savingNew=true;$('newSave').disabled=true;const temp={id:tempId,entry_date:entryDate,note,remind_at:remind,entry_status:'Yapılacak',completed_date:'',created_at:created,has_voice:Boolean(voice),pending:true};state.items.push(temp);if(important)state.important.add(String(tempId));
  $('newBox').classList.remove('show');render();
  try{const r=await api('/api/agenda',{method:'POST',body:JSON.stringify({entry_date:entryDate,note,remind_at:remind})});const realId=Number(r.id);temp.id=realId;temp.pending=false;if(important){state.important.delete(String(tempId));state.important.add(String(realId));saveImportant()}if(voice){try{temp.has_voice=await uploadVoice(realId,'new')}catch(e){temp.has_voice=false;flash('Not kaydedildi, ses kaydı yüklenemedi.')}}saveCache();$('newText').value='';$('newDate').value=today();$('newHour').value='';$('newMinute').value='';af.classList.remove('show');state.newImportant=false;$('newImportant').classList.remove('on');$('newImportant').textContent='☆ Önemli';voiceStatus('new','');render();flash('Not kaydedildi.')}catch(e){state.items=state.items.filter(x=>x!==temp);state.important.delete(String(tempId));$('newBox').classList.add('show');render();flash(e.message)}finally{state.savingNew=false;$('newSave').disabled=false}
};
window.saveEdit=async function(id){
  if(state.recorder&&state.recordKey===String(id))return flash('Önce ses kaydını durdurun.');const x=item(id);if(!x)return;const note=$('editText-'+id).value.trim(),draft=state.voiceDrafts.get(String(id));if(!note&&!draft)return flash('Not boş olamaz.');const entryDate=$('editDate-'+id).value||today(),af=$('alarm-'+id),time=alarmTime('edit'+id),remind=af.classList.contains('show')&&time?entryDate+'T'+time:'';const old={note:x.note,entry_date:x.entry_date,remind_at:x.remind_at,has_voice:x.has_voice};x.note=note||'🎤 Sesli not';x.entry_date=entryDate;x.remind_at=remind;if(draft)x.has_voice=true;state.editingId=null;render();saveCache();
  try{await api('/api/agenda/'+id,{method:'PUT',body:JSON.stringify({entry_date:entryDate,note:x.note,remind_at:remind})});if(draft){try{x.has_voice=await uploadVoice(id,String(id))}catch(_){x.has_voice=old.has_voice;flash('Yazı kaydedildi, ses yüklenemedi.')}}saveCache();render();flash('Not kaydedildi.')}catch(e){Object.assign(x,old);render();saveCache();flash(e.message)}
};
window.deleteNote=async function(id){const x=item(id);if(!x||x.pending)return;state.items=state.items.filter(n=>Number(n.id)!==Number(id));state.important.delete(String(id));saveImportant();state.editingId=null;render();saveCache();try{await api('/api/agenda/'+id,{method:'DELETE'});flash('Not silindi.')}catch(e){state.items.push(x);render();saveCache();flash(e.message)}};
window.setDone=async function(id,done){const x=item(id);if(!x||x.pending)return;const old=x.entry_status;x.entry_status=done?'Yapıldı':'Yapılacak';render();saveCache();try{await api('/api/agenda/'+id+(done?'/task-done':'/task-undo'),{method:'POST',body:done?JSON.stringify({completed_date:today()}):'{}'})}catch(e){x.entry_status=old;render();saveCache();flash(e.message)}};
window.playVoice=function(id,btn){if(state.player&&state.playerId===id){state.player.pause();state.player.currentTime=0;state.player=null;state.playerId=null;btn.textContent='▶ Ses';return}if(state.player){state.player.pause();state.player=null}const a=new Audio('/api/mobile-voice/'+id+'?v='+Date.now());state.player=a;state.playerId=id;btn.textContent='■ Durdur';a.onended=()=>{btn.textContent='▶ Ses';state.player=null;state.playerId=null};a.onerror=()=>{btn.textContent='▶ Ses';state.player=null;state.playerId=null;flash('Ses kaydı açılamadı.')};a.play().catch(()=>flash('Sesi başlatmak için tekrar basın.'))};
function prepareAudio(){try{if(!state.audioCtx)state.audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(state.audioCtx.state==='suspended')state.audioCtx.resume()}catch(_){}}
function ring(){prepareAudio();try{const c=state.audioCtx;if(!c)return;[0,.25,.5].forEach((d,i)=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=i%2?880:660;g.gain.setValueAtTime(.001,c.currentTime+d);g.gain.exponentialRampToValueAtTime(.28,c.currentTime+d+.02);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d+.2);o.connect(g);g.connect(c.destination);o.start(c.currentTime+d);o.stop(c.currentTime+d+.22)})}catch(_){}try{navigator.vibrate?.([250,120,350])}catch(_){}}
function checkAlarms(){const now=Date.now();state.items.forEach(x=>{if(!x.remind_at||x.entry_status==='Yapıldı')return;const t=new Date(x.remind_at).getTime(),k=x.id+'|'+x.remind_at;if(Number.isFinite(t)&&now>=t&&now-t<70000&&!state.fired.has(k)){state.fired.add(k);$('alarmPopupText').textContent=x.note;$('alarmPopup').classList.add('show');ring()}})}
window.dismissAlarm=function(){$('alarmPopup').classList.remove('show')};
window.loginMobile=async function(){const err=$('loginerr');err.textContent='';try{const r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({user:'Ali',password:$('pw').value})});let d={};try{d=await r.json()}catch(_){}if(!r.ok){err.textContent=d.error||'Şifre hatalı.';return}$('pw').value='';$('login').classList.remove('show');await loadCurrent()}catch(_){err.textContent='Bağlantı kurulamadı.'}};
window.logoutMobile=async function(){try{await fetch('/api/logout')}catch(_){}try{localStorage.removeItem(cacheKey())}catch(_){}$('login').classList.add('show')};
async function backgroundRollover(){try{const r=await api('/api/agenda/rollover',{method:'POST',body:JSON.stringify({today:today()})});if(Number(r.moved||0)>0)await loadCurrent()}catch(_){}}
function boot(){loadImportant();$('todayLabel').textContent=new Date().toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});$('newDate').value=today();initTimeSelects('new');document.addEventListener('pointerdown',prepareAudio,{once:true});loadCache();loadCurrent();setInterval(checkAlarms,15000)}
boot();
})();
</script>
