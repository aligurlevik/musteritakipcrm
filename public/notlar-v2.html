<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Notlarım</title>
<style>
:root{--y:#ffd338;--ink:#262626;--bg:#f3f4f6;--muted:#777;--green:#13966f;--red:#d83b3b}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,textarea{font:inherit}.app{max-width:720px;min-height:100vh;margin:0 auto;background:#f7f7f8}.top{position:sticky;top:0;z-index:20;background:var(--y);padding:10px 12px;box-shadow:0 2px 7px #0002}.toprow{display:flex;align-items:center;justify-content:space-between;gap:7px}.title{font-size:23px;font-weight:900}.date{font-size:10px;font-weight:800;color:#6b5700;margin-top:2px}.topactions{display:flex;gap:6px}.iconbtn,.logout{border:0;background:#ffffff80;border-radius:8px;padding:6px 8px;font-weight:900;color:#584900}.list{display:grid;gap:4px;padding:6px 7px 84px}.card{border:1px solid #eadb91;border-left:4px solid #e7b90b;border-radius:8px;background:#fff8c9;padding:6px 7px;box-shadow:0 1px 3px #0000000d;min-height:44px;cursor:pointer}.card:nth-child(4n+2){background:#eaf6ea;border-color:#c6e2c9;border-left-color:#43a047}.card:nth-child(4n+3){background:#e9f4ff;border-color:#c7dff3;border-left-color:#2684d8}.card:nth-child(4n+4){background:#fdebf1;border-color:#efced9;border-left-color:#d94b7b}.card.done{opacity:.58}.row{display:grid;grid-template-columns:20px minmax(0,1fr);gap:5px;align-items:start}.check{width:17px;height:17px;margin-top:1px}.text{font-size:13px;line-height:1.18;font-weight:650;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;word-break:break-word}.meta{margin:2px 0 0 25px;display:flex;gap:3px;flex-wrap:wrap;font-size:9px;font-weight:800;color:#6d5c1c}.badge{padding:1px 4px;border-radius:999px;background:#ffffff9e;border:1px solid #0000000b;line-height:1.35}.created{color:#64748b}.empty{text-align:center;color:#888;padding-top:28vh}.empty .i{font-size:42px}.fab{position:fixed;right:max(18px,calc((100vw - 720px)/2 + 18px));bottom:20px;width:54px;height:54px;border:0;border-radius:50%;background:var(--y);font-size:32px;color:#4e4100;box-shadow:0 4px 14px #0004;z-index:30}.editor{position:fixed;inset:0;display:none;flex-direction:column;background:#fffef7;z-index:60}.editor.show{display:flex}.editorhead{display:grid;grid-template-columns:40px 1fr auto auto;align-items:center;background:var(--y);padding:7px 8px;box-shadow:0 2px 7px #0002}.back{border:0;background:transparent;font-size:27px}.etitle{font-size:18px;font-weight:900}.save,.panelbtn{border:0;background:#fff6c6;border-radius:8px;padding:8px 10px;font-weight:900}.panelbtn{font-size:18px;padding:6px 9px}.paper{flex:1;min-height:0;display:flex;padding-left:32px;background-color:#fffef8;background-image:linear-gradient(90deg,transparent 0,transparent 23px,#ef9a9a 24px,#ef9a9a 25px,transparent 26px),repeating-linear-gradient(to bottom,transparent 0,transparent 31px,#d8e6f5 32px,transparent 33px)}.paper textarea{flex:1;border:0;outline:0;resize:none;background:transparent;padding:10px 9px;font-size:16px;line-height:32px}.drawerOverlay{position:fixed;inset:0;background:#0005;z-index:79;display:none}.drawerOverlay.show{display:block}.drawer{position:fixed;top:0;right:0;bottom:0;width:min(84vw,330px);background:#fffdf2;z-index:80;transform:translateX(100%);transition:transform .2s ease;box-shadow:-8px 0 24px #0002;padding:14px 12px calc(14px + env(safe-area-inset-bottom));overflow:auto}.drawer.show{transform:translateX(0)}.drawerhead{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #eadca5;padding-bottom:9px;margin-bottom:12px}.drawerhead b{font-size:17px}.closeDrawer{border:0;background:#f3edd1;border-radius:8px;padding:6px 9px;font-weight:900}.drawer .sectionTitle{font-size:11px;font-weight:900;color:#7c6400;margin:12px 0 6px}.drawer .field{margin-bottom:8px}.drawer .field label{display:block;font-size:10px;font-weight:900;color:#7b6a2d;margin:0 0 3px 2px}.drawer .field input{width:100%;border:1px solid #d9ca82;border-radius:9px;padding:10px 8px;background:#fff}.drawerActions{display:grid;gap:7px;margin-top:10px}.drawerActions button{border:0;border-radius:9px;padding:10px;font-weight:900}.newpage{background:var(--y);color:#5d4e00}.delete{background:#fee2e2;color:#a51d1d}.donebtn{background:#e7f5ef;color:#087753}.alarmStatus{font-size:10px;color:#7b6a2d;background:#fff7d3;border:1px solid #ead38a;border-radius:8px;padding:8px;margin-top:5px}.login{position:fixed;inset:0;background:#f3f4f6;display:none;align-items:center;justify-content:center;padding:18px;z-index:100}.login.show{display:flex}.loginbox{width:min(380px,100%);background:white;border-radius:14px;overflow:hidden;box-shadow:0 8px 28px #0002}.loginhead{background:var(--y);padding:17px;font-size:22px;font-weight:900}.loginbody{padding:16px}.loginbody input{width:100%;padding:11px;border:1px solid #d4d4d4;border-radius:9px}.loginbody button{width:100%;border:0;border-radius:9px;background:var(--y);padding:11px;margin-top:9px;font-weight:900}.err{color:#b91c1c;font-size:12px;margin-top:7px}.msg{position:fixed;left:50%;bottom:15px;transform:translateX(-50%);background:#1f2937;color:#fff;border-radius:9px;padding:9px 12px;font-weight:800;display:none;z-index:110;max-width:88vw;text-align:center}.alarmPopup{position:fixed;left:12px;right:12px;top:18%;z-index:120;background:#fff8c7;border:2px solid #e7b90b;border-radius:14px;padding:16px;box-shadow:0 10px 32px #0004;display:none}.alarmPopup.show{display:block}.alarmPopup h3{margin:0 0 8px}.alarmPopup button{width:100%;border:0;border-radius:9px;background:var(--y);padding:11px;font-weight:900;margin-top:10px}@media(max-width:430px){.card{padding:5px 6px}.list{gap:3px}.text{font-size:12.5px}}
</style>
</head>
<body>
<div class="app"><header class="top"><div class="toprow"><div><div class="title">📝 Notlarım</div><div id="todayLabel" class="date"></div></div><div class="topactions"><button class="iconbtn" onclick="openNewNote()">＋</button><button class="logout" onclick="logoutMobile()">Çıkış</button></div></div></header><main><div id="list" class="list"></div></main><button class="fab" onclick="openNewNote()">+</button></div>
<section id="editor" class="editor"><div class="editorhead"><button class="back" onclick="closeEditor()">‹</button><div id="editorTitle" class="etitle">Yeni Not</div><button class="panelbtn" onclick="openDrawer()">☰</button><button class="save" onclick="saveNote()">Kaydet</button></div><div class="paper"><textarea id="noteText" placeholder="Notunuzu yazın..."></textarea></div></section>
<div id="drawerOverlay" class="drawerOverlay" onclick="closeDrawer()"></div><aside id="drawer" class="drawer"><div class="drawerhead"><b>Not Ayarları</b><button class="closeDrawer" onclick="closeDrawer()">✕</button></div><div class="sectionTitle">TARİH VE ALARM</div><div class="field"><label>NOT TARİHİ</label><input id="noteDate" type="date"></div><div class="field"><label>ALARM SAATİ</label><input id="noteTime" type="time" step="60"></div><div class="alarmStatus">🔊 Alarm zamanı geldiğinde sayfa açıkken sesli uyarı ve titreşim verilir.</div><div class="drawerActions"><button class="newpage" onclick="newPageFromDrawer()">＋ Yeni Not Sayfası</button><button id="doneButton" class="donebtn" onclick="toggleCurrentDone()">✓ Tamamlandı</button><button id="deleteButton" class="delete" onclick="deleteCurrentNote()">Sil</button></div></aside>
<div id="login" class="login"><div class="loginbox"><div class="loginhead">📝 Notlarım</div><div class="loginbody"><input id="pw" type="password" placeholder="Şifre" onkeydown="if(event.key==='Enter')loginMobile()"><button onclick="loginMobile()">Giriş Yap</button><div id="loginerr" class="err"></div></div></div></div><div id="msg" class="msg"></div>
<div id="alarmPopup" class="alarmPopup"><h3>🔔 Hatırlatma</h3><div id="alarmPopupText"></div><button onclick="dismissAlarm()">Tamam</button></div>
<script>
(function(){
const state={items:[],editingId:null,fired:new Set(),audioCtx:null};const $=id=>document.getElementById(id);const pad=n=>String(n).padStart(2,'0');const dateKey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());const monthKey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1);const today=()=>dateKey(new Date());const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function flash(t){const m=$('msg');m.textContent=t;m.style.display='block';clearTimeout(window.__m);window.__m=setTimeout(()=>m.style.display='none',2100)}
async function api(path,opts){const r=await fetch(path,Object.assign({headers:{'content-type':'application/json'}},opts||{}));let d={};try{d=await r.json()}catch(_){ }if(!r.ok)throw new Error(d.error||'İşlem başarısız');return d}
function item(id){return state.items.find(x=>Number(x.id)===Number(id))}
function fd(v){if(!v)return'';const p=String(v).slice(0,10).split('-').map(Number);return new Date(p[0],p[1]-1,p[2],12).toLocaleDateString('tr-TR',{day:'numeric',month:'short'})}
function fa(v){if(!v)return'';const d=new Date(v);return d.toLocaleDateString('tr-TR',{day:'numeric',month:'short'})+' '+d.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})}
function fc(v){if(!v)return'';let s=String(v).trim().replace(' ','T');if(!/[zZ]|[+-]\d\d:?\d\d$/.test(s))s+='Z';const d=new Date(s);if(Number.isNaN(d.getTime()))return'';return d.toLocaleDateString('tr-TR',{day:'2-digit',month:'2-digit',year:'numeric'})+' '+d.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})}
function render(){const arr=[...state.items].sort((a,b)=>Number(a.entry_status==='Yapıldı')-Number(b.entry_status==='Yapıldı')||String(b.entry_date).localeCompare(String(a.entry_date))||Number(b.id)-Number(a.id));$('list').innerHTML=arr.length?arr.map(x=>'<article class="card '+(x.entry_status==='Yapıldı'?'done':'')+'" onclick="openEditNote('+x.id+')"><div class="row"><input class="check" type="checkbox" '+(x.entry_status==='Yapıldı'?'checked':'')+' onclick="event.stopPropagation()" onchange="setDone('+x.id+',this.checked)"><div class="text">'+esc(x.note)+'</div></div><div class="meta"><span class="badge">📅 '+esc(fd(x.entry_date))+'</span><span class="badge created">Giriş: '+esc(fc(x.created_at))+'</span>'+(x.remind_at?'<span class="badge">🔔 '+esc(fa(x.remind_at))+'</span>':'')+'</div></article>').join(''):'<div class="empty"><div class="i">📝</div><b>Henüz not yok</b><div>Sağ alttaki + ile not ekleyin.</div></div>'}
async function loadNotes(){try{await api('/api/agenda/rollover',{method:'POST',body:JSON.stringify({today:today()})});state.items=await api('/api/agenda?month='+monthKey(new Date()));render()}catch(e){if(/Oturum|Giriş|Yetki/i.test(String(e.message)))$('login').classList.add('show');else flash(e.message)}}
function prepareAudio(){try{if(!state.audioCtx)state.audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(state.audioCtx.state==='suspended')state.audioCtx.resume()}catch(_){ }}
function ring(){prepareAudio();try{const ctx=state.audioCtx;if(!ctx)return;[0,0.28,0.56].forEach((delay,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=i%2?880:660;g.gain.setValueAtTime(.001,ctx.currentTime+delay);g.gain.exponentialRampToValueAtTime(.3,ctx.currentTime+delay+.02);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+delay+.22);o.connect(g);g.connect(ctx.destination);o.start(ctx.currentTime+delay);o.stop(ctx.currentTime+delay+.24)})}catch(_){ }try{navigator.vibrate&&navigator.vibrate([250,120,250,120,400])}catch(_){ }}
function checkAlarms(){const now=Date.now();state.items.forEach(x=>{if(!x.remind_at||x.entry_status==='Yapıldı')return;const t=new Date(x.remind_at).getTime();if(!Number.isFinite(t))return;const k=String(x.id)+'|'+x.remind_at;if(now>=t&&now-t<65000&&!state.fired.has(k)){state.fired.add(k);$('alarmPopupText').textContent=x.note||'Not hatırlatması';$('alarmPopup').classList.add('show');ring()}})}
window.dismissAlarm=function(){$('alarmPopup').classList.remove('show')};
window.openDrawer=function(){prepareAudio();$('drawer').classList.add('show');$('drawerOverlay').classList.add('show')};window.closeDrawer=function(){$('drawer').classList.remove('show');$('drawerOverlay').classList.remove('show')};
window.openNewNote=function(){prepareAudio();state.editingId=null;$('editorTitle').textContent='Yeni Not';$('noteText').value='';$('noteDate').value=today();$('noteTime').value='';$('deleteButton').style.display='none';$('doneButton').style.display='none';$('editor').classList.add('show');closeDrawer();setTimeout(()=>$('noteText').focus(),60)};
window.newPageFromDrawer=function(){openNewNote()};
window.openEditNote=function(id){prepareAudio();const x=item(id);if(!x)return;state.editingId=Number(id);$('editorTitle').textContent='Notu Düzenle';$('noteText').value=x.note||'';$('noteDate').value=x.entry_date||today();if(x.remind_at){const d=new Date(x.remind_at);$('noteTime').value=pad(d.getHours())+':'+pad(d.getMinutes())}else $('noteTime').value='';$('deleteButton').style.display='block';$('doneButton').style.display='block';$('doneButton').textContent=x.entry_status==='Yapıldı'?'↩ Yapılacak':'✓ Tamamlandı';$('editor').classList.add('show');closeDrawer()};
window.closeEditor=function(){closeDrawer();$('editor').classList.remove('show');state.editingId=null};
window.saveNote=async function(){try{const note=$('noteText').value.trim();if(!note)return flash('Not yazmalısınız.');const date=$('noteDate').value||today(),time=String($('noteTime').value||'').trim();const remind=time?date+'T'+time:'';const id=state.editingId;await api(id?'/api/agenda/'+id:'/api/agenda',{method:id?'PUT':'POST',body:JSON.stringify({entry_date:date,note,remind_at:remind})});closeEditor();await loadNotes();flash(id?'Not güncellendi.':'Not eklendi.')}catch(e){flash(e.message)}};
window.deleteCurrentNote=async function(){if(!state.editingId)return;try{await api('/api/agenda/'+state.editingId,{method:'DELETE'});closeEditor();await loadNotes();flash('Not silindi.')}catch(e){flash(e.message)}};
window.setDone=async function(id,done){try{await api('/api/agenda/'+id+(done?'/task-done':'/task-undo'),{method:'POST',body:done?JSON.stringify({completed_date:today()}):'{}'});await loadNotes()}catch(e){flash(e.message)}};
window.toggleCurrentDone=async function(){const x=item(state.editingId);if(!x)return;await setDone(x.id,x.entry_status!=='Yapıldı');closeDrawer();closeEditor()};
window.loginMobile=async function(){const err=$('loginerr');err.textContent='';prepareAudio();try{const r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({user:'Ali',password:$('pw').value})});let d={};try{d=await r.json()}catch(_){ }if(!r.ok){err.textContent=d.error||'Şifre hatalı.';return}$('pw').value='';$('login').classList.remove('show');await loadNotes()}catch(_){err.textContent='Bağlantı kurulamadı.'}};
window.logoutMobile=async function(){try{await fetch('/api/logout')}catch(_){ }$('login').classList.add('show')};
async function boot(){$('todayLabel').textContent=new Date().toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});document.addEventListener('pointerdown',prepareAudio,{once:true});try{const s=await api('/api/session');if(s.role!=='admin')throw new Error('Oturum');await loadNotes()}catch(_){$('login').classList.add('show')}setInterval(checkAlarms,15000)}boot()})();
</script>
</body></html>
