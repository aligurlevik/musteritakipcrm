<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Notlarım</title>
<style>
:root{--y:#ffd338;--ink:#262626;--bg:#f3f4f6;--muted:#777;--green:#13966f;--red:#d83b3b}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,textarea{font:inherit}.app{max-width:720px;min-height:100vh;margin:0 auto;background:#f7f7f8}.top{position:sticky;top:0;z-index:20;background:var(--y);padding:12px 14px;box-shadow:0 2px 7px #0002}.toprow{display:flex;align-items:center;justify-content:space-between}.title{font-size:24px;font-weight:900}.date{font-size:11px;font-weight:800;color:#6b5700;margin-top:3px}.logout{border:0;background:#ffffff80;border-radius:9px;padding:7px 9px;font-weight:900;color:#584900}.list{display:grid;gap:7px;padding:9px 9px 90px}.card{border:1px solid #eadb91;border-left:5px solid #e7b90b;border-radius:9px;background:#fff8c9;padding:8px 9px;box-shadow:0 1px 4px #0000000f;min-height:58px;cursor:pointer}.card:nth-child(4n+2){background:#eaf6ea;border-color:#c6e2c9;border-left-color:#43a047}.card:nth-child(4n+3){background:#e9f4ff;border-color:#c7dff3;border-left-color:#2684d8}.card:nth-child(4n+4){background:#fdebf1;border-color:#efced9;border-left-color:#d94b7b}.card.done{opacity:.58}.row{display:grid;grid-template-columns:22px minmax(0,1fr);gap:7px}.check{width:19px;height:19px;margin-top:1px}.text{font-size:14px;line-height:1.3;font-weight:650;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;word-break:break-word}.meta{margin:4px 0 0 29px;display:flex;gap:5px;flex-wrap:wrap;font-size:10px;font-weight:800;color:#6d5c1c}.badge{padding:2px 5px;border-radius:999px;background:#ffffff9e;border:1px solid #0000000b}.empty{text-align:center;color:#888;padding-top:28vh}.empty .i{font-size:42px}.fab{position:fixed;right:max(18px,calc((100vw - 720px)/2 + 18px));bottom:22px;width:56px;height:56px;border:0;border-radius:50%;background:var(--y);font-size:34px;color:#4e4100;box-shadow:0 4px 14px #0004;z-index:30}.editor{position:fixed;inset:0;display:none;flex-direction:column;background:#fffef7;z-index:60}.editor.show{display:flex}.editorhead{display:grid;grid-template-columns:42px 1fr auto;align-items:center;background:var(--y);padding:8px 9px;box-shadow:0 2px 7px #0002}.back{border:0;background:transparent;font-size:28px}.etitle{font-size:18px;font-weight:900}.save{border:0;background:#fff6c6;border-radius:8px;padding:8px 10px;font-weight:900}.paper{flex:1;min-height:0;display:flex;padding-left:34px;background-color:#fffef8;background-image:linear-gradient(90deg,transparent 0,transparent 25px,#ef9a9a 26px,#ef9a9a 27px,transparent 28px),repeating-linear-gradient(to bottom,transparent 0,transparent 34px,#d8e6f5 35px,transparent 36px)}.paper textarea{flex:1;border:0;outline:0;resize:none;background:transparent;padding:12px 10px;font-size:17px;line-height:35px}.alarm{border-top:1px solid #e7dfc3;background:#fffdf0;padding:9px 10px calc(9px + env(safe-area-inset-bottom))}.alarmtitle{font-size:11px;font-weight:900;color:#8a6500;margin-bottom:6px}.alarmrow{display:grid;grid-template-columns:minmax(0,1fr) 68px 68px;gap:6px}.alarmrow input{width:100%;min-width:0;border:1px solid #d9ca82;border-radius:8px;padding:9px 7px;background:#fff}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px}.delete,.donebtn{border:0;border-radius:8px;padding:9px;font-weight:900}.delete{background:#fee2e2;color:#a51d1d}.donebtn{background:#e7f5ef;color:#087753}.login{position:fixed;inset:0;background:#f3f4f6;display:none;align-items:center;justify-content:center;padding:18px;z-index:100}.login.show{display:flex}.loginbox{width:min(380px,100%);background:white;border-radius:14px;overflow:hidden;box-shadow:0 8px 28px #0002}.loginhead{background:var(--y);padding:17px;font-size:22px;font-weight:900}.loginbody{padding:16px}.loginbody input{width:100%;padding:11px;border:1px solid #d4d4d4;border-radius:9px}.loginbody button{width:100%;border:0;border-radius:9px;background:var(--y);padding:11px;margin-top:9px;font-weight:900}.err{color:#b91c1c;font-size:12px;margin-top:7px}.msg{position:fixed;left:50%;bottom:15px;transform:translateX(-50%);background:#1f2937;color:#fff;border-radius:9px;padding:9px 12px;font-weight:800;display:none;z-index:110;max-width:88vw;text-align:center}
</style>
</head>
<body>
<div class="app"><header class="top"><div class="toprow"><div><div class="title">📝 Notlarım</div><div id="todayLabel" class="date"></div></div><button class="logout" onclick="logoutMobile()">Çıkış</button></div></header><main><div id="list" class="list"></div></main><button class="fab" onclick="openNewNote()">+</button></div>
<section id="editor" class="editor"><div class="editorhead"><button class="back" onclick="closeEditor()">‹</button><div id="editorTitle" class="etitle">Yeni Not</div><button class="save" onclick="saveNote()">Kaydet</button></div><div class="paper"><textarea id="noteText" placeholder="Notunuzu yazın..."></textarea></div><div class="alarm"><div class="alarmtitle">🔔 ALARM / HATIRLATMA</div><div class="alarmrow"><input id="noteDate" type="date"><input id="noteHour" type="number" min="0" max="23" inputmode="numeric" placeholder="Saat"><input id="noteMinute" type="number" min="0" max="59" inputmode="numeric" placeholder="Dk"></div><div class="actions"><button id="deleteButton" class="delete" onclick="deleteCurrentNote()">Sil</button><button id="doneButton" class="donebtn" onclick="toggleCurrentDone()">✓ Tamamlandı</button></div></div></section>
<div id="login" class="login"><div class="loginbox"><div class="loginhead">📝 Notlarım</div><div class="loginbody"><input id="pw" type="password" placeholder="Şifre" onkeydown="if(event.key==='Enter')loginMobile()"><button onclick="loginMobile()">Giriş Yap</button><div id="loginerr" class="err"></div></div></div></div><div id="msg" class="msg"></div>
<script>
(function(){const state={items:[],editingId:null};const $=id=>document.getElementById(id);const pad=n=>String(n).padStart(2,'0');const dateKey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());const monthKey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1);const today=()=>dateKey(new Date());const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function flash(t){const m=$('msg');m.textContent=t;m.style.display='block';clearTimeout(window.__m);window.__m=setTimeout(()=>m.style.display='none',2100)}async function api(path,opts){const r=await fetch(path,Object.assign({headers:{'content-type':'application/json'}},opts||{}));let d={};try{d=await r.json()}catch(_){ }if(!r.ok)throw new Error(d.error||'İşlem başarısız');return d}function item(id){return state.items.find(x=>Number(x.id)===Number(id))}function fd(v){if(!v)return'';const p=v.split('-').map(Number);return new Date(p[0],p[1]-1,p[2],12).toLocaleDateString('tr-TR',{day:'numeric',month:'short'})}function fa(v){if(!v)return'';const d=new Date(v);return d.toLocaleDateString('tr-TR',{day:'numeric',month:'short'})+' '+d.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})}function render(){const arr=[...state.items].sort((a,b)=>Number(a.entry_status==='Yapıldı')-Number(b.entry_status==='Yapıldı')||String(b.entry_date).localeCompare(String(a.entry_date))||Number(b.id)-Number(a.id));$('list').innerHTML=arr.length?arr.map(x=>'<article class="card '+(x.entry_status==='Yapıldı'?'done':'')+'" onclick="openEditNote('+x.id+')"><div class="row"><input class="check" type="checkbox" '+(x.entry_status==='Yapıldı'?'checked':'')+' onclick="event.stopPropagation()" onchange="setDone('+x.id+',this.checked)"><div class="text">'+esc(x.note)+'</div></div><div class="meta"><span class="badge">📅 '+esc(fd(x.entry_date))+'</span>'+(x.remind_at?'<span class="badge">🔔 '+esc(fa(x.remind_at))+'</span>':'')+'</div></article>').join(''):'<div class="empty"><div class="i">📝</div><b>Henüz not yok</b><div>Sağ alttaki + ile not ekleyin.</div></div>'}async function loadNotes(){try{await api('/api/agenda/rollover',{method:'POST',body:JSON.stringify({today:today()})});state.items=await api('/api/agenda?month='+monthKey(new Date()));render()}catch(e){if(/Oturum|Giriş|Yetki/i.test(String(e.message)))$('login').classList.add('show');else flash(e.message)}}window.openNewNote=function(){state.editingId=null;$('editorTitle').textContent='Yeni Not';$('noteText').value='';$('noteDate').value=today();$('noteHour').value='';$('noteMinute').value='';$('deleteButton').style.visibility='hidden';$('doneButton').style.visibility='hidden';$('editor').classList.add('show');setTimeout(()=>$('noteText').focus(),60)};window.openEditNote=function(id){const x=item(id);if(!x)return;state.editingId=Number(id);$('editorTitle').textContent='Notu Düzenle';$('noteText').value=x.note||'';$('noteDate').value=x.entry_date||today();if(x.remind_at){const d=new Date(x.remind_at);$('noteHour').value=pad(d.getHours());$('noteMinute').value=pad(d.getMinutes())}else{$('noteHour').value='';$('noteMinute').value=''}$('deleteButton').style.visibility='visible';$('doneButton').style.visibility='visible';$('doneButton').textContent=x.entry_status==='Yapıldı'?'↩ Yapılacak':'✓ Tamamlandı';$('editor').classList.add('show')};window.closeEditor=function(){$('editor').classList.remove('show');state.editingId=null};window.saveNote=async function(){try{const note=$('noteText').value.trim();if(!note)return flash('Not yazmalısınız.');const date=$('noteDate').value||today(),h=String($('noteHour').value||'').trim(),m=String($('noteMinute').value||'').trim();if(h!==''&&(Number(h)<0||Number(h)>23))return flash('Saat 0-23 olmalı.');if(m!==''&&(Number(m)<0||Number(m)>59))return flash('Dakika 0-59 olmalı.');const remind=h!==''?date+'T'+pad(Number(h))+':'+pad(Number(m||0)):'';const id=state.editingId;await api(id?'/api/agenda/'+id:'/api/agenda',{method:id?'PUT':'POST',body:JSON.stringify({entry_date:date,note,remind_at:remind})});closeEditor();await loadNotes();flash(id?'Not güncellendi.':'Not eklendi.')}catch(e){flash(e.message)}};window.deleteCurrentNote=async function(){if(!state.editingId)return;try{await api('/api/agenda/'+state.editingId,{method:'DELETE'});closeEditor();await loadNotes();flash('Not silindi.')}catch(e){flash(e.message)}};window.setDone=async function(id,done){try{await api('/api/agenda/'+id+(done?'/task-done':'/task-undo'),{method:'POST',body:done?JSON.stringify({completed_date:today()}):'{}'});await loadNotes()}catch(e){flash(e.message)}};window.toggleCurrentDone=async function(){const x=item(state.editingId);if(!x)return;await setDone(x.id,x.entry_status!=='Yapıldı');closeEditor()};window.loginMobile=async function(){const err=$('loginerr');err.textContent='';try{const r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({user:'Ali',password:$('pw').value})});let d={};try{d=await r.json()}catch(_){ }if(!r.ok){err.textContent=d.error||'Şifre hatalı.';return}$('pw').value='';$('login').classList.remove('show');await loadNotes()}catch(_){err.textContent='Bağlantı kurulamadı.'}};window.logoutMobile=async function(){try{await fetch('/api/logout')}catch(_){ }$('login').classList.add('show')};async function boot(){$('todayLabel').textContent=new Date().toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});try{const s=await api('/api/session');if(s.role!=='admin')throw new Error('Oturum');await loadNotes()}catch(_){$('login').classList.add('show')}}boot()})();
</script>
</body></html>
