name: Build Android Alarm APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-alarm/**"
      - ".github/workflows/android-alarm.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle -p android-alarm assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: CRM-Alarm-debug-apk
          path: android-alarm/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
