name: Deploy CRM to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Reminder diagnostics
        run: |
          npx wrangler d1 execute musteri-takip-crm --remote --command "SELECT COUNT(*) AS enabled_devices FROM crm_push_devices WHERE enabled=1;"
          npx wrangler d1 execute musteri-takip-crm --remote --command "SELECT id,last_started_at,last_finished_at,last_sent,last_devices,last_due,last_error FROM crm_push_runtime WHERE id=1;"
          npx wrangler d1 execute musteri-takip-crm --remote --command "SELECT id,remind_at,reminder_status,entry_status,COALESCE(source_type,'manual') AS source_type,COALESCE(is_archived,0) AS is_archived,COALESCE(notebook_no,1) AS notebook_no FROM agenda_entries WHERE COALESCE(remind_at,'')<>'' ORDER BY id DESC LIMIT 8;"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
