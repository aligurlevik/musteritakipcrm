name: Deploy CRM to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Parse Windows alarm PowerShell
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'public/windows-alarm-agent.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host 'windows-alarm-agent.ps1 PowerShell parse OK'

      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Rich portfolio screen smoke
        run: |
          ok=0
          for attempt in $(seq 1 15); do
            echo "portfolio smoke attempt $attempt/15"
            curl --fail --silent --show-error \
              -D /tmp/portfolio-headers.txt \
              -o /tmp/portfolio.html \
              "https://musteri-takip-crm.musteritakipcrm.workers.dev/musteri-portfoyu.html?smoke=$attempt"

            if grep -Fq 'PORTFOY RICH V19' /tmp/portfolio.html \
              && grep -Fq 'Günlük Değerlendirme' /tmp/portfolio.html \
              && grep -Fq '<th>Son Görüşme</th>' /tmp/portfolio.html \
              && grep -Fq 'Müşteri Analizi' /tmp/portfolio.html \
              && grep -Fq 'company-open-btn' /tmp/portfolio.html \
              && grep -Fq "api('/api/portfolio-bootstrap?ts='+Date.now())" /tmp/portfolio.html \
              && grep -Fq "api('/api/portfolio-meetings?ts='+Date.now())" /tmp/portfolio.html \
              && grep -Fq 'PORTFOLIO_CACHE_KEY' /tmp/portfolio.html \
              && grep -Fq 'minmax(690px,1.08fr)' /tmp/portfolio.html \
              && grep -Fq 'detail-title{font-size:20px' /tmp/portfolio.html \
              && grep -Fq 'info-row input,.info-row select{font-size:12.5px' /tmp/portfolio.html \
              && grep -Fq 'Memnuniyet Durumu' /tmp/portfolio.html \
              && grep -Fq 'Şikayet Durumu' /tmp/portfolio.html \
              && grep -Fq 'Kaybedilme Sebebi' /tmp/portfolio.html \
              && grep -Fq 'Müşteri Analizini Kaydet' /tmp/portfolio.html \
              && grep -Fq 'body:not(.customer-open) .workspace .detail{display:none' /tmp/portfolio.html \
              && grep -Fq "classList.add('customer-open')" /tmp/portfolio.html \
              && grep -qi '^x-crm-portfolio-screen: clean-v3-inline' /tmp/portfolio-headers.txt \
              && ! grep -q 'portfolio-fullscreen-detail.js\|portfolio-fullscreen-stable.js' /tmp/portfolio.html; then
              ok=1
              break
            fi
            sleep 2
          done

          if [ "$ok" -ne 1 ]; then
            echo 'rich portfolio production smoke FAILED'
            exit 1
          fi

          http_code=$(curl --silent --output /tmp/bootstrap-unauth.json --write-out '%{http_code}' \
            'https://musteri-takip-crm.musteritakipcrm.workers.dev/api/portfolio-bootstrap')
          [ "$http_code" = "401" ] || (echo "portfolio bootstrap unauth expected 401, got $http_code"; cat /tmp/bootstrap-unauth.json; exit 1)

          if grep -q 'data-tab="orders"\|id="tabOrders"\|orderSummary' /tmp/portfolio.html; then echo 'orders tab still present'; exit 1; fi
          grep -Fq 'data-tab="mails"' /tmp/portfolio.html || (echo 'mail tab missing'; exit 1)
          grep -Fq 'id="tabMails"' /tmp/portfolio.html || (echo 'mail pane missing'; exit 1)
          grep -Fq 'id="mailHistory"' /tmp/portfolio.html || (echo 'mail history missing'; exit 1)
          grep -Fq 'grid-template-columns:repeat(5,minmax(120px,1fr))' /tmp/portfolio.html || (echo 'five-column tabs missing'; exit 1)
          grep -Fq 'Yetkili Kişiler' /tmp/portfolio.html || (echo 'contact people panel missing'; exit 1)
          grep -Fq 'Yetkili Adı Soyadı' /tmp/portfolio.html || (echo 'contact name field missing'; exit 1)
          grep -Fq 'function toggleContactPerson(i)' /tmp/portfolio.html || (echo 'contact expand function missing'; exit 1)
          grep -Fq 'contacts:cleanContacts' /tmp/portfolio.html || (echo 'contact save payload missing'; exit 1)
          grep -Fq 'if(portfolioLoadInFlight)return' /tmp/portfolio.html || (echo 'portfolio load guard missing'; exit 1)
          grep -Fq 'if(meetingLoadInFlight)return' /tmp/portfolio.html || (echo 'meeting load guard missing'; exit 1)
          grep -Fq 'content-visibility:auto' /tmp/portfolio.html || (echo 'contact lazy-render CSS missing'; exit 1)
          grep -Fq 'async function ensureSelectedHistory()' /tmp/portfolio.html || (echo 'lazy history loader missing'; exit 1)
          grep -Fq "if(name!=='general')ensureSelectedHistory()" /tmp/portfolio.html || (echo 'lazy tab history trigger missing'; exit 1)
          grep -Fq 'function refreshPortfolioDataSilently()' /tmp/portfolio.html || (echo 'silent refresh missing'; exit 1)
          grep -Fq 'const cached=readCustomerCache()' /tmp/portfolio.html || (echo 'cache-first loader missing'; exit 1)
          grep -Fq 'Yeni Görüşme / Not Ekle' /tmp/portfolio.html || (echo 'meeting note composer missing'; exit 1)
          grep -Fq 'id="meetingNoteDate"' /tmp/portfolio.html || (echo 'meeting note date missing'; exit 1)
          grep -Fq 'function saveMeetingNote()' /tmp/portfolio.html || (echo 'meeting note save function missing'; exit 1)
          grep -Fq 'note-date' /tmp/portfolio.html || (echo 'dated normal note renderer missing'; exit 1)
          echo 'dated notes composer: OK'
          echo 'instant interaction mode: OK'
          echo 'performance guards: OK'
          echo 'multiple contact people: OK'
          if grep -Fq '<th>Mail</th>' /tmp/portfolio.html; then echo 'main mail column still present'; exit 1; fi
          grep -Fq 'follow-future' /tmp/portfolio.html || (echo 'future row class missing'; exit 1)
          grep -Fq 'follow-overdue' /tmp/portfolio.html || (echo 'overdue row class missing'; exit 1)
          grep -Fq 'follow-today' /tmp/portfolio.html || (echo 'today row class missing'; exit 1)
          grep -Fq '@keyframes dueTodayPulse' /tmp/portfolio.html || (echo 'today blink animation missing'; exit 1)
          grep -Fq 'Gelecek' /tmp/portfolio.html || (echo 'future legend missing'; exit 1)
          grep -Fq 'Geçmiş' /tmp/portfolio.html || (echo 'past legend missing'; exit 1)
          echo 'follow-date row colors: OK'
          echo 'main mail column removed: OK'
          echo 'rightmost mail tab: OK'
          echo 'orders tab removed: OK'
          echo 'portfolio page V19: OK'
          echo 'portfolio bootstrap route: OK'
          curl --fail --silent --show-error \
            'https://musteri-takip-crm.musteritakipcrm.workers.dev/api/portfolio-health' \
            -o /tmp/portfolio-health.json
          cat /tmp/portfolio-health.json
          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('/tmp/portfolio-health.json','utf8'));if(!d.ok||!d.ready||d.version!=='v6-split'){console.error('portfolio health not ready',d);process.exit(1)}console.log('portfolio D1 health: OK')"
          echo 'rich portfolio production smoke OK'

      - name: CRM lazy navigation smoke
        run: |
          crm_live_ok=0
          for attempt in $(seq 1 15); do
            curl --fail --silent --show-error --retry 2 --retry-delay 1 \
              -H 'Cache-Control: no-cache' \
              -o /tmp/crm-index.html \
              "https://musteri-takip-crm.musteritakipcrm.workers.dev/?page=customers&nav-smoke=1&stability-smoke=$attempt"
            if grep -Fq 'const CRM_STABILITY_MODE=true' /tmp/crm-index.html \
              && grep -Fq '/api/graphic-jobs-summary' /tmp/crm-index.html; then
              crm_live_ok=1
              break
            fi
            sleep 2
          done
          [ "$crm_live_ok" -eq 1 ] || (echo 'fresh stability HTML did not propagate'; exit 1)
          grep -Fq 'const CRM_PAGE_CACHE_MS=900000' /tmp/crm-index.html || (echo 'page cache marker missing'; exit 1)
          grep -Fq 'async function loadCrmPageData(page' /tmp/crm-index.html || (echo 'lazy page loader missing'; exit 1)
          grep -Fq 'function activateCrmPage(page' /tmp/crm-index.html || (echo 'instant page activator missing'; exit 1)
          grep -Fq 'crmPageLoadPromises' /tmp/crm-index.html || (echo 'duplicate load guard missing'; exit 1)
          grep -Fq 'id="portfolioFrame"' /tmp/crm-index.html || (echo 'persistent portfolio frame missing'; exit 1)
          grep -Fq 'musteri-portfoyu.html?embedded=1' /tmp/crm-index.html || (echo 'embedded portfolio source missing'; exit 1)
          grep -Fq 'requestAnimationFrame(()=>requestAnimationFrame' /tmp/crm-index.html || (echo 'visual-first page switching missing'; exit 1)
          grep -Fq 'prewarmPortfolioFrame' /tmp/crm-index.html || (echo 'portfolio lazy loader missing'; exit 1)
          grep -Fq 'function ensurePortfolioFrameLoaded()' /tmp/crm-index.html || (echo 'portfolio iframe initializer missing'; exit 1)
          grep -Fq "requested==='portfolio'||saved==='portfolio'" /tmp/crm-index.html || (echo 'portfolio startup escape missing'; exit 1)
          grep -Fq 'portfolioEscapeBtn' /tmp/crm-index.html || (echo 'portfolio escape button missing'; exit 1)
          grep -Fq 'Müşteri Portföyü yüklenemedi. CRM Ana Ekran açıldı.' /tmp/crm-index.html || (echo 'portfolio watchdog fallback missing'; exit 1)
          grep -Fq "getAttribute('src')" /tmp/crm-index.html || (echo 'portfolio iframe src attribute guard missing'; exit 1)
          if grep -Fq "if(frame&&!frame.src)frame.src=frame.dataset.src" /tmp/crm-index.html; then echo 'fragile portfolio iframe src guard still present'; exit 1; fi
          if grep -Fq 'requestIdleCallback(prewarmPortfolioFrame' /tmp/crm-index.html; then echo 'background portfolio prewarm still enabled'; exit 1; fi
          grep -Fq 'let crmSwitching=false' /tmp/crm-index.html || (echo 'navigation switch guard missing'; exit 1)
          grep -Fq 'crmDeferredLoadTimer' /tmp/crm-index.html || (echo 'navigation deferred-load guard missing'; exit 1)
          grep -Fq 'const CRM_STABILITY_MODE=true' /tmp/crm-index.html || (echo 'stability mode missing'; exit 1)
          if grep -Fq 'created_from=2000-01-01' /tmp/crm-index.html; then echo 'full-history graphic fetch still present'; exit 1; fi
          grep -Fq "/api/graphic-jobs-summary" /tmp/crm-index.html || (echo 'graphic summary client missing'; exit 1)
          if grep -Fq "Promise.allSettled([loadDashboard(),loadCustomers(),loadMeetings(),loadOffers(),loadMails(),loadAgenda()])" /tmp/crm-index.html; then
            echo 'old heavy all-module startup is still present'
            exit 1
          fi
          echo 'persistent CRM shell: OK'
          echo 'CRM lazy navigation smoke OK'

      - name: Reminder diagnostics
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 2 https://musteri-takip-crm.musteritakipcrm.workers.dev/api/push/health
          echo

# live reminder check 09:06
