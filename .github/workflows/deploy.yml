name: Deploy CRM to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Parse Windows alarm PowerShell
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'public/windows-alarm-agent.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host 'windows-alarm-agent.ps1 PowerShell parse OK'

      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Portfolio company click smoke
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            -D /tmp/portfolio-headers.txt \
            -o /tmp/portfolio.html \
            https://musteri-takip-crm.musteritakipcrm.workers.dev/musteri-portfoyu.html
          echo '--- portfolio headers ---'
          grep -i 'x-crm-company-open\|content-type\|cache-control' /tmp/portfolio-headers.txt || true
          echo '--- portfolio markers ---'
          grep -o -m3 '.\{0,80\}class="company".\{0,180\}' /tmp/portfolio.html || true
          grep -Fq 'PORTFÖY 06.10-E' /tmp/portfolio.html && echo 'build marker: OK' || (echo 'build marker: MISSING'; exit 1)
          grep -Fq 'href="/?page=customers&editCustomer=${c.id}"' /tmp/portfolio.html && echo 'native company link: OK' || (echo 'native company link: MISSING'; exit 1)
          grep -Fq 'crm-company-native-link' /tmp/portfolio.html && echo 'native link class: OK' || (echo 'native link class: MISSING'; exit 1)
          grep -qi '^x-crm-company-open: native-link-v3' /tmp/portfolio-headers.txt && echo 'response header: OK' || (echo 'response header: MISSING'; exit 1)
          curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            -o /tmp/index.html \
            'https://musteri-takip-crm.musteritakipcrm.workers.dev/?page=customers&editCustomer=1'
          grep -Fq 'openRequestedCustomerFromUrl' /tmp/index.html && echo 'customer URL opener: OK' || (echo 'customer URL opener: MISSING'; exit 1)
          grep -Fq 'crm-direct-customer' /tmp/index.html && echo 'fullscreen customer modal: OK' || (echo 'fullscreen customer modal: MISSING'; exit 1)
          echo 'portfolio native company navigation production smoke OK'

      - name: Reminder diagnostics
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 2 https://musteri-takip-crm.musteritakipcrm.workers.dev/api/push/health
          echo

# live reminder check 09:06
