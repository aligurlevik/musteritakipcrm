name: Deploy CRM to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Parse Windows alarm PowerShell
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'public/windows-alarm-agent.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host 'windows-alarm-agent.ps1 PowerShell parse OK'

      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Clean portfolio screen smoke
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            -D /tmp/portfolio-headers.txt \
            -o /tmp/portfolio.html \
            https://musteri-takip-crm.musteritakipcrm.workers.dev/musteri-portfoyu.html
          echo '--- portfolio headers ---'
          grep -i 'x-crm-portfolio-screen\|content-type\|cache-control' /tmp/portfolio-headers.txt || true
          echo '--- clean portfolio markers ---'
          grep -Fq 'PORTFOY CLEAN V2' /tmp/portfolio.html && echo 'clean screen marker: OK' || (echo 'clean screen marker: MISSING'; exit 1)
          grep -Fq 'data-open-customer' /tmp/portfolio.html && echo 'customer buttons: OK' || (echo 'customer buttons: MISSING'; exit 1)
          grep -Fq 'function openCustomerCard(id)' /tmp/portfolio.html && echo 'customer opener: OK' || (echo 'customer opener: MISSING'; exit 1)
          grep -Fq "customerRows').addEventListener('click'" /tmp/portfolio.html && echo 'isolated click handler: OK' || (echo 'isolated click handler: MISSING'; exit 1)
          grep -qi '^x-crm-portfolio-screen: clean-v3-inline' /tmp/portfolio-headers.txt && echo 'clean response header: OK' || (echo 'clean response header: MISSING'; exit 1)
          if grep -q 'portfolio-fullscreen-detail.js\|portfolio-fullscreen-stable.js\|onclick="selectCustomer' /tmp/portfolio.html; then
            echo 'legacy portfolio click layer still present'
            exit 1
          fi
          echo 'clean portfolio production smoke OK'

      - name: Reminder diagnostics
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 2 https://musteri-takip-crm.musteritakipcrm.workers.dev/api/push/health
          echo

# live reminder check 09:06
