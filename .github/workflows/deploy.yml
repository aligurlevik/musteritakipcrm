name: Deploy CRM to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Parse Windows alarm PowerShell
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'public/windows-alarm-agent.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host 'windows-alarm-agent.ps1 PowerShell parse OK'

      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Rich portfolio screen smoke
        run: |
          ok=0
          for attempt in $(seq 1 15); do
            echo "portfolio smoke attempt $attempt/15"
            curl --fail --silent --show-error \
              -D /tmp/portfolio-headers.txt \
              -o /tmp/portfolio.html \
              "https://musteri-takip-crm.musteritakipcrm.workers.dev/musteri-portfoyu.html?smoke=$attempt"

            if grep -Fq 'PORTFOY RICH V5' /tmp/portfolio.html \
              && grep -Fq 'Günlük Değerlendirme' /tmp/portfolio.html \
              && grep -Fq '<th>Mail</th>' /tmp/portfolio.html \
              && grep -Fq '<th>Son Görüşme</th>' /tmp/portfolio.html \
              && grep -Fq 'Müşteri Analizi' /tmp/portfolio.html \
              && grep -Fq 'company-open-btn' /tmp/portfolio.html \
              && grep -Fq "api('/api/portfolio-bootstrap')" /tmp/portfolio.html \
              && grep -Fq "classList.add('customer-open')" /tmp/portfolio.html \
              && grep -qi '^x-crm-portfolio-screen: clean-v3-inline' /tmp/portfolio-headers.txt \
              && ! grep -q 'portfolio-fullscreen-detail.js\|portfolio-fullscreen-stable.js' /tmp/portfolio.html; then
              ok=1
              break
            fi
            sleep 2
          done

          if [ "$ok" -ne 1 ]; then
            echo 'rich portfolio production smoke FAILED'
            exit 1
          fi

          http_code=$(curl --silent --output /tmp/bootstrap-unauth.json --write-out '%{http_code}' \
            'https://musteri-takip-crm.musteritakipcrm.workers.dev/api/portfolio-bootstrap')
          [ "$http_code" = "401" ] || (echo "portfolio bootstrap unauth expected 401, got $http_code"; cat /tmp/bootstrap-unauth.json; exit 1)

          echo 'portfolio page V5: OK'
          echo 'portfolio bootstrap route: OK'
          echo 'rich portfolio production smoke OK'

      - name: Portfolio database count
        run: |
          npx wrangler d1 execute musteri-takip-crm --remote --command \
            "SELECT COUNT(*) AS n FROM customers WHERE COALESCE(record_status,'Aktif')<>'Silindi';" --json > /tmp/portfolio-count.json
          cat /tmp/portfolio-count.json
          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('/tmp/portfolio-count.json','utf8'));const n=Number(d?.[0]?.results?.[0]?.n ?? d?.result?.[0]?.results?.[0]?.n ?? 0);if(n<8){console.error('Expected at least 8 active portfolio customers, got',n);process.exit(1)}console.log('active portfolio customers:',n)"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Reminder diagnostics
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 2 https://musteri-takip-crm.musteritakipcrm.workers.dev/api/push/health
          echo

# live reminder check 09:06
