name: Deploy CRM to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Parse Windows alarm PowerShell
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'public/windows-alarm-agent.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host 'windows-alarm-agent.ps1 PowerShell parse OK'

      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Clean portfolio screen smoke
        run: |
          ok=0
          for attempt in $(seq 1 15); do
            echo "portfolio smoke attempt $attempt/15"
            curl --fail --silent --show-error \
              -D /tmp/portfolio-headers.txt \
              -o /tmp/portfolio.html \
              "https://musteri-takip-crm.musteritakipcrm.workers.dev/musteri-portfoyu.html?smoke=$attempt"
            if grep -Fq 'PORTFOY CLEAN V2' /tmp/portfolio.html \
              && grep -Fq 'data-open-customer' /tmp/portfolio.html \
              && grep -Fq 'function openCustomerCard(id)' /tmp/portfolio.html \
              && grep -Fq "customerRows').addEventListener('click'" /tmp/portfolio.html \
              && grep -qi '^x-crm-portfolio-screen: clean-v3-inline' /tmp/portfolio-headers.txt \
              && ! grep -q 'portfolio-fullscreen-detail.js\|portfolio-fullscreen-stable.js\|onclick="selectCustomer' /tmp/portfolio.html; then
              ok=1
              break
            fi
            sleep 2
          done

          echo '--- portfolio headers ---'
          grep -i 'x-crm-portfolio-screen\|content-type\|cache-control' /tmp/portfolio-headers.txt || true
          echo '--- portfolio markers ---'
          grep -F 'PORTFOY CLEAN V2' /tmp/portfolio.html | head -1 || true
          grep -F 'function openCustomerCard(id)' /tmp/portfolio.html | head -1 || true

          if [ "$ok" -ne 1 ]; then
            echo 'clean portfolio production smoke FAILED after propagation wait'
            head -40 /tmp/portfolio.html || true
            exit 1
          fi

          echo 'clean portfolio production smoke OK'

      - name: Reminder diagnostics
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 2 https://musteri-takip-crm.musteritakipcrm.workers.dev/api/push/health
          echo

# live reminder check 09:06
