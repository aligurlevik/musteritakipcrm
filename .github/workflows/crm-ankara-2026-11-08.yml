name: CRM firma adaylarini bir defalik aktar
on:
  push:
    paths:
      - 'scripts/crm-ankara-2026-11-08.sql'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: crm-2026-11-08-customer-import
  cancel-in-progress: false
jobs:
  import-customers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Import verified prospect records without duplicates
        run: npx wrangler d1 execute musteri-takip-crm --remote --file=./scripts/crm-ankara-2026-11-08.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
